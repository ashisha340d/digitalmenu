      .modal--danger #confirmYes {
        background: var(--bad);
        color: #fff;
        border-color: var(--bad);
      }

      .modal--danger #confirmYes:hover {
        filter: brightness(1.15);
      }

      .modal__hd {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        padding: 9px 10px 9px 14px;
        border-bottom: 1px solid var(--gold-soft);
        background: color-mix(in srgb, var(--bg-0) 40%, transparent);
        cursor: move;
        user-select: none;
        touch-action: none;
      }

      :root[data-theme="day"] .modal__hd {
        background: color-mix(in srgb, var(--gold) 10%, transparent);
      }

      .modal__ttl {
        flex: 1;
        min-width: 0;
        font-family: var(--ff-brand);
        font-size: .84rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--gold);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .modal__bd {
        flex: 1;
        overflow: auto;
        padding: 12px 14px;
        overscroll-behavior: contain;
      }

      .modal__ft {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px 12px;
      }

      .msg {
        flex: none;
        min-height: 16px;
        padding: 0 14px 10px;
        font-size: .68rem;
        color: var(--ink-3);
      }

      .msg.is-err {
        color: var(--bad);
      }

      .msg.is-ok {
        color: var(--ok);
      }

      .abtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 34px;
        padding: 0 11px;
        border: 1px solid var(--surface-line);
        border-radius: var(--r-sm);
        background: var(--surface);
        color: var(--gold);
        font-size: .72rem;
        font-weight: 700;
        line-height: 1;
        transition: background var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
      }

      .abtn:hover {
        background: var(--surface-2);
        border-color: var(--gold);
      }

      .abtn .ico {
        font-size: .95rem;
      }

      .abtn--ok {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 45%, transparent);
      }

      .abtn--danger {
        color: var(--bad);
        border-color: color-mix(in srgb, var(--bad) 45%, transparent);
      }

      .abtn[disabled] {
        opacity: .45;
        pointer-events: none;
      }

      .abtn--sq {
        width: 34px;
        padding: 0;
      }

      @media (pointer: coarse) {
        .abtn {
          min-height: 42px;
        }

        .abtn--sq {
          width: 42px;
        }
      }

      .fld {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 11px;
      }

      .fld>label {
        font-size: .58rem;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .pair {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        gap: 7px;
        align-items: center;
      }

      .inp {
        min-width: 0;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--surface-line);
        border-radius: var(--r-sm);
        background: color-mix(in srgb, var(--bg-0) 45%, transparent);
        color: var(--ink);
        font-size: .84rem;
      }

      :root[data-theme="day"] .inp {
        background: rgba(255, 255, 255, .92);
      }

      .inp:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px var(--gold-faint);
      }

      .inp--hi {
        font-family: var(--ff-hi);
      }

      .inp--price {
        text-align: right;
        font-weight: 800;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }

      .chk {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
        cursor: pointer;
        white-space: nowrap;
        font-size: .64rem;
        letter-spacing: .07em;
        text-transform: uppercase;
        color: var(--ink-2);
      }

      .chk input {
        width: 17px;
        height: 17px;
        accent-color: var(--gold-2);
        flex: none;
        cursor: pointer;
      }

      .flags {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 11px;
      }

      .zone {
        display: grid;
        place-items: center;
        gap: 8px;
        padding: 18px;
        border: 2px dashed var(--gold-soft);
        border-radius: var(--r-md);
        color: var(--ink-3);
        font-size: .7rem;
        letter-spacing: .05em;
        text-align: center;
        cursor: pointer;
        transition: border-color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
      }

      .zone:hover,
      .zone.is-over {
        border-color: var(--gold);
        background: var(--row-alt);
        color: var(--ink-2);
      }

      .zone__lot {
        width: 42px;
        height: 42px;
      }

      .zone img {
        max-height: 96px;
        border-radius: var(--r-sm);
      }

      .grp__hd {
        position: sticky;
        top: -12px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 10px 0 5px;
        padding: 7px 10px;
        border: 1px solid var(--surface-line);
        border-radius: var(--r-sm);
        background: color-mix(in srgb, var(--bg-1) 92%, transparent);
        backdrop-filter: blur(8px);
        font-size: .62rem;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .grp__hd .hi {
        letter-spacing: 0;
        text-transform: none;
        color: var(--ink-2);
        font-weight: 600;
      }

      .grp__hd .spacer {
        margin-left: auto;
      }

      .opt {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 40px;
        padding: 5px 10px;
        border-radius: var(--r-sm);
        cursor: pointer;
        font-size: .84rem;
        color: var(--ink);
      }

      .opt:hover {
        background: var(--row-alt);
      }

      .opt input {
        width: 17px;
        height: 17px;
        accent-color: var(--gold-2);
        flex: none;
      }

      .opt img {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--gold-soft);
      }

      .opt .hi {
        color: var(--ink-2);
        font-size: .8rem;
      }

      .opt .pr {
        margin-left: auto;
        font-weight: 800;
        color: var(--gold);
        font-size: .8rem;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .opt.is-off {
        opacity: .48;
      }

      .scrim {
        position: fixed;
        inset: 0;
        z-index: calc(var(--z-modal) - 1);
        background: color-mix(in srgb, var(--bg-0) 62%, transparent);
        backdrop-filter: blur(2px);
        animation: fade-in var(--t-fast) var(--ease-out) both;
      }

      /* ── drag ghost + drop indicators ─────────────────────────────────────── */
      .ghost {
        position: fixed;
        z-index: var(--z-drag);
        pointer-events: none;
        opacity: .92;
        transform-origin: top left;
        box-shadow: var(--elev-3);
        border-radius: var(--r-md);
        overflow: hidden;
        rotate: -1.2deg;
      }

      .is-dragging-src {
        opacity: .3;
      }

      .col.is-drop-target {
        outline: 2px dashed var(--gold-soft);
        outline-offset: -3px;
        border-radius: var(--r-md);
      }

      .drop-line {
        height: 3px;
        margin: -1px 0;
        border-radius: var(--r-pill);
        background: var(--gold);
        box-shadow: 0 0 12px var(--gold);
      }

      .cat.is-drop-into {
        box-shadow: inset 0 0 0 2px var(--gold), var(--elev-2);
      }

      .row.is-drop-before {
        box-shadow: inset 0 3px 0 var(--gold);
      }

      .row.is-drop-after {
        box-shadow: inset 0 -3px 0 var(--gold);
      }

      body.is-dragging {
        cursor: grabbing;
        user-select: none;
      }

      body.is-dragging .cat__hd::after {
        animation-play-state: paused;
      }
    }

    /* ══════════════════════════════════════════════════════════════════════════
   EDITOR — the Admin Portal's live layout editor. Everything here is inert on a
   board on a wall: the markup is hidden and nothing below applies until
   <body class="is-editing">, which only ?edit=1 with a token from the opener sets.
   ══════════════════════════════════════════════════════════════════════════ */
    @layer admin {
      .ed[hidden] { display: none; }

      /* One floating panel rather than a top bar and a side dock.
         The docked version stole 52px from the top and 340px from the right, which shrank
         the board — and every position on this page is a percentage of the viewport, so a
         box dragged against a shrunken board landed somewhere else entirely on the wall.
         Floating the settings over a full-size board keeps what is dragged and what is
         published the same measurement. */
      .edp {
        position: fixed;
        z-index: 2147483000;
        left: var(--ex, 24px);
        top: var(--ey, 24px);
        width: var(--ew, 400px);
        height: var(--eh, 560px);
        min-width: 340px;
        min-height: 140px;
        max-width: 96vw;
        max-height: 94vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #2c2e3a;
        border-radius: 14px;
        background: #12131aF2;
        backdrop-filter: blur(14px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
        color: #e8e9f0;
        font-family: var(--ff-ui, system-ui, sans-serif);
        font-size: 13px;
      }

      .edp.is-min { height: auto !important; }
      .edp.is-min .ed__tabs,
      .edp.is-min .ed__body,
      .edp.is-min .edp__grip { display: none; }

      .edp__hd {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: none;
        padding: 8px 10px;
        border-bottom: 1px solid #2c2e3a;
        cursor: move;
        user-select: none;
        touch-action: none;
        white-space: nowrap;
      }

      /* The title yields first: the buttons are the part that has to stay readable when
         the panel is dragged narrow. */
      .edp__hd .ed__brand { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .edp__hd .ed__screen { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .edp__hd .ed__btn { flex: none; }

      .edp__grip {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        touch-action: none;
        background: linear-gradient(135deg, transparent 50%, #4a4d5e 50%, #4a4d5e 62%, transparent 62%, transparent 74%, #4a4d5e 74%, #4a4d5e 86%, transparent 86%);
      }

      .ed__brand { font-weight: 800; letter-spacing: .02em; }
      .ed__btn--icon { padding: 0; width: 28px; text-align: center; }
      .ed__screen { color: #9aa0b5; font-family: ui-monospace, monospace; font-size: 12px; }
      .ed__spacer { flex: 1; }

      .ed__dirty {
        padding: 3px 9px;
        border-radius: 999px;
        background: #4a3a12;
        color: #f5c451;
        font-size: 11px;
        font-weight: 700;
      }

      .ed__btn {
        min-height: 30px;
        padding: 0 11px;
        white-space: nowrap;
        border: 1px solid #3a3d4d;
        border-radius: 8px;
        background: #1c1e28;
        color: #e8e9f0;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .ed__btn:hover { background: #262936; }
      .ed__btn--primary { background: #6d5ef0; border-color: #6d5ef0; }
      .ed__btn--primary:hover { background: #7d70f5; }
      .ed__btn[disabled] { opacity: .5; cursor: default; }

      .ed__tabs {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        padding: 8px;
        border-bottom: 1px solid #2c2e3a;
      }

      .ed__tab {
        padding: 5px 9px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #9aa0b5;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .ed__tab:hover { background: #1c1e28; color: #e8e9f0; }
      .ed__tab.is-on { background: #6d5ef0; color: #fff; }

      .ed__body { flex: 1; overflow: auto; padding: 12px; font-size: 13px; }
      .ed__sec + .ed__sec { margin-top: 16px; padding-top: 14px; border-top: 1px solid #23252f; }
      .ed__h { margin: 0 0 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: #8e93a8; }
      .ed__note { margin: -4px 0 10px; color: #8e93a8; font-size: 12px; line-height: 1.45; }

      .ed__row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
      .ed__row label { flex: 1; color: #c6c9d8; }

      .ed__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 9px; }
      .ed__f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .ed__f > span { color: #8e93a8; font-size: 11px; font-weight: 600; }

      .ed input[type="text"],
      .ed input[type="number"],
      .ed select,
      .ed textarea {
        width: 100%;
        min-height: 32px;
        padding: 5px 8px;
        border: 1px solid #3a3d4d;
        border-radius: 7px;
        background: #1a1c25;
        color: #e8e9f0;
        font: inherit;
        font-size: 13px;
      }

      .ed input:focus, .ed select:focus, .ed textarea:focus { outline: 2px solid #6d5ef0; outline-offset: -1px; }
      .ed input[type="checkbox"] { width: 16px; min-height: 16px; height: 16px; accent-color: #6d5ef0; }

      .ed__card { padding: 10px; margin-bottom: 9px; border: 1px solid #2c2e3a; border-radius: 9px; background: #171923; }
      .ed__card.is-on { border-color: #6d5ef0; }
      .ed__cardhd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .ed__cardhd strong { flex: 1; font-size: 12px; }

      .ed__x {
        width: 24px; height: 24px;
        border: 1px solid #3a3d4d; border-radius: 6px;
        background: #1c1e28; color: #e8899a;
        font: inherit; line-height: 1; cursor: pointer;
      }

      .ed__add {
        width: 100%; min-height: 32px;
        border: 1px dashed #3a3d4d; border-radius: 8px;
        background: transparent; color: #c6c9d8;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      .ed__add:hover { background: #1c1e28; }

      .ed__chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 4px 3px 8px; margin: 0 4px 4px 0;
        border-radius: 999px; background: #1c1e28; font-size: 12px;
      }
      .ed__chipimg { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
      .ed__find { position: relative; }
      .ed__hits {
        position: absolute; z-index: 5; left: 0; right: 0; top: 100%;
        margin: 3px 0 0; padding: 0; list-style: none; max-height: 220px; overflow: auto;
        border: 1px solid #3a3d4d; border-radius: 8px; background: #1a1c25;
      }
      .ed__hit {
        display: flex; align-items: center; gap: 7px; width: 100%;
        padding: 6px 8px; border: 0; background: transparent;
        color: #e8e9f0; font: inherit; font-size: 12px; text-align: left; cursor: pointer;
      }
      .ed__hit:hover { background: #262936; }
      .ed__hit img { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; }
      .ed__hit b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* The board keeps the whole viewport while the editor is open — see the note on
         `.edp`. Nothing here may change its size, or what is dragged stops matching the
         wall. */

      /* Anything placeable gets an outline and a grab cursor; a live board keeps none of this. */
      body.is-editing [data-ed-move] { cursor: move; }
      body.is-editing [data-ed-pick] { cursor: pointer; }

      body.is-editing [data-ed-pick]:hover,
      body.is-editing [data-ed-move]:hover {
        outline: 2px dashed rgba(109, 94, 240, .75);
        outline-offset: 2px;
      }

      body.is-editing .is-ed-sel {
        outline: 2px solid #6d5ef0 !important;
        outline-offset: 2px;
      }

      body.is-editing .row { cursor: grab; }
      body.is-editing .row.is-ed-drag { opacity: .45; }
      body.is-editing .cat.is-ed-drop { outline: 3px solid #6d5ef0; outline-offset: 3px; }

      /* Held still while a box is being dragged — see the same reasoning as `is-placing`. */
      body.is-dragbox *,
      body.is-dragbox *::before,
      body.is-dragbox *::after {
        animation-play-state: paused !important;
        transition: none !important;
      }
      body.is-dragbox #fxCanvas { display: none; }

      /* One ad's box, drawn only while editing so every ad can be placed at once
         instead of waiting for its turn in the rotation. */
      .edad {
        position: fixed;
        z-index: 2147482900;
        left: var(--ad-x, 21%);
        top: var(--ad-y, 68%);
        width: var(--ad-w, 58%);
        height: var(--ad-h, 24%);
        border: 2px solid #f0a93a;
        border-radius: 12px;
        background: rgba(240, 169, 58, .14);
        cursor: move;
      }
      .edad.is-ed-sel { border-color: #6d5ef0; background: rgba(109, 94, 240, .16); }
      .edad.is-off { opacity: .45; border-style: dashed; }
      .edad__t {
        position: absolute; top: 4px; left: 6px;
        padding: 2px 7px; border-radius: 6px;
        background: rgba(0,0,0,.72); color: #fff;
        font: 600 11px/1.3 var(--ff-ui, system-ui, sans-serif);
        max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        pointer-events: none;
      }
      .edad__d {
        position: absolute; right: 5px; bottom: 4px;
        padding: 1px 5px; border-radius: 5px;
        background: rgba(0,0,0,.72); color: rgba(255,255,255,.85);
        font: 500 10px/1.3 ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }

      /* Resize handles shared by the ad boxes and the floating weather card. */
      .edh {
        position: absolute;
        width: 12px; height: 12px;
        border: 2px solid #fff; border-radius: 50%;
        background: #6d5ef0;
        box-shadow: 0 1px 3px rgba(0,0,0,.5);
      }
      .edh[data-dir="nw"] { left: 0; top: 0; transform: translate(-50%,-50%); cursor: nwse-resize; }
      .edh[data-dir="n"]  { left: 50%; top: 0; transform: translate(-50%,-50%); cursor: ns-resize; }
      .edh[data-dir="ne"] { right: 0; top: 0; transform: translate(50%,-50%); cursor: nesw-resize; }
      .edh[data-dir="e"]  { right: 0; top: 50%; transform: translate(50%,-50%); cursor: ew-resize; }
      .edh[data-dir="se"] { right: 0; bottom: 0; transform: translate(50%,50%); cursor: nwse-resize; }
      .edh[data-dir="s"]  { left: 50%; bottom: 0; transform: translate(-50%,50%); cursor: ns-resize; }
      .edh[data-dir="sw"] { left: 0; bottom: 0; transform: translate(-50%,50%); cursor: nesw-resize; }
      .edh[data-dir="w"]  { left: 0; top: 50%; transform: translate(-50%,-50%); cursor: ew-resize; }
    }

    @layer admin {
      .adm-badge {
        display: none;
      }

      body.is-admin .adm-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent);
        border-radius: var(--r-pill);
        background: color-mix(in srgb, var(--bad) 14%, transparent);
        color: var(--bad);
        font-size: .58rem;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      body.is-admin .clock,
      body.is-admin .foot__label {
        cursor: pointer;
      }

      body.is-admin .clock:hover,
      body.is-admin .foot__label:hover {
        background: var(--surface);
      }

      .row__tools {
        position: absolute;
        inset: 50% 6px auto auto;
        transform: translateY(-50%);
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--t-fast) var(--ease-out);
      }

      body.is-admin .row:hover .row__tools,
      body.is-admin .row:focus-within .row__tools {
        opacity: 1;
        pointer-events: auto;
      }

      body.is-admin .row:hover .row__price {
        opacity: .08;
      }

      @media (pointer: coarse) {
        body.is-admin .row__tools {
          opacity: 1;
          pointer-events: auto;
          position: static;
          transform: none;
        }

        body.is-admin .row:hover .row__price {
          opacity: 1;
        }

        body.is-admin .row {
          grid-template-columns: var(--row-cols, minmax(0, 1.35fr) minmax(0, 1.15fr) auto);
          row-gap: 6px;
        }

        body.is-admin .row__tools {
          grid-column: 1 / -1;
          justify-content: flex-end;
        }
      }

      .row.is-off {
        opacity: .42;
      }

      .row.is-off .row__en .nm {
        text-decoration: line-through;
      }

      .row.is-editing {
        opacity: 1;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      .erow {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .erow .chk {
        margin-left: auto;
      }

      .erow .inp {
        flex: 1 1 90px;
      }

      .erow .inp--price {
        flex: 0 0 90px;
      }

      .cat-edit {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1;
        min-width: 0;
      }

      .cat-edit .inp {
        background: #fff;
        color: #1a1a1a;
        border-color: rgba(255, 255, 255, .6);
      }

      .cat-edit .abtn {
        background: rgba(255, 255, 255, .2);
        border-color: rgba(255, 255, 255, .42);
        color: #fff;
      }

      .flag {
        width: 17px;
        height: 12px;
        border-radius: 1px;
      }
    }

    /* ══════════════════════════════════════════════════════════════════════════
   MOTION — every keyframe lives here so reduced-motion can switch it all off
   ══════════════════════════════════════════════════════════════════════════ */
    @layer motion {
      @keyframes sheen {
        0% {
          transform: translateX(0);
        }

        55%,
        100% {
          transform: translateX(420%);
        }
      }

      @keyframes marquee {
        from {
          transform: translate3d(0, 0, 0);
        }

        to {
          transform: translate3d(-50%, 0, 0);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translate3d(0, 14px, 0) scale(.97);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes toast-out {
        to {
          opacity: 0;
          transform: translate3d(0, 8px, 0) scale(.98);
        }
      }

      @keyframes modal-in {
        from {
          opacity: 0;
          transform: translate3d(0, 10px, 0) scale(.985);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translate3d(0, 18px, 0);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translate3d(-7px, 0, 0);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes lot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes lot-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes lot-ping {
        0% {
          transform: scale(.45);
          opacity: .85;
        }

        80%,
        100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }

      @keyframes lot-rise {

        0%,
        100% {
          transform: translateY(3px);
          opacity: .35;
        }

        45% {
          transform: translateY(-3px);
          opacity: 1;
        }
      }

      @keyframes lot-float {

        0%,
        100% {
          transform: translateY(2px);
        }

        50% {
          transform: translateY(-2px);
        }
      }

      @keyframes lot-shake {

        0%,
        100% {
          transform: rotate(0);
        }

        22% {
          transform: rotate(-7deg);
        }

        58% {
          transform: rotate(5deg);
        }

        80% {
          transform: rotate(-2deg);
        }
      }

      /* Entrance is opt-in per render — only fresh data animates, never the
     once-a-minute morning-boundary re-render. */
      .grid.is-fresh .cat {
        animation: rise var(--t-slow) var(--ease-out) both;
        animation-delay: calc(var(--i, 0) * 60ms);
      }

      .grid.is-fresh .row {
        animation: slide-in 300ms var(--ease-out) both;
        animation-delay: calc(var(--d, 0) * 22ms + 150ms);
      }

      /* ── div (category card) periodic animations ─────────────────────────── */
      @keyframes da-slide-left {
        0% {
          opacity: 0;
          transform: translateX(-44px);
        }

        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes da-slide-right {
        0% {
          opacity: 0;
          transform: translateX(44px);
        }

        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes da-slide-top {
        0% {
          opacity: 0;
          transform: translateY(-38px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes da-slide-bottom {
        0% {
          opacity: 0;
          transform: translateY(38px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes da-drawer-left {
        0% {
          opacity: 0;
          transform: translateX(-100%) scaleX(.6);
        }

        60% {
          opacity: 1;
          transform: translateX(5px) scaleX(1.015);
        }

        100% {
          transform: translateX(0) scaleX(1);
        }
      }

      @keyframes da-drawer-right {
        0% {
          opacity: 0;
          transform: translateX(100%) scaleX(.6);
        }

        60% {
          opacity: 1;
          transform: translateX(-5px) scaleX(1.015);
        }

        100% {
          transform: translateX(0) scaleX(1);
        }
      }

      @keyframes da-drawer-top {
        0% {
          opacity: 0;
          transform: translateY(-100%) scaleY(.6);
        }

        60% {
          opacity: 1;
          transform: translateY(5px) scaleY(1.015);
        }

        100% {
          transform: translateY(0) scaleY(1);
        }
      }

      @keyframes da-drawer-bottom {
        0% {
          opacity: 0;
          transform: translateY(100%) scaleY(.6);
        }

        60% {
          opacity: 1;
          transform: translateY(-5px) scaleY(1.015);
        }

        100% {
          transform: translateY(0) scaleY(1);
        }
      }

      @keyframes da-glitter {
        0% {
          text-shadow: 0 0 4px var(--gold), 0 0 8px var(--gold-2);
        }

        25% {
          text-shadow: 0 0 10px var(--gold-2), 0 0 20px var(--gold), 1px 1px 16px rgba(255, 200, 60, .5);
        }

        50% {
          text-shadow: 0 0 6px var(--gold), 0 0 12px rgba(255, 180, 40, .4);
        }

        75% {
          text-shadow: 0 0 14px var(--gold-2), -1px -1px 18px rgba(255, 210, 70, .5), 0 0 22px var(--gold);
        }

        100% {
          text-shadow: 0 0 4px var(--gold), 0 0 8px var(--gold-2);
        }
      }

      @keyframes da-glitter-soft {
        0%   { text-shadow: none; }
        30%  { text-shadow: 0 0 6px var(--gold-2), 0 0 12px rgba(255, 200, 60, .35); }
        60%  { text-shadow: 0 0 4px var(--gold), 0 0 9px rgba(255, 190, 50, .25); }
        100% { text-shadow: none; }
      }

      .grid.da-playing,
      .grid.da-playing>.col {
        overflow: visible;
      }

      /* `.grid.da-playing` prefix keeps these above `.grid.is-fresh .cat`, whose
         `animation` shorthand would otherwise reset animation-name mid-play. */
      .grid.da-playing .cat.da-anim {
        animation-duration: 620ms;
        animation-timing-function: var(--ease-spring);
        animation-fill-mode: both;
        animation-delay: calc(var(--da-i, 0) * 70ms);
        will-change: transform, opacity;
      }

      .grid.da-playing .cat.da-anim .cat__en,
      .grid.da-playing .cat.da-anim .cat__hi {
        animation: da-glitter 1.5s ease-in-out;
        animation-delay: calc(var(--da-i, 0) * 70ms + 180ms);
      }

      .grid.da-playing .cat.da-anim .row__en,
      .grid.da-playing .cat.da-anim .row__hi {
        animation: da-glitter-soft 1.3s ease-in-out;
        animation-delay: calc(var(--da-i, 0) * 70ms + 300ms);
      }

      .grid.da-playing .cat.da-slide-left {
        animation-name: da-slide-left;
      }

      .grid.da-playing .cat.da-slide-right {
        animation-name: da-slide-right;
      }

      .grid.da-playing .cat.da-slide-top {
        animation-name: da-slide-top;
      }

      .grid.da-playing .cat.da-slide-bottom {
        animation-name: da-slide-bottom;
      }

      .grid.da-playing .cat.da-drawer-left {
        animation-name: da-drawer-left;
      }

      .grid.da-playing .cat.da-drawer-right {
        animation-name: da-drawer-right;
      }

      .grid.da-playing .cat.da-drawer-top {
        animation-name: da-drawer-top;
      }

      .grid.da-playing .cat.da-drawer-bottom {
        animation-name: da-drawer-bottom;
      }

      /* Directionless styles: the card plays the same way wherever it sits, so all four
         direction classes map to one keyframe set. */
      .grid.da-playing .cat.da-flip-left,
      .grid.da-playing .cat.da-flip-right,
      .grid.da-playing .cat.da-flip-top,
      .grid.da-playing .cat.da-flip-bottom {
        animation-name: da-flip;
      }

      .grid.da-playing .cat.da-zoom-left,
      .grid.da-playing .cat.da-zoom-right,
      .grid.da-playing .cat.da-zoom-top,
      .grid.da-playing .cat.da-zoom-bottom {
        animation-name: da-zoom;
      }

      .grid.da-playing .cat.da-fade-left,
      .grid.da-playing .cat.da-fade-right,
      .grid.da-playing .cat.da-fade-top,
      .grid.da-playing .cat.da-fade-bottom {
        animation-name: da-fade;
      }

      .grid.da-playing .cat.da-swing-left,
      .grid.da-playing .cat.da-swing-right,
      .grid.da-playing .cat.da-swing-top,
      .grid.da-playing .cat.da-swing-bottom {
        animation-name: da-swing;
      }

      @keyframes da-flip {
        0% { opacity: 0; transform: perspective(1200px) rotateX(-78deg); }
        60% { opacity: 1; transform: perspective(1200px) rotateX(9deg); }
        100% { opacity: 1; transform: perspective(1200px) rotateX(0); }
      }

      @keyframes da-zoom {
        0% { opacity: 0; transform: scale(.86); }
        62% { opacity: 1; transform: scale(1.02); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes da-fade {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes da-swing {
        0% { opacity: 0; transform: perspective(1200px) rotateY(26deg) translateX(18px); }
        58% { opacity: 1; transform: perspective(1200px) rotateY(-6deg) translateX(-3px); }
        100% { opacity: 1; transform: perspective(1200px) rotateY(0) translateX(0); }
      }

      /* View Transitions — category cards morph when columns are rearranged. */
      ::view-transition-group(*) {
        animation-duration: var(--t-slow);
        animation-timing-function: var(--ease-out);
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          scroll-behavior: auto !important;
        }

        .marquee__track {
          animation: none;
          transform: none;
        }

        .marquee {
          overflow-x: auto;
        }

        .cat__hd::after {
          display: none;
        }

        body::after {
          display: none;
        }
      }
    }

    @layer utility {
      .stack-x {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .muted {
        color: var(--ink-3);
      }

      .nowrap {
        white-space: nowrap;
      }

      .grow {
        flex: 1;
        min-width: 0;
      }
    }
  </style>
</head>

  <script>
    'use strict';
    /* ══════════════════════════════════════════════════════════════════════════
       RADHA GOVINDA — MENU BOARD
       Standalone vanilla HTML/CSS/JS. No build step, no framework.

       A read-only display. It shows a published menu from the CanteenOS Menu Master
       and cannot change one — everything it draws is edited in the Admin Portal,
       which is where the prices, the photography and this screen's own settings live.

       Served by the CanteenOS backend at /menu-board, so a screen needs a URL and
       nothing else. Which menu it shows is decided by its screen row:

         GET /api/v1/menu-board/snapshot?screen=CODE
               → { screen, menu, revision, config, items[] }
         GET /api/v1/menu-board/revision?screen=CODE
               → { revision }   polled between renders; re-fetches only when it moves
         GET /api/v1/menu-board/media/:id
               → the dish photography the snapshot names

       `?screen=` in this page's own URL names the screen; without it the backend
       resolves the default one.
       ══════════════════════════════════════════════════════════════════════════ */
    (function () {

      /* ─────────────────────────────────────────────────────────────────────────
         0 · UTILITIES
         ───────────────────────────────────────────────────────────────────────── */
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, txt) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (txt != null) n.textContent = txt;
        return n;
      };
      const svgIcon = (name, cls) => {
        const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        s.setAttribute('class', 'ico' + (cls ? ' ' + cls : ''));
        s.setAttribute('aria-hidden', 'true');
        const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        u.setAttribute('href', '#' + name);
        s.appendChild(u);
        return s;
      };
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));

      const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
      let reduced = motionQuery.matches;
      motionQuery.addEventListener('change', (e) => { reduced = e.matches; Lottie.retheme(); });

      const supportsVT = () => typeof document.startViewTransition === 'function' && !reduced;

      /* Reads a flat hex design token. Lottie needs real hex, not color-mix(). */
      function token(name, fallback) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return /^#[0-9a-fA-F]{6}$/.test(v) ? v : fallback;
      }

      /* ─────────────────────────────────────────────────────────────────────────
         1 · CATEGORY ICONS — same keyword table as the previous board, resolved
             against the inline sprite instead of a Font Awesome CDN.
         ───────────────────────────────────────────────────────────────────────── */
      const ICON_RULES = [
        [['breakfast', 'morning', 'nashta', 'नाश्ता'], 'i-egg'],
        [['burger'], 'i-burger'],
        [['pizza'], 'i-pizza'],
        [['pasta', 'noodle', 'chowmein', 'spaghetti'], 'i-bowl'],
        [['salad', 'sabzi', 'sabji'], 'i-leaf'],
        [['soup', 'shorba', 'dal', 'lentil'], 'i-bowl'],
        [['grill', 'bbq', 'kebab', 'tikka', 'tandoor'], 'i-flame'],
        [['chicken', 'murgh'], 'i-bowl'],
        [['fish', 'seafood', 'prawn', 'jhinga'], 'i-bowl'],
        [['mutton', 'lamb', 'beef', 'gosht', 'meat'], 'i-bowl'],
        [['paneer', 'veg', 'vegetarian'], 'i-sprout'],
        [['rice', 'biryani', 'pulao', 'khichdi'], 'i-bowl'],
        [['bread', 'roti', 'naan', 'paratha', 'puri'], 'i-bread'],
        [['dessert', 'sweet', 'mithai', 'halwa', 'मीठा'], 'i-icecream'],
        [['cake', 'pastry', 'bakery'], 'i-cake'],
        [['coffee', 'espresso', 'latte', 'cappuccino'], 'i-mug'],
        [['tea', 'chai', 'chay'], 'i-mug'],
        [['juice', 'nimbu', 'lemonade'], 'i-glass'],
        [['drink', 'beverage', 'soda', 'cold', 'soft', 'पेय'], 'i-glass'],
        [['shake', 'milkshake', 'smoothie', 'lassi'], 'i-glass'],
        [['water', 'जल'], 'i-droplet'],
        [['snack', 'starter', 'appetizer', 'chaat', 'चाट', 'चट'], 'i-plate'],
        [['sandwich', 'wrap', 'roll'], 'i-bread'],
        [['thali', 'combo', 'special', 'set', 'meal'], 'i-star'],
        [['counter', 'काउन्टर'], 'i-store'],
        [['main', 'mains', 'main course', 'मुख्य'], 'i-utensils'],
        [['prasad', 'prashad', 'प्रसाद'], 'i-lotus'],
        [['side', 'sides', 'extras'], 'i-plus'],
        [['kids', 'child', 'junior'], 'i-person'],
      ];
      function iconFor(cat) {
        const l = String(cat || '').toLowerCase();
        for (const [keys, id] of ICON_RULES) if (keys.some(k => l.includes(k))) return id;
        return 'i-utensils';
      }

      /* ─────────────────────────────────────────────────────────────────────────
         2 · LOTTIE ENGINE
             Eight animation slots built from six parameterised primitives.
             The bodymovin JSON is generated in-page, so nothing is fetched from a
             CDN asset host — important for a kiosk with no internet.
      
             The CSS/SVG fallback is the PRIMARY path: it renders first and always.
             lottie-web, if it loads, upgrades the slot in place. If the library is
             missing, throws, or produces no SVG, the fallback simply stays.
         ───────────────────────────────────────────────────────────────────────── */
      const Lottie = (function () {

        /* ---- bodymovin builders ------------------------------------------------ */
        const V = '5.9.0';
        const st = (k) => ({ a: 0, k });
        const hexRGB = (hex) => {
          const n = parseInt(hex.slice(1), 16);
          return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1];
        };
        /* frames: [{t, s, ease?}] — 'lin' for constant speed, otherwise eased. */
        const kf = (frames) => ({
          a: 1,
          k: frames.map((f, i) => {
            if (i === frames.length - 1) return { t: f.t, s: f.s };
            const lin = f.ease === 'lin';
            return {
              t: f.t, s: f.s, e: frames[i + 1].s,
              i: { x: [lin ? 1 : 0.36], y: [1] },
              o: { x: [lin ? 0 : 0.52], y: [0] },
            };
          }),
        });
        /* Must be a factory, not a shared constant: lottie-web caches parsed state on
           the property objects it receives, so handing the same transform to two
           groups leaves the second one un-rendered. */
        const tr = () => ({ ty: 'tr', p: st([0, 0]), a: st([0, 0]), s: st([100, 100]), r: st(0), o: st(100), sk: st(0), sa: st(0) });
        const group = (items) => ({ ty: 'gr', nm: 'g', np: items.length, it: items.concat([tr()]) });
        const ellipse = (d, p) => ({ ty: 'el', d: 1, s: st([d, d]), p: st(p || [0, 0]) });
        const stroke = (hex, w, o) => ({ ty: 'st', c: st(hexRGB(hex)), o: st(o == null ? 100 : o), w: st(w), lc: 2, lj: 2, ml: 4 });
        const fill = (hex, o) => ({ ty: 'fl', c: st(hexRGB(hex)), o: st(o == null ? 100 : o), r: 1 });
        const trim = (s, e) => ({ ty: 'tm', s, e, o: st(0), m: 1 });
        const linePath = (verts, closed) => ({
          ty: 'sh', d: 1,
          ks: st({ i: verts.map(() => [0, 0]), o: verts.map(() => [0, 0]), v: verts, c: !!closed }),
        });
        /* Shape-item order matters: [shape, trim, style, transform] — modifiers and
           styles apply to the items listed before them, matching an AE export. */
        const layer = (ind, shapes, ks, op) => ({
          ddd: 0, ind, ty: 4, nm: 'L' + ind, sr: 1, ao: 0, ip: 0, op, st: 0, bm: 0,
          ks: Object.assign({ o: st(100), r: st(0), p: st([32, 32, 0]), a: st([0, 0, 0]), s: st([100, 100, 100]) }, ks),
          shapes,
        });
        const comp = (op, layers) => ({ v: V, fr: 60, ip: 0, op, w: 64, h: 64, nm: 'a', ddd: 0, assets: [], layers, markers: [] });

        const build = {
          /* rotating arc — loading / sync */
          arc(c) {
            const op = c.frames || 66;
            return comp(op, [
              layer(1, [group([ellipse(40), stroke(c.dim, 5, 100)])], {}, op),
              layer(2, [group([ellipse(40), trim(st(0), st(27)), stroke(c.accent, 5, 100)])],
                { r: kf([{ t: 0, s: [c.reverse ? 360 : 0], ease: 'lin' }, { t: op, s: [c.reverse ? 0 : 360] }]) }, op),
            ]);
          },
          /* ring + checkmark drawn on — save / refresh success (plays once) */
          check(c) {
            const op = 52;
            return comp(op, [
              layer(1, [group([ellipse(40), trim(st(0), kf([{ t: 0, s: [0] }, { t: 22, s: [100] }])), stroke(c.accent, 4.4, 100)])],
                { r: st(-90) }, op),
              layer(2, [group([
                linePath([[-11, 1], [-3, 9], [12, -8]]),
                trim(st(0), kf([{ t: 0, s: [0] }, { t: 18, s: [0] }, { t: 40, s: [100] }])),
                stroke(c.accent, 5.4, 100),
              ])], {}, op),
            ]);
          },
          /* dot + expanding ring — connection status */
          pulse(c) {
            const op = 96;
            return comp(op, [
              layer(1, [group([ellipse(26), stroke(c.accent, 4, 100)])], {
                s: kf([{ t: 0, s: [45, 45, 100] }, { t: 78, s: [175, 175, 100] }, { t: 96, s: [175, 175, 100] }]),
                o: kf([{ t: 0, s: [80] }, { t: 70, s: [0] }, { t: 96, s: [0] }]),
              }, op),
              layer(2, [group([ellipse(20), fill(c.accent, 100)])], {}, op),
            ]);
          },
          /* tray + rising arrow — image upload */
          upload(c) {
            const op = 90;
            return comp(op, [
              layer(1, [group([
                linePath([[-18, 8], [-18, 16], [18, 16], [18, 8]]),
                stroke(c.accent, 4.5, 60),
              ])], {}, op),
              layer(2, [group([
                linePath([[0, 12], [0, -14]]),
                stroke(c.accent, 4.5, 100),
              ]), group([
                linePath([[-10, -4], [0, -14], [10, -4]]),
                stroke(c.accent, 4.5, 100),
              ])], {
                p: kf([{ t: 0, s: [32, 34, 0] }, { t: 45, s: [32, 27, 0] }, { t: 90, s: [32, 34, 0] }]),
                o: kf([{ t: 0, s: [35] }, { t: 45, s: [100] }, { t: 90, s: [35] }]),
              }, op),
            ]);
          },
          /* alert circle with a short shake — error */
          error(c) {
            const op = 60;
            return comp(op, [
              layer(1, [
                group([ellipse(40), stroke(c.bad, 4.5, 100)]),
                group([linePath([[0, -10], [0, 4]]), stroke(c.bad, 4.5, 100)]),
                group([ellipse(4.6, [0, 12]), fill(c.bad, 100)]),
              ], {
                r: kf([{ t: 0, s: [0] }, { t: 7, s: [-8] }, { t: 15, s: [6] }, { t: 22, s: [-3] }, { t: 30, s: [0] }, { t: 60, s: [0] }]),
              }, op),
            ]);
          },
          /* dashed ring + floating bowl — empty state */
          empty(c) {
            const op = 150;
            return comp(op, [
              layer(1, [group([ellipse(44), stroke(c.dim, 3, 70)])], {
                r: kf([{ t: 0, s: [0], ease: 'lin' }, { t: 150, s: [360] }]),
              }, op),
              layer(2, [
                group([linePath([[-14, -3], [14, -3], [12, 6], [8, 10], [-8, 10], [-12, 6]], true), stroke(c.accent, 4, 100)]),
                group([linePath([[-6, -8], [-6, -13]]), stroke(c.accent, 3.4, 70)]),
                group([linePath([[5, -8], [5, -13]]), stroke(c.accent, 3.4, 70)]),
              ], {
                p: kf([{ t: 0, s: [32, 34, 0] }, { t: 75, s: [32, 30, 0] }, { t: 150, s: [32, 34, 0] }]),
              }, op),
            ]);
          },
        };

        /* ---- slot registry ----------------------------------------------------- */
        const SLOTS = {
          loading: { kind: 'arc', loop: true, size: 74 },
          sync: { kind: 'arc', loop: true, size: 30, reverse: true, frames: 48 },
          refresh: { kind: 'check', loop: false, size: 30 },
          save: { kind: 'check', loop: false, size: 30, color: 'ok' },
          connection: { kind: 'pulse', loop: true, size: 15 },
          empty: { kind: 'empty', loop: true, size: 96 },
          upload: { kind: 'upload', loop: true, size: 42 },
          error: { kind: 'error', loop: false, size: 30, color: 'bad' },
        };

        function palette(slot, override) {
          const accentToken = override === 'ok' ? '--lot-ok'
            : override === 'bad' ? '--lot-bad'
              : override === 'ink' ? '--lot-ink'
                : '--lot-accent';
          return {
            accent: token(accentToken, '#f2c86e'),
            dim: token('--lot-dim', '#6b4a2a'),
            bad: token(override === 'ok' ? '--lot-ok' : '--lot-bad', '#ff8f8f'),
            reverse: !!slot.reverse,
            frames: slot.frames,
          };
        }

        /* ---- CSS/SVG fallbacks — always rendered first ------------------------- */
        function fallbackSVG(kind, colors, animate) {
          const A = colors.accent, D = colors.dim, B = colors.bad;
          const anim = (css) => animate ? ' style="' + css + '"' : '';
          switch (kind) {
            case 'arc': return '<svg class="lot__fb" viewBox="0 0 64 64" fill="none" aria-hidden="true">'
              + '<circle cx="32" cy="32" r="20" stroke="' + D + '" stroke-width="5"/>'
              + '<circle cx="32" cy="32" r="20" stroke="' + A + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="34 92"'
              + anim('transform-origin:32px 32px;animation:lot-spin 1.05s linear infinite') + '/></svg>';
            case 'check': return '<svg class="lot__fb" viewBox="0 0 64 64" fill="none" aria-hidden="true">'
              + '<circle cx="32" cy="32" r="20" stroke="' + A + '" stroke-width="4.4" opacity=".38"/>'
              + '<path d="M21 33 29 41 44 24" stroke="' + A + '" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"'
              + (animate ? ' stroke-dasharray="36" stroke-dashoffset="36" style="animation:lot-draw .45s cubic-bezier(.22,.68,.28,1) .04s forwards"' : '')
              + '/></svg>';
            case 'pulse': return '<svg class="lot__fb" viewBox="0 0 64 64" fill="none" aria-hidden="true">'
              + '<circle cx="32" cy="32" r="18" fill="' + A + '" opacity=".3"'
              + anim('transform-origin:32px 32px;animation:lot-ping 1.9s cubic-bezier(.22,.68,.28,1) infinite') + '/>'
              + '<circle cx="32" cy="32" r="9.5" fill="' + A + '"/></svg>';
            case 'upload': return '<svg class="lot__fb" viewBox="0 0 64 64" fill="none" stroke="' + A + '" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
              + '<path d="M14 40v6a4 4 0 0 0 4 4h28a4 4 0 0 0 4-4v-6" opacity=".6"/>'
              + '<g' + anim('transform-origin:32px 30px;animation:lot-rise 1.5s ease-in-out infinite') + '>'
              + '<path d="M32 44V18"/><path d="m22 28 10-10 10 10"/></g></svg>';
            case 'error': return '<svg class="lot__fb" viewBox="0 0 64 64" fill="none" stroke="' + B + '" stroke-width="4.5" stroke-linecap="round" aria-hidden="true"'
              + anim('transform-origin:32px 32px;animation:lot-shake .5s cubic-bezier(.22,.68,.28,1)') + '>'
              + '<circle cx="32" cy="32" r="20"/><path d="M32 21v13"/><path d="M32 42.5h.01"/></svg>';
            case 'empty': return '<svg class="lot__fb" viewBox="0 0 64 64" fill="none" stroke="' + A + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
              + '<circle cx="32" cy="32" r="22" opacity=".34" stroke-width="3" stroke-dasharray="5 7"'
              + anim('transform-origin:32px 32px;animation:lot-spin 14s linear infinite') + '/>'
              + '<g' + anim('transform-origin:32px 34px;animation:lot-float 3.6s ease-in-out infinite') + '>'
              + '<path d="M18 29h28a14 14 0 0 1-28 0z"/><path d="M26 24c0-2.5 2.5-2.5 2.5-5M37 24c0-2.5 2.5-2.5 2.5-5" opacity=".7"/></g></svg>';
            default: return '';
          }
        }

        /* ---- host management --------------------------------------------------- */
        const hosts = new Set();
        let libReady = false;

        /* data-lot-color lets one slot carry state — the connection dot is green
           while the socket is up and red while it is reconnecting. */
        const colourOf = (host, slot) => host.dataset.lotColor || slot.color;

        function renderFallback(host) {
          const slot = SLOTS[host.dataset.lot] || SLOTS.loading;
          host.innerHTML = fallbackSVG(slot.kind, palette(slot, colourOf(host, slot)), !reduced);
        }

        function tryLottie(host) {
          if (!libReady || reduced || !window.lottie) return false;
          const name = host.dataset.lot;
          const slot = SLOTS[name];
          if (!slot) return false;
          try {
            const stage = el('div', 'lot__stage');
            host.appendChild(stage);
            const anim = window.lottie.loadAnimation({
              container: stage,
              renderer: 'svg',
              loop: !!slot.loop,
              autoplay: true,
              animationData: build[slot.kind](palette(slot, colourOf(host, slot))),
              rendererSettings: { preserveAspectRatio: 'xMidYMid meet', progressiveLoad: false },
            });
            /* Only accept the upgrade if lottie really produced a drawing. */
            if (!anim || !stage.querySelector('svg')) throw new Error('no svg');
            host.__anim = anim;
            host.dataset.mode = 'lottie';

            /* Second, deferred check: an <svg> shell can appear even when a layer
               fails to build. If nothing drawable landed by the next frames, throw
               the instance away and let the CSS fallback show again — an empty icon
               box is worse than a static one. */
            setTimeout(() => {
              if (host.__anim !== anim) return;
              if (stage.querySelector('path, ellipse, rect, circle, image, text')) return;
              console.warn('[lottie] slot "' + name + '" drew nothing — reverting to CSS');
              try { anim.destroy(); } catch (e2) { }
              host.__anim = null;
              delete host.dataset.mode;
              stage.remove();
            }, 120);
            return true;
          } catch (err) {
            console.warn('[lottie] slot "' + name + '" fell back to CSS:', err && err.message);
            const stage = host.querySelector('.lot__stage');
            if (stage) stage.remove();
            delete host.dataset.mode;
            return false;
          }
        }

        const api = {
          /* Mount (or re-mount) a host element. Safe to call repeatedly. */
          mount(host, name) {
            if (!host) return;
            api.unmount(host);
            if (name) host.dataset.lot = name;
            hosts.add(host);
            renderFallback(host);
            tryLottie(host);
          },
          unmount(host) {
            if (!host) return;
            if (host.__anim) { try { host.__anim.destroy(); } catch (e) { } host.__anim = null; }
            delete host.dataset.mode;
            host.innerHTML = '';
            hosts.delete(host);
          },
          /* Re-create every live instance — used on theme change and motion change. */
          retheme() {
            hosts.forEach((h) => {
              if (h.__anim) { try { h.__anim.destroy(); } catch (e) { } h.__anim = null; }
              delete h.dataset.mode;
              renderFallback(h);
              tryLottie(h);
            });
          },
          /* Restart a one-shot slot (save / refresh / error). */
          replay(host) {
            if (!host) return;
            if (host.__anim) { try { host.__anim.goToAndPlay(0, true); return; } catch (e) { } }
            renderFallback(host);
          },
          ready() {
            libReady = true;
            hosts.forEach((h) => { if (!h.__anim) tryLottie(h); });
          },
          pauseAll(paused) {
            hosts.forEach((h) => {
              if (!h.__anim) return;
              try { paused ? h.__anim.pause() : h.__anim.play(); } catch (e) { }
            });
          },
          /* Mount every [data-lot] in a subtree that is not mounted yet. Hosts inside
             a closed modal are skipped so nothing animates off-screen. */
          scan(root) {
            (root || document).querySelectorAll('.lot[data-lot]').forEach((h) => {
              const modal = h.closest('.modal');
              if (modal && !modal.classList.contains('is-open')) return;
              if (!hosts.has(h)) api.mount(h);
            });
          },
        };

        /* lottie_svg.min.js is loaded async; poll briefly, then give up quietly. */
        (function waitForLib(tries) {
          if (window.__lottieFailed) return;
          if (window.lottie && typeof window.lottie.loadAnimation === 'function') { api.ready(); return; }
          if (tries <= 0) return;
          setTimeout(() => waitForLib(tries - 1), 150);
        })(40);

        document.addEventListener('visibilitychange', () => api.pauseAll(document.hidden));
        return api;
      })();

      /* ─────────────────────────────────────────────────────────────────────────
         3 · TOASTS — every failure the old board swallowed now surfaces here.
         ───────────────────────────────────────────────────────────────────────── */
      const Toast = (function () {
        const wrap = $('toasts');
        const TITLES = { save: 'Saved', refresh: 'Menu refreshed', error: 'Something went wrong', sync: 'Syncing…', upload: 'Uploading photo…' };

        function show(kind, title, detail, opts) {
          opts = opts || {};
          const t = el('div', 'toast');
          t.dataset.kind = kind;
          t.setAttribute('role', kind === 'error' ? 'alert' : 'status');

          const lot = el('span', 'lot toast__lot');
          lot.dataset.lot = SLOT_FOR[kind] || 'sync';
          t.appendChild(lot);

          const txt = el('div', 'toast__txt');
          txt.appendChild(el('div', 'toast__title', title || TITLES[kind] || ''));
          if (detail) txt.appendChild(el('div', 'toast__detail', detail));
          t.appendChild(txt);

          if (opts.action) {
            const b = el('button', 'toast__act', opts.action.label);
            b.type = 'button';
            b.addEventListener('click', () => { close(t); opts.action.run(); });
            t.appendChild(b);
          } else {
            t.appendChild(el('span'));
          }

          wrap.appendChild(t);
          Lottie.mount(lot);

          const life = opts.sticky ? 0 : (opts.duration || (kind === 'error' ? 6500 : 3200));
          if (life) t.__timer = setTimeout(() => close(t), life);
          if (opts.id) { t.dataset.id = opts.id; }
          return t;
        }

        function close(t) {
          if (!t || t.__closing) return;
          t.__closing = true;
          clearTimeout(t.__timer);
          t.classList.add('is-out');
          const done = () => { Lottie.unmount(t.querySelector('.lot')); t.remove(); };
          if (reduced) done(); else setTimeout(done, 240);
        }

        const SLOT_FOR = { refresh: 'refresh', error: 'error', sync: 'sync' };

        return {
          refresh: (d) => show('refresh', 'Menu refreshed', d),
          error: (title, d) => show('error', title || 'Something went wrong', d),
          sync: (title, d) => show('sync', title || 'Syncing…', d, { sticky: true }),
          custom: show,
          close,
        };
      })();

      /* ─────────────────────────────────────────────────────────────────────────
         4 · STATE
         ───────────────────────────────────────────────────────────────────────── */
      /* Which screen this is. A board opened without one gets the default screen, which is
         all a single-screen operation ever needs to know about this. */
      const SCREEN = new URLSearchParams(location.search).get('screen') || '';
      const API = '/api/v1/menu-board';

      /* Set when the Admin Portal's layout editor frames this page to drag the Today panel and
         the ads over the real menu. Forwarded to the backend so that tab does not stamp the
         screen's heartbeat: `lastSeenAt` is how an operator tells a display that is switched
         off from one that is on, and a settings tab open on a desk must not answer for it. */
      const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';

      /* The Admin Portal's live layout editor, opened in its own window. It stays inert
         until the portal that opened it hands over a token, so ?edit=1 typed into a wall
         screen's URL gets an ordinary read-only board. */
      const EDIT = new URLSearchParams(location.search).get('edit') === '1';
      const SCREEN_ID = new URLSearchParams(location.search).get('id') || '';

      const qs = (path) => {
        const params = new URLSearchParams();
        if (SCREEN) params.set('screen', SCREEN);
        if (PREVIEW) params.set('preview', '1');
        const q = params.toString();
        return API + path + (q ? '?' + q : '');
      };

      let settings = {};
      let menuItems = [];               // { id, category, cat_hi, name, name_hi, price, image, isMorning, available, featured }
      let layoutOverride = null;        // { fonts:{cat:scale}, columns:[[cat,…]] }  — from the screen's config
      let revision = '';                // last snapshot fingerprint; a poll that matches it is a no-op
      let screenName = '';
      let liveOk = false;               // last poll reached the server

      const S = (k, d) => (k in settings && settings[k] !== '' ? settings[k] : (d === undefined ? '' : d));
      const Sn = (k, d) => { const v = parseFloat(S(k, d)); return isNaN(v) ? d : v; };

      const grid = $('grid');

      /* ─────────────────────────────────────────────────────────────────────────
         5 · SETTINGS → DESIGN TOKENS
             The Settings sheet drives the font families and sizes, exactly as the
             original board does.
         ───────────────────────────────────────────────────────────────────────── */
      const SYSTEM_FONTS = ['arial', 'georgia', 'verdana', 'times new roman', 'courier new', 'tahoma'];
      const loadedFonts = new Set();

      function loadWebFonts() {
        ['Font_RestaurantName', 'Font_CategoryName', 'Font_ItemName_EN', 'Font_ItemName_HI', 'Font_Price'].forEach((key) => {
          const f = String(S(key, '')).trim();
          if (!f || loadedFonts.has(f) || SYSTEM_FONTS.includes(f.toLowerCase())) return;
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(f) + ':wght@300;400;500;600;700;800;900&display=swap';
          link.addEventListener('error', () => console.warn('[fonts] could not load', f));
          document.head.appendChild(link);
          loadedFonts.add(f);
        });
      }

      function applySettingsTokens() {
        const r = document.documentElement.style;
        const stack = (name, fallback) => {
          const f = String(S(name, '')).trim();
          return (f ? '"' + f + '", ' : '') + fallback;
        };
        r.setProperty('--ff-brand', stack('Font_RestaurantName', "'Cinzel',Georgia,serif"));
        r.setProperty('--ff-cat', stack('Font_CategoryName', "'Poppins',system-ui,sans-serif"));
        r.setProperty('--ff-en', stack('Font_ItemName_EN', "'Poppins',system-ui,sans-serif"));
        r.setProperty('--ff-hi', stack('Font_ItemName_HI', "'Noto Sans Devanagari','Nirmala UI',sans-serif"));
        r.setProperty('--ff-price', stack('Font_Price', "'Poppins',system-ui,sans-serif"));

        /* Weights are deliberately NOT taken from the FontWeight_* cells: the
           original board hardcodes them in CSS and ignores those cells, and the two
           boards have to look identical on the same workbook. */

        r.setProperty('--fs-brand', Sn('FontSize_RestaurantName', 26) + 'px');
        r.setProperty('--fs-cat', Sn('FontSize_CategoryName', 22) + 'px');
        r.setProperty('--fs-en', Sn('FontSize_ItemName_EN', 22) + 'px');
        r.setProperty('--fs-hi', Sn('FontSize_ItemName_HI', 19) + 'px');
        r.setProperty('--fs-price', Sn('FontSize_Price', 20) + 'px');

        /* Floors mirror the previous renderer, which also refused to let spacing
           collapse to zero even when the sheet asked for it. */
        r.setProperty('--pad-item', Math.max(2, Sn('Padding_Item', 8)) + 'px');
        r.setProperty('--pad-item-x', Math.max(8, Sn('Padding_Item_Horizontal', 14)) + 'px');
        r.setProperty('--pad-cat', Math.max(4, Sn('Padding_CategoryHeader', 8)) + 'px');
        r.setProperty('--gap-cat', Math.max(8, Sn('Gap_Categories', 10)) + 'px');
        r.setProperty('--gap-col', Math.max(8, Sn('Gap_Columns', 12)) + 'px');
        r.setProperty('--pad-outer', Math.max(8, Sn('Gap_Outer', 14)) + 'px');

        loadWebFonts();
      }

      /* ─────────────────────────────────────────────────────────────────────────
         6 · DATA — one snapshot of one published menu, from the CanteenOS backend

             The board used to read an Excel workbook that lived next to it, which
             made it the one screen in the operation with its own copy of the menu:
             a price edited at the counter and not in the workbook meant the wall
             advertised something the till would not charge. There is now a single
             source — Menu Master — and this reads it.
         ───────────────────────────────────────────────────────────────────────── */

      /* The workbook's Settings sheet became the screen's own config row. Flattened back to
         the same flat keys here, because everything downstream — the design tokens, the
         morning window, the ribbon pacing — reads them by those names and always has. */
      function flattenConfig(cfgIn) {
        const c = cfgIn || {};
        const id = c.identity || {};
        const out = Object.assign({}, c.typography || {});
        if (id.restaurantName) out.RestaurantName = id.restaurantName;
        if (id.restaurantNameHi) out.RestaurantName_Hindi = id.restaurantNameHi;
        if (id.langSwitchSeconds != null) out.LangSwitchSeconds = id.langSwitchSeconds;
        if (id.morningFrom) out.MorningHours_From = id.morningFrom;
        if (id.morningTo) out.MorningHours_To = id.morningTo;
        return out;
      }

      function normaliseItem(raw) {
        return {
          id: raw.id,
          category: raw.category, cat_hi: raw.categoryHi,
          name: raw.name, name_hi: raw.nameHi,
          price: raw.price, image: raw.image,
          isMorning: !!raw.isMorning, available: raw.available !== false, featured: !!raw.featured,
        };
      }

      /* One round trip carries the menu, the screen's presentation config and the layout —
         they change together, so fetching them together is also how they stay consistent. */
      async function loadData() {
        try {
          const res = await fetch(qs('/snapshot'), { cache: 'no-store' });
          const body = await res.json().catch(() => null);
          if (!res.ok) {
            throw new Error((body && body.error && body.error.message) || ('HTTP ' + res.status));
          }
          const snap = (body && body.data) || body;
          if (!snap || !Array.isArray(snap.items)) throw new Error('unexpected snapshot payload');

          settings = flattenConfig(snap.config);
          menuItems = snap.items.map(normaliseItem).filter(it => it.name);
          layoutOverride = Object.assign({}, (snap.config && snap.config.layout) || {},
            { board: (snap.config && snap.config.board) || undefined });
          revision = snap.revision || '';
          screenName = (snap.screen && snap.screen.name) || '';
          liveOk = true;
          applySettingsTokens();
          return true;
        } catch (err) {
          liveOk = false;
          window.__loadErrors = [(err && err.message) || String(err)];
          return false;
        }
      }


      /* ─────────────────────────────────────────────────────────────────────────
         7 · LAYOUT — the arrangement is part of the screen's config, so it arrives
             with the snapshot and is not persisted from here. A screen with no
             arrangement saved falls back to balancing the categories itself, which
             is what an unconfigured board has always done.
         ───────────────────────────────────────────────────────────────────────── */
      const CANON_COLS = 3;

      function catOverride(cat) {
        return (cfg.cats && cfg.cats[cat]) || {};
      }
      function catLabel(cat) {
        const v = catOverride(cat).label;
        return (v && String(v)) || cat;
      }
      function catLabelHi(cat, fallback) {
        const v = catOverride(cat).labelHi;
        return (v && String(v)) || fallback || '';
      }

      function getCatFontScale(cat) {
        const ov = catOverride(cat).fs;
        if (typeof ov === 'number' && ov > 0) return ov;
        const v = layoutOverride && layoutOverride.fonts && layoutOverride.fonts[cat];
        return (typeof v === 'number' && v > 0) ? v : 1;
      }

      function balance(cats, byCat) {
        const sorted = [...cats].sort((a, b) => (byCat[b] || []).length - (byCat[a] || []).length);
        const cols = [[], [], []], totals = [0, 0, 0];
        for (const c of sorted) {
          const mi = totals.indexOf(Math.min(...totals));
          cols[mi].push(c);
          totals[mi] += (byCat[c] || []).length;
        }
        return cols;
      }

      /* Canonical model is always three columns — the same array the screen's config
         holds. Narrow screens fold those three into fewer visible columns for display
         only, so a phone opening this board over the LAN sees the same menu without
         changing what the wall screen shows. */
      function computeColumns(cats, byCat) {
        const known = new Set(cats);
        if (layoutOverride && Array.isArray(layoutOverride.columns)) {
          const used = new Set();
          const cols = layoutOverride.columns.map((colCats) => {
            const kept = colCats.filter(c => known.has(c) && (byCat[c] || []).length);
            kept.forEach(c => used.add(c));
            return kept;
          });
          while (cols.length < CANON_COLS) cols.push([]);
          const leftover = cats.filter(c => !used.has(c) && (byCat[c] || []).length);
          leftover.sort((a, b) => (byCat[b] || []).length - (byCat[a] || []).length);
          leftover.forEach((c) => {
            const totals = cols.map(col => col.reduce((s, cc) => s + (byCat[cc] || []).length, 0));
            cols[totals.indexOf(Math.min(...totals))].push(c);
          });
          return cols;
        }
        return balance(cats, byCat);
      }

      function visibleColumnCount() {
        const w = window.innerWidth;
        return w < 768 ? 1 : w < 1200 ? 2 : 3;
      }
      function foldColumns(cols, n) {
        if (n >= cols.length) return cols;
        const out = Array.from({ length: n }, () => []);
        cols.forEach((col, i) => { out[Math.min(n - 1, Math.floor(i * n / cols.length))].push(...col); });
        return out;
      }

      /* ─────────────────────────────────────────────────────────────────────────
         8 · BUSINESS RULES — preserved verbatim from the previous board
         ───────────────────────────────────────────────────────────────────────── */
      /* "07:00" is what the screen's config carries now, but the day-fraction branch
         stays: it costs one line and it is the difference between a readable morning
         window and a blank board if a value ever arrives in the older form. */
      function parseTime(v) {
        const n = parseFloat(v);
        if (!isNaN(n) && n > 0 && n < 1) return Math.round(n * 1440);
        const parts = String(v).trim().split(':').map(Number);
        return (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) ? parts[0] * 60 + parts[1] : null;
      }
      function fmtTime(v) {
        const m = parseTime(v);
        if (m === null) return String(v);
        return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
      }
      function isMorning() {
        const from = parseTime(S('MorningHours_From', '06:00'));
        const to = parseTime(S('MorningHours_To', '11:00'));
        if (from === null || to === null) return false;
        const now = new Date();
        const cur = now.getHours() * 60 + now.getMinutes();
        return cur >= from && cur < to;
      }
      /* Morning is a genuinely restricted menu — only dishes scheduled for the MORNING
         shift show between the configured hours. */
      function visibleItems() {
        const available = menuItems.filter(i => i.available);
        if (!isMorning()) return available;
        const morning = available.filter(i => i.isMorning);
        /* A menu with no morning shift configured is not a menu with nothing for
           breakfast — it is one nobody has scheduled. Showing everything is the honest
           reading of that, and it is the difference between a full board and a blank
           wall at seven in the morning with nobody there to notice. */
        return morning.length ? morning : available;
      }

      const CAT_HUES = 8;
      const hueByCat = {};
      let hueCursor = 0;
      function hueFor(cat) {
        if (!(cat in hueByCat)) hueByCat[cat] = hueCursor++ % CAT_HUES;
        return hueByCat[cat];
      }

      /* ─────────────────────────────────────────────────────────────────────────
         9 · FIT ENGINE
             The old board estimated row heights arithmetically and guessed text
             widths on a canvas. This measures the real laid-out DOM instead, and
             drives everything through a single inherited custom property, so one
             pass is a handful of variable writes rather than a full re-render.
             It can also grow the board to fill a tall screen, not only shrink it.
         ───────────────────────────────────────────────────────────────────────── */
      const Fit = (function () {
        const FLOOR = 0.42;
        /* Upper bound on automatic growth. The old renderer could only shrink from
           1.0, so a short column left the bottom of a TV empty. Set this to 1 to get
           exactly the old shrink-only behaviour back. */
        const CEIL = 1.45;
        const STEPS = 7;
        let scheduled = false;
        let running = false;

        const enabled = () => window.innerWidth >= 768;

        /* Two independent overflow signals. scrollHeight is the cheap one, but the
           column is an overflow:hidden grid item holding layout-contained cards, and
           a clamped scrollHeight would silently make every scale "fit" and blow the
           text up instead of shrinking it. The rect comparison cannot clamp, so the
           search stays correct even if the first signal ever lies. */
        function fitsHeight(col) {
          if (col.scrollHeight > col.clientHeight + 1) return false;
          const last = col.lastElementChild;
          if (!last) return true;
          return last.getBoundingClientRect().bottom <= col.getBoundingClientRect().bottom + 1;
        }
        function fitsWidth(col) {
          const nodes = col.querySelectorAll('[data-clip]');
          for (let i = 0; i < nodes.length; i++) {
            if (nodes[i].scrollWidth > nodes[i].clientWidth + 1) return false;
          }
          return true;
        }
        const setFit = (col, v) => col.style.setProperty('--fit', String(Math.round(v * 1000) / 1000));

        function search(col, lo, hi, pred) {
          let best = lo;
          for (let i = 0; i < STEPS; i++) {
            const mid = (lo + hi) / 2;
            setFit(col, mid);
            if (pred(col)) { best = mid; lo = mid; } else { hi = mid; }
          }
          setFit(col, best);
          return best;
        }

        function fitColumn(col) {
          const prefMax = Math.max(Sn('FontSize_ItemName_EN', 22), Sn('FontSize_CategoryName', 22)) || 22;
          let lo = clamp(Sn('FontSize_Min', 0) > 0 ? Sn('FontSize_Min', 0) / prefMax : FLOOR, FLOOR, 1);

          setFit(col, lo);
          /* Respect FontSize_Min when it can be honoured; drop below it rather than
             let the column overflow and clip rows off the bottom of the screen. */
          if (!fitsHeight(col)) { lo = FLOOR; setFit(col, lo); }

          let f = fitsHeight(col) ? search(col, lo, CEIL, fitsHeight) : lo;

          setFit(col, f);
          if (!fitsWidth(col)) {
            const wLo = Math.max(FLOOR, f * 0.7);
            setFit(col, wLo);
            f = fitsWidth(col) ? search(col, wLo, f, (c) => fitsWidth(c) && fitsHeight(c)) : wLo;
          }
          setFit(col, f);
        }

        function run() {
          if (running) return;
          running = true;
          try {
            const cols = grid.querySelectorAll('.col');
            if (!enabled()) {
              cols.forEach(c => setFit(c, 1));
            } else {
              cols.forEach(fitColumn);
            }
          } catch (err) {
            console.warn('[fit]', err);
          } finally {
            running = false;
          }
        }

        return {
          run,
          /* Coalesce bursts (resize, font load, WS refresh) into one pass. */
          schedule() {
            if (scheduled) return;
            scheduled = true;
            requestAnimationFrame(() => { scheduled = false; run(); });
          },
          get busy() { return running; },
        };
      })();

      /* Observe the grid container only. Observing the columns themselves would
         re-trigger the pass that just resized them. */
      if ('ResizeObserver' in window) {
        const ro = new ResizeObserver(() => { if (!Fit.busy) Fit.schedule(); });
        ro.observe(grid);
      }

      /* ─────────────────────────────────────────────────────────────────────────
         10 · KEYED RECONCILER
              The previous board rebuilt every node on each render, which threw away
              in-flight <img> downloads and blinked the photos. Nodes are reused here
              and keyed by content, not by array position, so a save-and-reload that
              renumbers ids cannot swap one dish's photo onto another.
         ───────────────────────────────────────────────────────────────────────── */
      function patch(parent, models, keyOf, create, update) {
        const existing = new Map();
        for (const node of Array.from(parent.children)) {
          if (node.dataset && node.dataset.k != null) existing.set(node.dataset.k, node);
        }
        let cursor = parent.firstChild;
        for (const m of models) {
          const k = keyOf(m);
          let node = existing.get(k);
          if (node) existing.delete(k);
          else { node = create(m); node.dataset.k = k; }
          if (node === cursor) cursor = cursor.nextSibling;
          else parent.insertBefore(node, cursor);
          update(node, m);
        }
        existing.forEach(n => n.remove());
      }

      /* ─────────────────────────────────────────────────────────────────────────
         11 · ROW + CATEGORY VIEWS
         ───────────────────────────────────────────────────────────────────────── */
      function priceParts(p) {
        const s = String(p == null ? '' : p).trim();
        if (!s) return { cur: '', amt: '–' };
        return /^[0-9]/.test(s) ? { cur: '₹', amt: s } : { cur: '', amt: s };
      }

      /* ---- view mode ---------------------------------------------------------- */
      function buildRowView(node) {
        node.textContent = '';
        const refs = {};
        refs.lead = el('div', 'row__lead');
        refs.img = document.createElement('img');
        refs.img.className = 'thumb';
        refs.img.alt = '';
        refs.img.loading = 'lazy';
        refs.img.decoding = 'async';
        refs.img.addEventListener('error', () => { refs.img.dataset.broken = '1'; });
        refs.img.addEventListener('load', () => { delete refs.img.dataset.broken; });
        refs.lead.appendChild(refs.img);

        refs.en = el('div', 'row__en');
        refs.nm = el('span', 'nm');
        refs.nm.dataset.clip = '1';
        refs.morning = svgIcon('i-sunfill', 'row__morning ico--solid');
        refs.morning.setAttribute('aria-label', 'Morning special');
        refs.en.append(refs.nm, refs.morning);

        refs.hi = el('div', 'row__hi');
        refs.hi.lang = 'hi';
        refs.hi.dataset.clip = '1';

        refs.price = el('div', 'row__price');
        refs.cur = el('span', 'cur');
        refs.amt = el('span');
        refs.price.append(refs.cur, refs.amt);

        node.append(refs.lead, refs.en, refs.hi, refs.price);
        node.__refs = refs;
      }

      function updateRow(node, m) {
        const it = m.item;
        if (node.dataset.mode !== 'view') {
          node.dataset.mode = 'view';
          buildRowView(node);
        }
        node.dataset.id = String(it.id);
        node.dataset.itemId = String(it.id);
        /* Only draggable while the editor owns the page — a wall screen has no pointer. */
        if (document.body.classList.contains('is-editing')) node.draggable = true;
        node.style.setProperty('--d', String(m.seq));
        node.classList.toggle('row--featured', !!it.featured);

        const r = node.__refs;
        const src = it.image || '';
