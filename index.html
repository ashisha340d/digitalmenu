        if (src) {
          if (r.img.getAttribute('src') !== src) r.img.setAttribute('src', src);
          r.img.hidden = false;
        } else {
          r.img.removeAttribute('src');
          r.img.hidden = true;
        }
        r.lead.hidden = !m.hasThumbs;

        if (r.nm.textContent !== it.name) r.nm.textContent = it.name;
        r.morning.hidden = !it.isMorning;
        const hi = it.name_hi || '—';
        if (r.hi.textContent !== hi) r.hi.textContent = hi;

        const p = priceParts(it.price);
        if (r.cur.textContent !== p.cur) r.cur.textContent = p.cur;
        if (r.amt.textContent !== p.amt) r.amt.textContent = p.amt;
      }

      function buildCat() {
        const node = el('section', 'cat');
        node.dataset.mode = 'view';
        node.style.setProperty('--thumb', 'calc(var(--fs-en) * var(--fit) * var(--cat-scale) * 1.62)');

        const hd = el('header', 'cat__hd');
        const icon = el('span', 'cat__icon');
        const iconSvg = svgIcon('i-utensils');
        icon.appendChild(iconSvg);

        const nameEn = el('h2', 'cat__en');
        nameEn.dataset.clip = '1';
        const nameHi = el('span', 'cat__hi');
        nameHi.lang = 'hi';
        nameHi.dataset.clip = '1';

        const meta = el('span', 'cat__meta');
        const count = el('span', 'cat__count');

        meta.append(count);
        hd.append(icon, nameEn, nameHi, meta);

        const rows = el('ul', 'rows');
        node.append(hd, rows);
        node.__refs = { hd, icon, iconSvg, nameEn, nameHi, count, rows };
        return node;
      }

      function updateCat(node, m) {
        node.dataset.mode = 'view';
        node.dataset.cat = m.cat;
        node.dataset.hue = String(hueFor(m.cat));
        node.dataset.thumbs = m.hasThumbs ? '1' : '0';
        node.style.setProperty('--cat-scale', String(getCatFontScale(m.cat)));
        node.style.setProperty('--i', String(m.order));
        if (supportsVT()) node.style.viewTransitionName = m.vtName;
        else node.style.viewTransitionName = '';

        const r = node.__refs;
        const want = '#' + iconFor(m.cat);
        const use = r.iconSvg.querySelector('use');
        if (use && use.getAttribute('href') !== want) use.setAttribute('href', want);
        const label = catLabel(m.cat);
        if (r.nameEn.textContent !== label) r.nameEn.textContent = label;
        const hi = catLabelHi(m.cat, m.catHi || '');
        if (r.nameHi.textContent !== hi) r.nameHi.textContent = hi;
        r.nameHi.hidden = !hi;
        const n = String(m.items.length);
        if (r.count.textContent !== n) r.count.textContent = n;

        let seq = 0;
        patch(
          r.rows,
          m.items.map(item => ({ item, hasThumbs: m.hasThumbs, seq: seq++, key: m.keys.get(item) })),
          (x) => x.key,
          () => el('li', 'row'),
          updateRow
        );
      }

      /* ─────────────────────────────────────────────────────────────────────────
         12 · MAIN RENDER
         ───────────────────────────────────────────────────────────────────────── */
      let emptyNode = null;

      function ensureEmptyState(show, morning) {
        if (!show) {
          if (emptyNode) { Lottie.unmount(emptyNode.querySelector('.lot')); emptyNode.remove(); emptyNode = null; }
          return;
        }
        if (!emptyNode) {
          emptyNode = el('div', 'empty');
          const lot = el('div', 'lot empty__lot');
          lot.dataset.lot = 'empty';
          emptyNode.append(lot, el('div', 'empty__title', 'Nothing on the board'), el('div', 'empty__sub', ''));
          grid.appendChild(emptyNode);
          Lottie.mount(lot);
        }
        emptyNode.lastChild.textContent = morning
          ? 'Nothing is scheduled for the morning shift on this menu.'
          : 'This menu has no available items to show.';
      }

      /* An item can be shown under a different category on this screen — see `moves`.
         Applied here, at the last moment before grouping, so nothing upstream has to know. */
      function effCategory(it) {
        const m = cfg.moves && cfg.moves[it.id];
        return (m && String(m)) || it.category;
      }

      /* Row order inside a category. `menu` keeps whatever Menu Master published. */
      function sortRows(rows) {
        const how = (cfg.sort || 'menu');
        if (how === 'menu') return rows;
        const out = rows.slice();
        if (how === 'name') {
          out.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }));
        } else if (how === 'price') {
          const n = (v) => { const f = parseFloat(String(v).replace(/[^0-9.]/g, '')); return isNaN(f) ? Infinity : f; };
          out.sort((a, b) => n(a.price) - n(b.price));
        }
        return out;
      }

      function buildCategoryModels(items) {
        const cats = [...new Set(items.map(effCategory))].filter(Boolean);
        const byCat = {};
        cats.forEach(c => { byCat[c] = sortRows(items.filter(i => effCategory(i) === c)); });

        /* Stable DOM keys: content-derived, never the positional row id (which the
           server reassigns on every save). Repeats get an occurrence suffix. */
        const keys = new Map();
        const seen = new Map();
        items.forEach((it) => {
          const base = it.category + '\u0000' + it.name;
          const n = (seen.get(base) || 0) + 1;
          seen.set(base, n);
          keys.set(it, base + '\u0000' + n);
        });

        const usedVT = new Set();
        const vtNameFor = (cat) => {
          let base = 'cat-' + slug(cat), name = base, n = 2;
          while (usedVT.has(name)) name = base + '-' + (n++);
          usedVT.add(name);
          return name;
        };

        return { cats, byCat, keys, vtNameFor };
      }

      function paint(fresh) {
        /* Recycled .cat nodes would keep their da-* classes and animate from a
           stale offset, so any in-flight div animation is dropped first. */
        if (typeof DivAnim !== 'undefined' && DivAnim.busy) DivAnim.cancel();
        const morning = isMorning();
        const items = visibleItems();
        const { cats, byCat, keys, vtNameFor } = buildCategoryModels(items);

        updateChrome(items, morning);
        renderRibbon(items);

        const canonical = computeColumns(cats, byCat);
        const visibleCols = foldColumns(canonical, visibleColumnCount());
        grid.style.setProperty('--cols', String(Math.max(1, visibleCols.length)));

        ensureEmptyState(items.length === 0, morning);

        let order = 0;
        const colModels = visibleCols.map((colCats, idx) => ({ idx, colCats }));

        patch(
          grid, colModels,
          (m) => 'col' + m.idx,
          () => el('div', 'col'),
          (colNode, m) => {
            colNode.dataset.colIndex = String(m.idx);
            const catModels = m.colCats
              .filter(c => (byCat[c] || []).length)
              .map((cat) => {
                const list = byCat[cat];
                return {
                  cat,
                  catHi: (list.find(i => i.cat_hi) || {}).cat_hi || '',
                  items: list,
                  hasThumbs: list.some(i => !!i.image),
                  order: order++,
                  vtName: vtNameFor(cat),
                  keys,
                };
              });
            patch(colNode, catModels, (x) => x.cat, buildCat, updateCat);
          }
        );

        grid.classList.remove('is-fresh');
        if (fresh && !reduced) {
          void grid.offsetWidth;                       // restart the entrance animations
          grid.classList.add('is-fresh');
          clearTimeout(paint._t);
          paint._t = setTimeout(() => grid.classList.remove('is-fresh'), 3000);
        }

        updateStat(items, morning);
      }

      /* kind: '' quiet · 'fresh' entrance animation · 'move' morphing view transition */
      function render(kind) {
        const run = () => { paint(kind === 'fresh'); Fit.run(); };
        if (kind === 'move' && supportsVT()) {
          try { document.startViewTransition(run); return; } catch (e) { }
        }
        run();
      }

      /* ─────────────────────────────────────────────────────────────────────────
         13 · HEADER / FOOTER CHROME
         ───────────────────────────────────────────────────────────────────────── */
      function updateChrome(items, morning) {
        const brandEn = $('brandEn'), brandHi = $('brandHi');
        const nameEn = S('RestaurantName', 'Radha Govinda Upahar');
        const nameHi = S('RestaurantName_Hindi', 'राधा गोविंदा उपहार');
        if (brandEn.textContent !== nameEn) brandEn.textContent = nameEn;
        if (brandHi.textContent !== nameHi) brandHi.textContent = nameHi;
        document.title = nameEn + ' · Menu Board';

        const tHi = S('Tagline_Hindi', ''), tEn = S('Tagline', '');
        $('taglineHi').textContent = tHi;
        $('taglineEn').textContent = tEn;
        $('taglineSep').hidden = !(tHi && tEn);

        const pill = $('modePill');
        pill.className = 'pill ' + (morning ? 'pill--morning' : 'pill--allday');
        $('modeLabel').textContent = morning ? 'Morning Menu' : 'All Day';
        const use = $('modeIcon').querySelector('use');
        const want = morning ? '#i-sunfill' : '#i-utensils';
        if (use.getAttribute('href') !== want) use.setAttribute('href', want);
      }

      function updateStat(items, morning) {
        const from = fmtTime(S('MorningHours_From', '06:00'));
        const to = fmtTime(S('MorningHours_To', '11:00'));
        const stat = $('stat');
        stat.textContent = '';
        stat.append(
          el('div', null, items.length + ' items · Morning ' + from + '–' + to),
          el('div', null, screenName || 'Menu board')
        );
      }

      /* "Live" now means the last poll reached the server, not that a socket is open. */
      function updateLivePill() {
        const pill = $('livePill');
        pill.dataset.state = liveOk ? 'on' : 'off';
        $('liveLabel').textContent = liveOk ? 'Live' : 'Reconnecting…';
        const lot = $('lotLive');
        const want = liveOk ? 'ok' : 'bad';
        if (lot.dataset.lotColor !== want) {
          lot.dataset.lotColor = want;
          Lottie.mount(lot, 'connection');
        }
      }

      /* ─────────────────────────────────────────────────────────────────────────
         14 · SPECIALS RIBBON
         ───────────────────────────────────────────────────────────────────────── */
      let ribbonSig = '';

      function renderRibbon(all) {
        const track = $('mqTrack');
        const pool = all.filter(i => i.available);
        const picked = pool.filter(i => i.featured);
        const chosen = picked.length ? picked : pool;
        const withImg = chosen.filter(i => i.image);

        let source;
        if (withImg.length) {
          source = withImg;
        } else {
          /* No photos yet — highlight one item per category instead. */
          const seen = new Set();
          source = chosen.filter(i => { if (seen.has(i.category)) return false; seen.add(i.category); return true; });
        }

        const sig = source.map(i => i.name + '|' + i.price + '|' + i.image).join('~');
        if (sig === ribbonSig) return;                 // don't re-download chip photos
        ribbonSig = sig;

        if (!source.length) { track.textContent = ''; return; }

        let run = source.slice();
        while (run.length < 8) run = run.concat(source);

        const chipOf = (i) => {
          const c = el('div', 'chip' + (i.image ? '' : ' chip--noimg'));
          if (i.image) {
            const img = document.createElement('img');
            img.src = i.image; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
            img.addEventListener('error', () => img.remove());
            c.appendChild(img);
          }
          c.appendChild(el('span', 'chip__en', i.name));
          if (i.name_hi) { const h = el('span', 'chip__hi', i.name_hi); h.lang = 'hi'; c.appendChild(h); }
          c.appendChild(el('span', 'chip__sep', '✦'));
          const p = priceParts(i.price);
          c.appendChild(el('span', 'chip__pr', (p.cur ? p.cur + ' ' : '') + p.amt));
          return c;
        };

        const frag = document.createDocumentFragment();
        /* Doubled so the -50% translate loops seamlessly. */
        run.forEach(i => frag.appendChild(chipOf(i)));
        run.forEach(i => frag.appendChild(chipOf(i)));
        track.textContent = '';
        track.appendChild(frag);

        const pace = clamp(Sn('LangSwitchSeconds', 10), 4, 30) * 0.36;
        track.style.setProperty('--mq-dur', Math.max(26, run.length * pace) + 's');
      }

      /* ─────────────────────────────────────────────────────────────────────────
         15 · CLOCK · THEME · KIOSK
         ───────────────────────────────────────────────────────────────────────── */
      let clockDay = '';
      function updateClock() {
        const now = new Date();
        let h = now.getHours();
        const ampm = h < 12 ? 'AM' : 'PM';
        h = h % 12 || 12;
        const m = String(now.getMinutes()).padStart(2, '0');

        const day = now.toLocaleDateString('en-IN', { weekday: 'long' });
        $('clockTime').textContent = day;
        $('clockDate').textContent =
          now.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })
          + '  ·  ' + h + ':' + m + ' ' + ampm;

        /* Crossing midnight changes the festival of the day. */
        if (clockDay && clockDay !== day) Panel.render();
        clockDay = day;
      }

      const themeBtn = $('btnTheme');
      function applyTheme(t) {
        document.documentElement.dataset.theme = t;
        const night = t === 'night';
        themeBtn.querySelector('use').setAttribute('href', night ? '#i-moon' : '#i-sun');
        themeBtn.setAttribute('aria-label', night ? 'Switch to the daylight board' : 'Switch to the mandir-night board');
        themeBtn.title = themeBtn.getAttribute('aria-label');
        try { localStorage.setItem('menuBoardTheme', t); } catch (e) { }
        Lottie.retheme();
      }
      applyTheme((function () {
        try {
          const saved = localStorage.getItem('menuBoardTheme');
          if (saved === 'night' || saved === 'day') return saved;
        } catch (e) { }
        return matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
      })());
      themeBtn.addEventListener('click', () => {
        applyTheme(document.documentElement.dataset.theme === 'night' ? 'day' : 'night');
      });

      /* ---- full screen -------------------------------------------------------- */
      const fsBtn = $('btnFs');
      let fsDeclined = false;
      const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

      /* Two different full screens can be in play. The Fullscreen API one is ours to
         undo; the other is the *window* state from the launcher's --start-fullscreen,
         which reports no fullscreenElement and cannot be left from script at all —
         only the browser's own F11 closes it. Detected by the window covering the
         screen with no chrome of its own. */
      const isWindowFs = () => !isFs()
        && Math.abs(window.outerHeight - screen.height) < 4
        && Math.abs(window.outerWidth - screen.width) < 4;

      function updateFsBtn() {
        /* A launcher-fullscreen window is still full screen to the person looking at
           it, so the button has to read that way even though the API disagrees. */
        const on = isFs() || isWindowFs();
        fsBtn.querySelector('use').setAttribute('href', on ? '#i-collapse' : '#i-expand');
        fsBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Enter full screen');
        fsBtn.title = (on ? 'Exit full screen' : 'Full screen') + ' (Esc or F11)';
      }
      function toggleFullscreen() {
        try {
          if (isFs()) {
            fsDeclined = true;
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) Promise.resolve(exit.call(document)).catch(() => { });
          } else {
            const root = document.documentElement;
            const req = root.requestFullscreen || root.webkitRequestFullscreen;
            if (req) Promise.resolve(req.call(root)).catch(() => { });
          }
        } catch (e) { }
      }
      fsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isWindowFs()) {
          fsDeclined = true;
          Toast.custom('sync', 'Press F11 for a normal window',
            'This screen was opened full screen by the launcher, which only F11 can leave',
            { duration: 5000 });
          return;
        }
        toggleFullscreen();
      });
      document.addEventListener('fullscreenchange', () => { updateFsBtn(); requestWakeLock(); Fit.schedule(); });
      document.addEventListener('webkitfullscreenchange', () => { updateFsBtn(); Fit.schedule(); });
      updateFsBtn();

      /* A browser only grants full screen from a user gesture, so the board asks on
         the first touch. Once somebody leaves deliberately, it stops asking. */
      function autoFullscreen(e) {
        const t = e.target;
        if (t && t.closest && (t.closest('button') || t.closest('.head') || t.closest('.modal'))) return;
        if (!isFs() && !fsDeclined) toggleFullscreen();
        requestWakeLock();
        window.removeEventListener('pointerdown', autoFullscreen);
      }
      window.addEventListener('pointerdown', autoFullscreen);

      /* ---- keep the screen awake (kiosk) -------------------------------------- */
      let wakeLock = null;
      async function requestWakeLock() {
        if (!('wakeLock' in navigator)) return;
        try {
          if (wakeLock && !wakeLock.released) return;
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (e) { /* denied without a gesture, or unsupported — harmless */ }
      }
      document.addEventListener('visibilitychange', () => { if (!document.hidden) requestWakeLock(); });

      /* ---- idle pointer ------------------------------------------------------- */
      let idleTimer;
      function pointerActive() {
        document.body.classList.remove('is-idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('is-idle'), 5000);
      }
      window.addEventListener('mousemove', pointerActive, { passive: true });
      window.addEventListener('pointerdown', pointerActive, { passive: true });
      pointerActive();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        /* Leaving a launcher full-screen window fires no fullscreenchange — only a
           resize — so the button would otherwise still claim to be full screen. */
        updateFsBtn();
        resizeTimer = setTimeout(() => render(), 140);
      }, { passive: true });

      /* ═════════════════════════════════════════════════════════════════════════
         24 · BOARD CONFIG — today panel, celebrations, ad board.
              Lives inside layout.json under `board` (so it travels with the board)
              and is mirrored to localStorage so the old page can't drop it.
         ═════════════════════════════════════════════════════════════════════════ */
      const DEFAULT_CFG = {
        panel: { x: 1.5, y: 1.1, w: 41, h: 7.6, on: true, wx: true, fest: true, fs: 1 },
        wx: { lat: 27.5820, lon: 77.7000, place: 'Vrindavan', unit: 'C', fs: 1 },
        /* How the rows inside a category are ordered, and any item shown under a different
           category on this screen only. Both are presentation, not menu data. */
        sort: 'menu',
        moves: {},
        cats: {},
        fx: { on: true, anim: 'pushpa', everyMin: 15, forSec: 9 },
        hol: { key: '', country: 'IN', lastSync: '' },
        divAnim: { on: false, style: 'slide', everyMin: 5 },
        /* Admin mode closes itself on an untouched screen — this is a board that
           lives unattended, so a forgotten admin session is a real hazard. */
        admin: { idleSec: 60 },
        /* MM-DD repeats yearly. Lunar festivals need a full YYYY-MM-DD — their
           dates move every year, so they are left for the admin to enter. */
        days: [
          { d: '01-01', n: 'New Year', h: 'नव वर्ष', a: 'kanak' },
          { d: '01-14', n: 'Makar Sankranti', h: 'मकर संक्रांति', a: 'kanak' },
          { d: '01-26', n: 'Republic Day', h: 'गणतंत्र दिवस', a: 'fireworks' },
          { d: '08-15', n: 'Independence Day', h: 'स्वतंत्रता दिवस', a: 'fireworks' },
          { d: '10-02', n: 'Gandhi Jayanti', h: 'गांधी जयंती', a: 'pushpa' },
          { d: '12-25', n: 'Christmas', h: 'क्रिसमस', a: 'deep' },
        ],
        /* Ads are an open-ended list, not fixed slots. Geometry is stored in
           viewport percentages (like the today panel) so a board authored on the
           office monitor still lands correctly on the canteen screen. */
        ads: [
          { id: 'ad-slushie', on: true, title: 'Slushie', hi: 'स्लशी', text: 'Chilled and fresh — ask at the counter.', price: '60', img: '', everyMin: 4, forSec: 10, x: 21, y: 68, w: 58, h: 24 },
          { id: 'ad-pizza', on: true, title: 'Paneer Pizza', hi: 'पनीर पिज़्ज़ा', text: 'Hand stretched, wood-fired, full of paneer.', price: '350', img: '', everyMin: 7, forSec: 10, x: 21, y: 68, w: 58, h: 24 },
          { id: 'ad-dosa', on: true, title: 'Ghee Dosa', hi: 'घी डोसा', text: 'Crisp dosa roasted in pure desi ghee.', price: '120', img: '', everyMin: 11, forSec: 10, x: 21, y: 68, w: 58, h: 24 },
        ],
      };

      const AD_GEO = { x: 21, y: 68, w: 58, h: 24 };
      const AD_LIM = { w: [14, 100], h: [8, 100] };
      let adSeq = 0;
      const adUid = () => 'ad-' + Date.now().toString(36) + '-' + (adSeq++).toString(36);

      /* One ad, with every field present and in range. Used for merging saved data,
         for new rows, and for anything old enough to predate a field. */
      /* The entrance an ad plays. Kept as the keyframe name so the renderer can hand it
         straight to CSS without a lookup table that has to be kept in step. */
      const AD_ANIMS = [
        'ad-in', 'ad-bounce', 'ad-pop', 'ad-rise', 'ad-slide-left', 'ad-slide-right',
        'ad-slide-down', 'ad-flip', 'ad-swing', 'ad-zoom', 'ad-fade', 'ad-unfold', 'ad-glow',
      ];
      const AD_ANIM_LABELS = [
        ['ad-in', 'Lift (default)'], ['ad-bounce', 'Bounce'], ['ad-pop', 'Pop'],
        ['ad-rise', 'Rise'], ['ad-slide-left', 'Slide from left'], ['ad-slide-right', 'Slide from right'],
        ['ad-slide-down', 'Drop in'], ['ad-flip', 'Flip'], ['ad-swing', 'Swing'],
        ['ad-zoom', 'Zoom'], ['ad-fade', 'Fade'], ['ad-unfold', 'Unfold'], ['ad-glow', 'Glow'],
      ];

      function normalizeAd(raw, i) {
        const a = (raw && typeof raw === 'object') ? raw : {};
        const n = (v, d, lo, hi) => { const f = parseFloat(v); return isNaN(f) ? d : clamp(f, lo, hi); };
        return {
          id: String(a.id || '').trim() || ('ad-' + i + '-' + Date.now().toString(36)),
          on: a.on !== false,
          title: String(a.title == null ? '' : a.title),
          hi: String(a.hi == null ? '' : a.hi),
          text: String(a.text == null ? '' : a.text),
          price: String(a.price == null ? '' : a.price),
          // `images` is the current shape; a bare `img` string is what an older saved
          // config carries, and folds into a one-element list so both render the same way.
          images: Array.isArray(a.images)
            ? a.images.map(String).filter(Boolean).slice(0, 6)
            : (a.img ? [String(a.img)] : []),
          // Menu Master item ids this ad advertises; resolved against the live menu at
          // render time, so an id naming a retired dish simply drops out.
          items: Array.isArray(a.items) ? a.items.map(String).filter(Boolean).slice(0, 8) : [],
          fs: n(a.fs, 1, 0.6, 2),
          fsTitle: n(a.fsTitle, 1, 0.6, 2),
          fsHi: n(a.fsHi, 1, 0.6, 2),
          fsText: n(a.fsText, 1, 0.6, 2),
          fsPrice: n(a.fsPrice, 1, 0.6, 2),
          img: (function () {
            const i = (a.img && typeof a.img === 'object') ? a.img : {};
            return {
              x: n(i.x, 0, 0, 100), y: n(i.y, 0, 0, 100),
              w: n(i.w, 34, 5, 100), h: n(i.h, 100, 5, 100),
              fit: i.fit === 'contain' ? 'contain' : 'cover',
            };
          })(),
          anim: AD_ANIMS.indexOf(a.anim) >= 0 ? a.anim : 'ad-in',
          everyMin: n(a.everyMin, 8, 1, 720),
          forSec: n(a.forSec, 10, 3, 60),
          x: n(a.x, AD_GEO.x, 0, 100),
          y: n(a.y, AD_GEO.y, 0, 100),
          w: n(a.w, AD_GEO.w, AD_LIM.w[0], AD_LIM.w[1]),
          h: n(a.h, AD_GEO.h, AD_LIM.h[0], AD_LIM.h[1]),
        };
      }

      let cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));

      function mergeCfg(saved) {
        if (!saved || typeof saved !== 'object') return;
        ['panel', 'wx', 'fx', 'hol', 'divAnim', 'admin'].forEach((k) => { if (saved[k] && typeof saved[k] === 'object') Object.assign(cfg[k], saved[k]); });
        if (Array.isArray(saved.days)) cfg.days = saved.days.filter(x => x && x.d && x.n);
        /* The saved list is authoritative for length — an empty array means the
           operator deleted every ad, not that the file is missing data. */
        if (Array.isArray(saved.ads)) cfg.ads = saved.ads.map(normalizeAd);
      }

      /* The screen's own config is authoritative and applied last: a board that has been
         reconfigured in the Admin Portal must not keep obeying a stale copy some browser
         left in local storage. */
      function loadConfig() {
        let local = null;
        try { local = JSON.parse(localStorage.getItem('menuBoardConfig') || 'null'); } catch (e) { }
        mergeCfg(local);
        mergeCfg(layoutOverride && layoutOverride.board);
      }

      /* ═════════════════════════════════════════════════════════════════════════
         25 · WEATHER — Open-Meteo, no API key. Fails soft: last good reading is
              cached, and a dead network just leaves the card quiet.
         ═════════════════════════════════════════════════════════════════════════ */
      const WMO = [
        [[0], 'Clear', 'i-sun'],
        [[1], 'Mainly Clear', 'i-sun'],
        [[2], 'Partly Cloudy', 'i-cloudsun'],
        [[3], 'Overcast', 'i-cloud'],
        [[45, 48], 'Fog', 'i-fog'],
        [[51, 53, 55, 56, 57], 'Drizzle', 'i-rain'],
        [[61, 63, 65, 66, 67], 'Rain', 'i-rain'],
        [[80, 81, 82], 'Rain Showers', 'i-rain'],
        [[71, 73, 75, 77, 85, 86], 'Snow', 'i-snow'],
        [[95, 96, 99], 'Thunderstorm', 'i-thunder'],
      ];
      function wmoInfo(code) {
        for (const [codes, label, icon] of WMO) if (codes.includes(code)) return { label, icon };
        return { label: '—', icon: 'i-cloud' };
      }

      let weather = null;
      try { weather = JSON.parse(localStorage.getItem('menuBoardWx') || 'null'); } catch (e) { }

      async function fetchWeather() {
        const { lat, lon, unit } = cfg.wx;
        const url = 'https://api.open-meteo.com/v1/forecast'
          + '?latitude=' + encodeURIComponent(lat)
          + '&longitude=' + encodeURIComponent(lon)
          + '&current=temperature_2m,relative_humidity_2m,weather_code'
          + '&temperature_unit=' + (unit === 'F' ? 'fahrenheit' : 'celsius')
          + '&timezone=auto';
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        const c = d && d.current;
        if (!c || typeof c.temperature_2m !== 'number') throw new Error('no reading returned');
        weather = {
          temp: Math.round(c.temperature_2m),
          hum: Math.round(c.relative_humidity_2m),
          code: c.weather_code,
          unit,
          at: Date.now(),
        };
        try { localStorage.setItem('menuBoardWx', JSON.stringify(weather)); } catch (e) { }
        return weather;
      }

      async function refreshWeather(quiet) {
        try {
          await fetchWeather();
          Panel.render();
          return true;
        } catch (err) {
          if (!quiet) Toast.error('Weather unavailable', (err && err.message) + ' — needs internet access');
          Panel.render();
          return false;
        }
      }

      /* ═════════════════════════════════════════════════════════════════════════
         26 · FESTIVAL DAYS
         ═════════════════════════════════════════════════════════════════════════ */
      function todayKeys() {
        const n = new Date();
        const mm = String(n.getMonth() + 1).padStart(2, '0');
        const dd = String(n.getDate()).padStart(2, '0');
        return { md: mm + '-' + dd, ymd: n.getFullYear() + '-' + mm + '-' + dd };
      }
      function todayFestival() {
        const { md, ymd } = todayKeys();
        return cfg.days.find(x => x.d === ymd) || cfg.days.find(x => x.d === md) || null;
      }

      const FEST_ANIM = [
        [['diwali', 'deepavali', 'deepawali', 'lakshmi puja'], 'deep'],
        [['holi', 'dhulandi', 'dol '], 'gulal'],
        [['janmashtami', 'krishna', 'gokul'], 'morpankh'],
        [['radhashtami', 'radha'], 'pushpa'],
        [['ram navami', 'rama navami'], 'pushpa'],
        [['navratri', 'durga', 'dussehra', 'vijaya', 'dasara'], 'fireworks'],
        [['ganesh', 'chaturthi'], 'rangoli'],
        [['govardhan', 'annakut', 'annakoot'], 'pushpa'],
        [['shivaratri', 'shivratri', 'mahashiv'], 'shankh'],
        [['purnima', 'ekadashi', 'guru', 'jayanti', 'buddha'], 'om'],
        [['independence', 'republic', 'gandhi'], 'fireworks'],
        [['new year', 'sankranti', 'pongal', 'baisakhi', 'vaisakhi', 'ugadi', 'gudi'], 'kanak'],
        [['christmas', 'easter', 'good friday'], 'deep'],
        [['eid', 'ramadan', 'ramzan', 'muharram', 'milad'], 'shankh'],
        [['tulsi'], 'tulsi'],
        [['rose', 'valentine'], 'rose'],
      ];
      function animForFestival(name) {
        const l = String(name || '').toLowerCase();
        for (const [keys, a] of FEST_ANIM) if (keys.some(k => l.includes(k))) return a;
        return 'pushpa';
      }

      async function fetchHolidays() {
        const key = String(cfg.hol.key || '').trim();
        if (!key) throw new Error('add your Calendarific API key first');
        const country = String(cfg.hol.country || 'IN').trim().toUpperCase();
        const now = new Date();
        const from = new Date(now.getFullYear(), now.getMonth(), 1);
        const to = new Date(now.getFullYear(), now.getMonth() + 13, 0);
        const out = [];

        for (const year of [now.getFullYear(), now.getFullYear() + 1]) {
          const url = 'https://calendarific.com/api/v2/holidays?api_key=' + encodeURIComponent(key)
            + '&country=' + encodeURIComponent(country) + '&year=' + year;
          const res = await fetch(url);
          const d = await res.json().catch(() => null);
          if (!res.ok) throw new Error((d && d.meta && (d.meta.error_detail || d.meta.error_type)) || ('HTTP ' + res.status));
          if (!d || !d.response || !Array.isArray(d.response.holidays)) throw new Error('unexpected response from Calendarific');
          d.response.holidays.forEach((h) => {
            const iso = h && h.date && h.date.iso ? String(h.date.iso).slice(0, 10) : '';
            if (!/^\d{4}-\d{2}-\d{2}$/.test(iso) || !h.name) return;
            const dt = new Date(iso + 'T00:00:00');
            if (dt < from || dt > to) return;
            out.push({ d: iso, n: String(h.name).trim(), h: '', a: animForFestival(h.name) });
          });
        }

        const seen = new Set();
        const days = out.filter((x) => {
          const k = x.d + '|' + x.n.toLowerCase();
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        }).sort((a, b) => a.d.localeCompare(b.d));
        if (!days.length) throw new Error('no holidays returned for ' + country);
        return days;
      }

      /* ═════════════════════════════════════════════════════════════════════════
         27 · TODAY PANEL
         ═════════════════════════════════════════════════════════════════════════ */
      const Panel = (function () {
        const node = $('tpanel');

        /* Where the weather card sits when it is *not* floating, remembered at boot so
           turning `float` off can put it back exactly where the markup had it rather than
           append it to the end of the panel. */
        const wxHome = (function () {
          const card = $('wxCard');
          return { parent: card.parentNode, before: card.nextSibling };
        })();

        function apply() {
          node.hidden = !cfg.panel.on;
          node.style.setProperty('--px', cfg.panel.x + '%');
          node.style.setProperty('--py', cfg.panel.y + '%');
          node.style.setProperty('--pw', cfg.panel.w + '%');
          node.style.setProperty('--ph', cfg.panel.h + '%');
          node.style.setProperty('--tp-fs', String(clamp(+cfg.panel.fs || 1, 0.6, 2)));
        }

        /* The weather card is either one section inside the Today panel or a box of its own.
           Same element either way — moving it rather than drawing a second copy is what keeps
           the reading, the icon and the humidity bar written by one piece of code below. */
        function applyWxPlacement() {
          const card = $('wxCard');
          const wx = cfg.wx || {};
          const floating = !!wx.float;

          if (floating && card.parentNode !== document.body) {
            document.body.appendChild(card);
          } else if (!floating && card.parentNode === document.body) {
            wxHome.parent.insertBefore(card, wxHome.before);
          }

          card.classList.toggle('wxfloat', floating);
          card.style.setProperty('--wx-fs', String(clamp(+(wx.fs) || 1, 0.6, 2)));
          if (floating) {
            const num = (v, dflt) => { const n = parseFloat(v); return isNaN(n) ? dflt : n; };
            card.style.setProperty('--wx-x', num(wx.x, 62) + '%');
            card.style.setProperty('--wx-y', num(wx.y, 1.1) + '%');
            card.style.setProperty('--wx-w', num(wx.w, 22) + '%');
            card.style.setProperty('--wx-h', num(wx.h, 7.6) + '%');
          } else {
            card.style.removeProperty('--wx-x');
            card.style.removeProperty('--wx-y');
            card.style.removeProperty('--wx-w');
            card.style.removeProperty('--wx-h');
          }
        }

        function render() {
          apply();
          applyWxPlacement();
          $('wxCard').hidden = !cfg.panel.wx;
          $('festBlock').hidden = !cfg.panel.fest;

          if (weather) {
            const info = wmoInfo(weather.code);
            $('wxTemp').textContent = weather.temp + '°';
            $('wxCond').textContent = info.label + (cfg.wx.place ? ' · ' + cfg.wx.place : '');
            $('wxHum').textContent = weather.hum;
            $('wxBar').style.setProperty('--wxfill', clamp(weather.hum, 0, 100) + '%');
            const use = $('wxIcon').querySelector('use');
            if (use.getAttribute('href') !== '#' + info.icon) use.setAttribute('href', '#' + info.icon);
          } else {
            $('wxTemp').textContent = '--°';
            $('wxCond').textContent = 'Weather unavailable';
            $('wxHum').textContent = '--';
            $('wxBar').style.setProperty('--wxfill', '0%');
          }

          const f = todayFestival();
          $('festName').textContent = f ? f.n : 'A quiet day';
          $('festHi').textContent = f ? (f.h || '') : '';
        }


        return { render, apply };
      })();

      /* ═════════════════════════════════════════════════════════════════════════
         28 · CELEBRATION ANIMATIONS
              One canvas, one particle pool, twelve emitters drawn from the ashram
              vocabulary. Everything is transform-free 2D canvas work, so it costs
              no layout and never touches the board's DOM.
         ═════════════════════════════════════════════════════════════════════════ */
      const FX = (function () {
        const cv = $('fxCanvas');
        const ctx = cv.getContext('2d');
        let W = 0, H = 0, dpr = 1;
        let parts = [], raf = 0, stopAt = 0, key = null, last = 0, acc = 0, tail = 0;

        function size(maxDpr) {
          dpr = Math.min(window.devicePixelRatio || 1, maxDpr || 2);
          W = window.innerWidth; H = window.innerHeight;
          cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', () => { if (raf) size(); }, { passive: true });

        const rnd = (a, b) => a + Math.random() * (b - a);
        const pick = (a) => a[(Math.random() * a.length) | 0];
        const rgba = (hex, a) => {
          const n = parseInt(hex.slice(1), 16);
          return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
        };

        const MARIGOLD = ['#ffb02e', '#ff8c1a', '#ffd166', '#f4a300', '#ffc247'];
        const ROSE = ['#ff6f91', '#e0405e', '#ff9ab0', '#c9184a', '#ffd0dc'];
        const GOLD = ['#f2c86e', '#ffe6ad', '#d8a03e', '#fff3d0'];
        const GULAL = ['#e8467c', '#f7b32b', '#3fb27f', '#4a7dde', '#a35ad6', '#ff5d5d'];
        const LEAF = ['#4c9a5a', '#6fbf73', '#2f7d46', '#8fd19e'];
        const PEACOCK = ['#1b7f79', '#0f5e6e', '#2fa8a0', '#0b3f52'];
        /* shell palettes — violet, orchid, gold, rose, aqua */
        const FW_PAL = [
          ['#c14bff', '#e08bff', '#8f5cff', '#f6e0ff'],
          ['#ff4fd8', '#ff8ae6', '#ff2e9a', '#ffd9f2'],
          ['#ffd166', '#ffb02e', '#ff7a3d', '#fff2cd'],
          ['#ff5d7a', '#ff9fb0', '#ff2e63', '#ffe1e7'],
          ['#4fc3ff', '#9ad9ff', '#7a5cff', '#e6f6ff'],
        ];

        /* ---- drawing primitives ---- */
        function dPetal(p) {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
          ctx.globalAlpha = p.al; ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.52, 0, 0, 6.283); ctx.fill();
          ctx.globalAlpha = p.al * 0.4; ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.ellipse(-p.s * .25, 0, p.s * .38, p.s * .2, 0, 0, 6.283); ctx.fill();
          ctx.restore();
        }
        function dLeaf(p) {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
          ctx.globalAlpha = p.al; ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.quadraticCurveTo(p.s * .8, 0, 0, p.s);
          ctx.quadraticCurveTo(-p.s * .8, 0, 0, -p.s); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.lineTo(0, p.s); ctx.stroke();
          ctx.restore();
        }
        function dFeather(p) {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
          ctx.globalAlpha = p.al;
          ctx.strokeStyle = p.c; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(0, p.s * 1.8); ctx.lineTo(0, -p.s * .4); ctx.stroke();
          ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.ellipse(0, -p.s * .9, p.s * .62, p.s * .95, 0, 0, 6.283); ctx.fill();
          ctx.fillStyle = '#0d3b4d';
          ctx.beginPath(); ctx.ellipse(0, -p.s * .95, p.s * .3, p.s * .44, 0, 0, 6.283); ctx.fill();
          ctx.fillStyle = '#f2c86e';
          ctx.beginPath(); ctx.ellipse(0, -p.s * .95, p.s * .13, p.s * .2, 0, 0, 6.283); ctx.fill();
          ctx.restore();
        }
        function dSpark(p) {
          ctx.globalAlpha = p.tw ? p.al * (0.45 + 0.55 * Math.abs(Math.sin(p.life * p.tw))) : p.al;
          ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.283); ctx.fill();
        }
        /* Sparks are drawn as short streaks along their velocity vector. This is
           what makes a shell read as radiating rays instead of a filled disc. */
        function dRay(p) {
          const k = p.k || .05;
          ctx.globalAlpha = p.tw ? p.al * (0.4 + 0.6 * Math.abs(Math.sin(p.life * p.tw))) : p.al;
          ctx.strokeStyle = p.c;
          ctx.lineWidth = p.s;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * k, p.y - p.vy * k);
          ctx.stroke();
          if (p.hot) {
            ctx.globalAlpha = p.al;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.s * .55, 0, 6.283); ctx.fill();
          }
        }
        /* the white-hot bloom at the instant a shell opens */
        function dFlash(p) {
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s);
          g.addColorStop(0, rgba('#ffffff', p.al * .95));
          g.addColorStop(.28, rgba(p.c, p.al * .6));
          g.addColorStop(1, rgba(p.c, 0));
          ctx.globalAlpha = 1; ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.283); ctx.fill();
        }
        function dGlow(p) {
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s * 4);
          g.addColorStop(0, p.c); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalAlpha = p.al * .85; ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 4, 0, 6.283); ctx.fill();
          ctx.globalAlpha = p.al; ctx.fillStyle = '#fff6d8';
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.s * .5, p.s * .8, 0, 0, 6.283); ctx.fill();
        }
        function dRing(p) {
          ctx.globalAlpha = p.al; ctx.strokeStyle = p.c; ctx.lineWidth = p.w || 2;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.283); ctx.stroke();
        }
        function dGlyph(p) {
          ctx.save(); ctx.globalAlpha = p.al; ctx.fillStyle = p.c;
          ctx.font = '600 ' + p.s + 'px "Noto Sans Devanagari", serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(p.ch, p.x, p.y); ctx.restore();
        }
        function dStreak(p) {
          ctx.globalAlpha = p.al; ctx.strokeStyle = p.c; ctx.lineWidth = p.s;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .06, p.y - p.vy * .06); ctx.stroke();
        }
        function dPuff(p) {
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s);
          g.addColorStop(0, p.c); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalAlpha = p.al * .6; ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.283); ctx.fill();
        }
        const DRAW = { ray: dRay, flash: dFlash, petal: dPetal, leaf: dLeaf, feather: dFeather, spark: dSpark, glow: dGlow, ring: dRing, glyph: dGlyph, streak: dStreak, puff: dPuff };

        let CAP = 420;
        const add = (o) => { if (parts.length < CAP) parts.push(o); };
        /* g is gravity (px/s²); ch is the glyph for text particles — keep them apart. */
        const base = (o) => Object.assign({ vx: 0, vy: 0, a: 0, va: 0, al: 1, life: 0, max: 4, s: 6, c: '#fff', t: 'spark', g: 0, ch: '', drag: 1, tw: 0, wind: 0, k: .05, drip: 0, hot: 0 }, o);

        /* ---- the twelve ---- */
        const P = {
          fireworks: {
            label: 'Fireworks', hint: 'Aatishbaazi - grand finale',
            rate: 1.5, cap: 1500, dpr: 1.5,
            /* Fading the frame rather than clearing it is what leaves the burning
               trails; `lighter` lets crossing rays bloom white-hot. */
            fade: .075, glow: true,

            launch(x) {
              const pal = pick(FW_PAL);
              add(base({
                t: 'ray', x: x, y: H + 14,
                vy: rnd(-880, -1080), vx: rnd(-40, 40),
                s: rnd(2.6, 3.6), c: pal[3], max: 2.6, g: 470, drag: .997,
                k: .035, hot: 1, rocket: 1, pal: pal,
              }));
            },
            emit() {
              /* shells come off both wings and, more often, the middle of the sky */
              const r = Math.random();
              if (r < .16) this.launch(rnd(W * .03, W * .14));
              else if (r < .32) this.launch(rnd(W * .86, W * .97));
              else this.launch(rnd(W * .28, W * .72));
              if (Math.random() < .34) this.launch(rnd(W * .30, W * .70));
            },

            burst(p) {
              const pal = p.pal || pick(FW_PAL);
              const kind = pick(['peony', 'peony', 'chrys', 'chrys', 'willow', 'ring', 'crackle']);
              const R = Math.min(W, H);

              add(base({ t: 'flash', x: p.x, y: p.y, s: R * rnd(.055, .095), c: pal[0], max: .32, drag: 1 }));

              /* A real shell is a hollow sphere: every star leaves at nearly the same
                 speed. Spreading speed across the whole range is what filled the
                 middle in and made it look like a coloured disc. */
              let n = 118, sp = R * .55, grav = 135, lifeA = 2.3, lifeB = 3.3,
                sA = 1.6, sB = 2.9, drag = .984, tw = 0, k = .055, dripChance = .18;
              if (kind === 'chrys') { n = 130; sp = R * .62; grav = 175; lifeA = 2.9; lifeB = 4.2; drag = .986; k = .062; dripChance = .3; }
              if (kind === 'willow') { n = 92; sp = R * .40; grav = 320; lifeA = 3.6; lifeB = 5.2; drag = .988; k = .075; dripChance = .45; sB = 2.6; }
              if (kind === 'crackle') { n = 118; sp = R * .50; grav = 165; lifeA = 2.4; lifeB = 3.5; tw = rnd(16, 28); dripChance = .12; }

              if (kind === 'ring') {
                const tilt = rnd(0, 6.283), squash = rnd(.20, .58), rs = R * .52;
                const ct = Math.cos(tilt), st2 = Math.sin(tilt);
                n = 128;
                for (let i = 0; i < n; i++) {
                  const an = (i / n) * 6.283;
                  const ux = Math.cos(an) * rs, uy = Math.sin(an) * rs * squash;
                  add(base({
                    t: 'ray', x: p.x, y: p.y,
                    vx: ux * ct - uy * st2 + rnd(-12, 12),
                    vy: ux * st2 + uy * ct + rnd(-12, 12),
                    s: rnd(1.7, 2.9), c: pick(pal), max: rnd(2.6, 3.6),
                    g: 120, drag: .985, k: .06, hot: Math.random() < .3 ? 1 : 0,
                    drip: Math.random() < .2 ? 1 : 0,
                  }));
                }
              } else {
                /* Even angular spacing at a near-constant speed gives the radial
                   chrysanthemum of a real shell. Projecting a 3-D sphere onto the
                   screen was what packed stars into the middle and made the burst
                   read as a coloured disc. A second, shorter layer adds depth
                   without filling the centre back in. */
                for (let i = 0; i < n; i++) {
                  const inner = i % 10 < 3;
                  const an = (i / n) * 6.283 + rnd(-.035, .035);
                  const v = sp * (inner ? rnd(.5, .66) : rnd(.9, 1.04));
                  add(base({
                    t: 'ray', x: p.x, y: p.y,
                    vx: Math.cos(an) * v, vy: Math.sin(an) * v,
                    s: rnd(sA, sB) * (inner ? .82 : 1), c: pick(pal),
                    max: rnd(lifeA, lifeB) * (inner ? .82 : 1),
                    g: grav, drag: drag, k: k, tw: tw ? rnd(tw * .6, tw) : 0,
                    wind: rnd(-14, 14),
                    hot: Math.random() < .35 ? 1 : 0,
                    drip: Math.random() < dripChance ? 1 : 0,
                  }));
                }
              }

              /* slow embers left hanging in the smoke */
              for (let i = 0; i < 14; i++) {
                add(base({
                  t: 'ray', x: p.x, y: p.y,
                  vx: rnd(-50, 50), vy: rnd(-30, 50),
                  s: rnd(1.1, 1.9), c: pick(pal), max: rnd(3.4, 5.2),
                  g: 34, drag: .993, k: .04, tw: rnd(8, 18), wind: rnd(-20, 20),
                }));
              }
            },
          },
          pushpa: {
            label: 'Pushpa Varsha', hint: 'Marigold petal rain', rate: 26,
            emit() { add(base({ t: 'petal', x: rnd(-30, W + 30), y: -20, vx: rnd(-24, 24), vy: rnd(48, 96), a: rnd(0, 6.28), va: rnd(-1.6, 1.6), s: rnd(7, 15), c: pick(MARIGOLD), max: 9, sway: rnd(18, 46) })); },
          },
          rose: {
            label: 'Rose Shower', hint: 'Gulab pushpa', rate: 18,
            emit() { add(base({ t: 'petal', x: rnd(-30, W + 30), y: -20, vx: rnd(-18, 18), vy: rnd(36, 74), a: rnd(0, 6.28), va: rnd(-1.1, 1.1), s: rnd(9, 18), c: pick(ROSE), max: 11, sway: rnd(22, 54) })); },
          },
          deep: {
            label: 'Deep Daan', hint: 'Floating lamps', rate: 5,
            emit() { add(base({ t: 'glow', x: rnd(W * .05, W * .95), y: H + 20, vy: rnd(-34, -62), vx: rnd(-8, 8), s: rnd(4, 8), c: 'rgba(255,176,46,.9)', max: 11, sway: rnd(8, 22) })); },
          },
          aarti: {
            label: 'Aarti Sparks', hint: 'Camphor glow', rate: 45,
            emit() {
              const cx = W / 2 + Math.sin(Date.now() / 900) * W * .12;
              add(base({ t: 'spark', x: cx + rnd(-40, 40), y: H * .82, vx: rnd(-70, 70), vy: rnd(-150, -260), s: rnd(1.4, 3.4), c: pick(GOLD), max: rnd(1.6, 2.8), g: -20, drag: .985 }));
            },
          },
          morpankh: {
            label: 'Mor Pankh', hint: 'Peacock feathers', rate: 6,
            emit() { add(base({ t: 'feather', x: rnd(0, W), y: -40, vy: rnd(38, 66), vx: rnd(-14, 14), a: rnd(-.5, .5), va: rnd(-.5, .5), s: rnd(14, 24), c: pick(PEACOCK), max: 11, sway: rnd(30, 70) })); },
          },
          tulsi: {
            label: 'Tulsi Drift', hint: 'Sacred leaves', rate: 18,
            emit() { add(base({ t: 'leaf', x: rnd(-20, W + 20), y: -20, vy: rnd(40, 78), vx: rnd(-20, 20), a: rnd(0, 6.28), va: rnd(-1.3, 1.3), s: rnd(6, 12), c: pick(LEAF), max: 10, sway: rnd(20, 48) })); },
          },
          om: {
            label: 'Om Rising', hint: 'ॐ ascends', rate: 3.5,
            emit() { add(base({ t: 'glyph', ch: pick(['ॐ', 'ॐ', 'श्री']), x: rnd(W * .08, W * .92), y: H + 40, vy: rnd(-46, -86), s: rnd(24, 56), c: pick(GOLD), max: 7, sway: rnd(10, 28) })); },
          },
          shankh: {
            label: 'Shankh Naad', hint: 'Golden ripples', rate: 1.6,
            emit() { add(base({ t: 'ring', x: W / 2, y: H / 2, s: 10, grow: rnd(180, 300), w: rnd(1.5, 3.5), c: pick(GOLD), max: 3.4 })); },
          },
          rangoli: {
            label: 'Rangoli Bloom', hint: 'Mandala unfurls', rate: 30,
            emit() {
              const an = rnd(0, 6.283), sp = rnd(120, 300);
              add(base({ t: 'petal', x: W / 2, y: H / 2, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, a: an, va: rnd(-.6, .6), s: rnd(6, 13), c: pick(GULAL), max: 3.6, drag: .984 }));
            },
          },
          gulal: {
            label: 'Gulal Burst', hint: 'Holi colours', rate: 1.6,
            emit() {
              const x = rnd(W * .1, W * .9), y = rnd(H * .2, H * .8), c = pick(GULAL);
              for (let i = 0; i < 9; i++) {
                const an = rnd(0, 6.283), sp = rnd(20, 90);
                add(base({ t: 'puff', x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 12, s: rnd(26, 62), c, max: rnd(1.8, 3), drag: .95 }));
              }
            },
          },
          kanak: {
            label: 'Kanak Varsha', hint: 'Golden rain', rate: 55,
            emit() { add(base({ t: 'streak', x: rnd(0, W), y: -20, vy: rnd(360, 620), vx: rnd(-24, 24), s: rnd(1, 2.4), c: pick(GOLD), max: 4 })); },
          },
        };
        const KEYS = Object.keys(P);

        function step(now) {
          if (!last) last = now;
          let dt = (now - last) / 1000;
          last = now;
          if (dt > .05) dt = .05;                     // never let a stall fling particles

          const spawning = now < stopAt;
          const preset = P[key];
          if (spawning && preset) {
            acc += dt * preset.rate;
            while (acc >= 1) { acc -= 1; preset.emit(); }
          }

          if (preset && preset.fade) {
            /* destination-out fades what is already painted without tinting the
               board underneath - this is what leaves the burning trails. */
            ctx.globalCompositeOperation = 'destination-out';
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(0,0,0,' + preset.fade + ')';
            ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = preset.glow ? 'lighter' : 'source-over';
          } else {
            ctx.clearRect(0, 0, W, H);
          }

          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.life += dt;
            if (p.life >= p.max) { parts.splice(i, 1); continue; }

            p.vy += (p.g || 0) * dt;
            if (p.drag !== 1) { p.vx *= p.drag; p.vy *= p.drag; }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.sway) p.x += Math.sin(p.life * 2.1 + p.s) * p.sway * dt;
            if (p.wind) p.x += p.wind * dt;
            if (p.va) p.a += p.va * dt;
            if (p.grow) p.s += p.grow * dt;

            const k = p.life / p.max;
            p.al = k < .12 ? k / .12 : k > .7 ? Math.max(0, (1 - k) / .3) : 1;

            /* the climbing shell throws sparks behind it, so you see it go up */
            if (p.rocket && Math.random() < .75) {
              add(base({
                t: 'ray', x: p.x + rnd(-2, 2), y: p.y + rnd(-1, 5),
                vx: rnd(-34, 34), vy: rnd(30, 110),
                s: rnd(1, 1.9), c: p.pal ? pick(p.pal) : p.c,
                max: rnd(.3, .65), g: 70, drag: .93, k: .03, tw: rnd(10, 22),
              }));
            }
            /* half-spent stars shed a slower ember that drips downwards */
            if (p.drip && p.life > p.max * .45) {
              p.drip = 0;
              add(base({
                t: 'ray', x: p.x, y: p.y,
                vx: p.vx * .12 + rnd(-10, 10), vy: rnd(8, 46),
                s: p.s * .78, c: p.c, max: rnd(1.5, 2.8),
                g: 145, drag: .992, k: .055, tw: rnd(6, 16),
              }));
            }
            /* a shell opens at the top of its climb */
            if (p.rocket && (p.vy > -70 || p.life > p.max * .92)) { P.fireworks.burst(p); parts.splice(i, 1); continue; }
            if (p.y > H + 90 || p.x < -140 || p.x > W + 140) { parts.splice(i, 1); continue; }

            (DRAW[p.t] || dSpark)(p);
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';

          /* with a fade trail the last embers need a few frames to burn out */
          if (!spawning && !parts.length) {
            if (++tail > (preset && preset.fade ? 46 : 0)) { finish(); return; }
          } else { tail = 0; }
          raf = requestAnimationFrame(step);
        }

        function finish() {
          cancelAnimationFrame(raf);
          raf = 0; last = 0; acc = 0; tail = 0; parts = [];
          cv.classList.remove('is-on');
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.clearRect(0, 0, W, H);
        }

        return {
          keys: KEYS,
          meta: (k) => P[k] || P.pushpa,
          get busy() { return !!raf; },
          play(which, seconds) {
            if (reduced) return;                       // honour the motion preference
            const k = P[which] ? which : 'pushpa';
            size(P[k].dpr);
            CAP = P[k].cap || 420;
            key = k;
            parts = [];
            last = 0; acc = 0; tail = 0;
            stopAt = performance.now() + Math.max(2, +seconds || 9) * 1000;
            cv.classList.add('is-on');
            if (!raf) raf = requestAnimationFrame(step);
          },
          stop: finish,
        };
      })();

      /* Scheduler: the festival day's own animation wins over the default.
         Celebrations run on their own layer and answer to nobody — the canvas
         sits below the ad board (--z-drag vs --z-modal) and is pointer-transparent,
         so it can paint behind an ad or a div sweep without disturbing either. */
      let fxTimer = null;
      function scheduleFX() {
        clearInterval(fxTimer);
        if (!cfg.fx.on || reduced) return;
        const every = clamp(+cfg.fx.everyMin || 15, 1, 720);
        fxTimer = setInterval(() => {
          if (document.hidden) return;
          playFX();
        }, every * 60000);
      }
      function playFX() {
        const f = todayFestival();
        FX.play((f && f.a) || cfg.fx.anim, cfg.fx.forSec);
      }

      /* ═════════════════════════════════════════════════════════════════════════
         29a · DIV ANIMATION — periodic entrance effects on category cards
         ═════════════════════════════════════════════════════════════════════════ */
      const DivAnim = (function () {
        let timer = null;
        let endT = null;
        let running = false;

        const DA_CLASSES = [
          'da-anim',
          'da-slide-left', 'da-slide-right', 'da-slide-top', 'da-slide-bottom',
          'da-drawer-left', 'da-drawer-right', 'da-drawer-top', 'da-drawer-bottom',
          'da-flip-left', 'da-flip-right', 'da-flip-top', 'da-flip-bottom',
          'da-zoom-left', 'da-zoom-right', 'da-zoom-top', 'da-zoom-bottom',
          'da-fade-left', 'da-fade-right', 'da-fade-top', 'da-fade-bottom',
          'da-swing-left', 'da-swing-right', 'da-swing-top', 'da-swing-bottom',
        ];
        const DA_STYLES = ['slide', 'drawer', 'flip', 'zoom', 'fade', 'swing'];
        let daCycle = 0;

        function directionFor(cat, rect) {
          const r = rect || cat.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const dx = cx / vw;
          const dy = cy / vh;

          if (dx < 0.33) return 'left';
          if (dx > 0.67) return 'right';
          if (dy < 0.4) return 'top';
          return 'bottom';
        }

        function clearAnim(cat) {
          DA_CLASSES.forEach(c => cat.classList.remove(c));
          cat.style.removeProperty('--da-i');
        }

        /* Stagger is CSS-driven (--da-i * 70ms) rather than a setTimeout per card,
           so every card starts from the same frame and the sequence cannot drift
           or half-apply if the tab is throttled. */
        const STEP = 70, DUR = 620, GLITTER = 1500, PAD = 260;

        function cancel() {
          clearTimeout(endT);
          grid.querySelectorAll('.cat').forEach((c) => {
            clearAnim(c);
            c.style.removeProperty('--da-i');
          });
          grid.classList.remove('da-playing');
          running = false;
        }

        /* The sweep shares a lane with the ad board: it plays after an ad exits
           (Ads chains into it) and otherwise fills the gaps on its own interval.
           FX is deliberately not consulted — celebrations are a background layer. */
        function play(force) {
          if (running) return false;
          if (reduced) return false;
          if (!force && !cfg.divAnim.on) return false;
          if (!force && (document.hidden || Ads.busy)) return false;

          const cats = Array.from(grid.querySelectorAll('.cat'));
          if (!cats.length) return false;

          /* `random` walks the vocabulary in turn rather than picking one each time: a board
             running all day shows every motion instead of landing on the same one twice. */
          let style = cfg.divAnim.style;
          if (style === 'random') {
            style = DA_STYLES[daCycle % DA_STYLES.length];
            daCycle++;
          }
          if (!DA_STYLES.includes(style)) style = 'slide';
          running = true;

          cats.forEach((c) => { clearAnim(c); c.style.removeProperty('--da-i'); });
          grid.classList.add('da-playing');
          void grid.offsetWidth;                       // commit the reset

          /* Order by visual position (top-to-bottom, then left-to-right) so the
             stagger sweeps the board instead of following DOM/column order. */
          const ordered = cats
            .map((cat) => ({ cat, r: cat.getBoundingClientRect() }))
            .sort((a, b) => (a.r.top - b.r.top) || (a.r.left - b.r.left));

          ordered.forEach(({ cat, r }, i) => {
            cat.style.setProperty('--da-i', String(i));
            cat.classList.add('da-anim', 'da-' + style + '-' + directionFor(cat, r));
          });

          const total = (ordered.length - 1) * STEP + Math.max(DUR, GLITTER) + PAD;
          endT = setTimeout(cancel, total);
          /* Re-base the idle interval off this play, so a sweep chained from an ad
             isn't followed seconds later by the one the interval had already queued. */
          schedule();
          return true;
        }

        function schedule() {
          clearInterval(timer);
          if (!cfg.divAnim.on || reduced) return;
          const every = clamp(+cfg.divAnim.everyMin || 5, 1, 720);
          timer = setInterval(() => play(), every * 60000);
        }

        return { play, schedule, cancel, get busy() { return running; } };
      })();

      /* ═════════════════════════════════════════════════════════════════════════
   29 · AD BOARD — three slots, three timers, one at a time.
        Paired with the div sweep: an ad never opens mid-sweep, and every ad
        hands off to a sweep once it has finished leaving.
   ═════════════════════════════════════════════════════════════════════════ */
      const Ads = (function () {
        const node = $('adboard');
        const timerBar = $('adTimer');
        let showing = false;
        let hiding = false;
        let hideAt = 0;
        let live = null;                               // the ad currently on screen
        let ticker = null;
        let hideT = null;                              // the in-flight exit transition
        let imgCycleT = null;                          // the in-flight multi-photo crossfade

        /* Next-fire times are keyed by ad id, never by index: deleting a row must
           not hand its countdown to whichever ad shifted up into its place. */
        let next = Object.create(null);

        // An ad earns its slot with a title *or* with a dish tagged to it, which supplies one.
        const eligible = () => cfg.ads.filter(a => a && a.on && (a.title || (a.items && a.items.length)));

        /* Rebuild the schedule over the current ads: unknown ids get a staggered
           first appearance, departed ids are dropped, survivors keep their place
           in the queue unless `base` pushes them later. */
        function seed(base, step, reset) {
          const now = Date.now();
          const fresh = Object.create(null);
          eligible().forEach((a, i) => {
            const at = now + base + i * step;
            fresh[a.id] = (!reset && next[a.id]) ? Math.max(next[a.id], at) : at;
          });
          next = fresh;
        }

        function reseed() { seed(8000, 6000, false); }

        /* The dishes an ad is tagged to, resolved against the menu the board is already
           holding. An id that no longer resolves is dropped rather than drawn blank — a
           dish can be retired while an ad still names it, and the wall must not stop for
           that. */
        function taggedItems(a) {
          const ids = Array.isArray(a && a.items) ? a.items : [];
          if (!ids.length) return [];
          const out = [];
          for (const id of ids) {
            const it = menuItems.find(m => m.id === id);
            if (it) out.push(it);
          }
          return out;
        }

        function fill(a, tagged) {
          const first = tagged.length ? tagged[0] : null;

          /* A tagged ad that was never given its own words borrows the dish's — that is the
             whole point of tagging one, and it keeps the ad correct after a rename. */
          $('adTitle').textContent = a.title || (first ? first.name : '');
          $('adHi').textContent = a.hi || (first ? (first.name_hi || '') : '');
          $('adText').textContent = a.text || '';

          /* Two or more dishes list; a single one is already said by the title and the
             price beside it, so listing it again would just repeat itself. */
          const list = $('adItems');
          list.textContent = '';
          if (tagged.length > 1) {
            for (const it of tagged) {
              const li = document.createElement('li');
              li.className = 'ad__item';
              const name = document.createElement('span');
              name.className = 'ad__item-name';
              name.textContent = it.name;
              li.appendChild(name);
              if (it.name_hi) {
                const hi = document.createElement('span');
                hi.className = 'ad__item-hi';
                hi.lang = 'hi';
                hi.textContent = it.name_hi;
                li.appendChild(hi);
              }
              if (it.price) {
                const pr = document.createElement('span');
                pr.className = 'ad__item-price';
                pr.textContent = '₹' + it.price;
                li.appendChild(pr);
              }
              list.appendChild(li);
            }
          }
          list.hidden = tagged.length < 2;

          const price = $('adPrice');
          const p = String(a.price || '').trim() || (tagged.length === 1 && first.price ? first.price : '');
          price.textContent = p ? (/^[0-9]/.test(p) ? '₹' + p : p) : '';
          price.hidden = !p;
        }

        /* One photo holds for the whole slot; several split it evenly and crossfade —
           the same element fades to 0, swaps `src` while invisible, fades back in.
           Floored at 2.5s/photo so a short ad with many photos never flashes past
           anything a person could actually look at. */
        function stopImageCycle() {
          clearTimeout(imgCycleT);
          imgCycleT = null;
        }
        function startImageCycle(images, totalSec) {
          stopImageCycle();
          const img = $('adImg');
          if (!images || !images.length) { img.hidden = true; return; }
          img.hidden = false;
          let i = 0;
          const per = Math.max(2.5, totalSec / images.length);
          const paint = () => {
            img.setAttribute('src', images[i % images.length]);
            i++;
          };
          paint();
          if (images.length < 2) return;
          const tick = () => {
            if (reduced) { paint(); imgCycleT = setTimeout(tick, per * 1000); return; }
            img.classList.add('is-swapping');
            imgCycleT = setTimeout(() => {
              paint();
              img.classList.remove('is-swapping');
              imgCycleT = setTimeout(tick, per * 1000);
            }, 400);
          };
          imgCycleT = setTimeout(tick, per * 1000);
        }

        /* Geometry rides on custom properties so the entry/exit keyframes stay free
           to own `translate` without fighting the position. */
        function place(a) {
          const g = (k) => { const v = parseFloat(a && a[k]); return isNaN(v) ? AD_GEO[k] : v; };
          node.style.setProperty('--ad-x', g('x') + '%');
          node.style.setProperty('--ad-y', g('y') + '%');
          node.style.setProperty('--ad-w', g('w') + '%');
          node.style.setProperty('--ad-h', g('h') + '%');
          node.style.setProperty('--ad-fs', String(clamp(parseFloat(a && a.fs) || 1, 0.6, 2)));
          node.style.setProperty('--ad-fs-title', String(clamp(parseFloat(a && a.fsTitle) || 1, 0.6, 2)));
          node.style.setProperty('--ad-fs-hi', String(clamp(parseFloat(a && a.fsHi) || 1, 0.6, 2)));
          node.style.setProperty('--ad-fs-text', String(clamp(parseFloat(a && a.fsText) || 1, 0.6, 2)));
          node.style.setProperty('--ad-fs-price', String(clamp(parseFloat(a && a.fsPrice) || 1, 0.6, 2)));
          const im = (a && a.img) || {};
          node.style.setProperty('--ad-img-x', (im.x == null ? 0 : im.x) + '%');
          node.style.setProperty('--ad-img-y', (im.y == null ? 0 : im.y) + '%');
          node.style.setProperty('--ad-img-w', (im.w == null ? 34 : im.w) + '%');
          node.style.setProperty('--ad-img-h', (im.h == null ? 100 : im.h) + '%');
          node.style.setProperty('--ad-img-fit', im.fit === 'contain' ? 'contain' : 'cover');
          const anim = AD_ANIMS.indexOf(a && a.anim) >= 0 ? a.anim : 'ad-in';
          node.style.setProperty('--ad-in', anim);
          node.style.setProperty('--ad-in-dur', anim === 'ad-bounce' ? '1100ms' : '760ms');
        }

        /* Editor hooks. `sample` holds the ad on screen with no entrance at all — the
           point of a sample is to read the wording and judge the type, which an animation
           replaying on every keystroke actively prevents. `preview` plays it properly. */
        function sample(a) {
          stop();
          const tagged = taggedItems(a);
          live = a;
          place(a);
          fill(a, tagged);
          startImageCycle((a.images && a.images.length) ? a.images : tagged.map(it => it.image).filter(Boolean).slice(0, 6), 60);
          node.classList.add('is-live', 'is-still');
          node.classList.remove('is-in', 'is-out');
          timerBar.style.animationName = 'none';
          hideAt = 0;
          showing = false;
        }

        function stop() {
          clearTimeout(hideT);
          stopImageCycle();
          node.classList.remove('is-live', 'is-in', 'is-out', 'is-still');
          showing = false;
          hiding = false;
          live = null;
          hideAt = 0;
        }

        function preview(a) {
          stop();
          show(a);
        }

        function show(a) {
          if (showing || hiding) return;
          const tagged = taggedItems(a);
          /* A tagged ad needs no title of its own — the dish supplies one. */
          if (!a || (!a.title && !tagged.length)) return;
          showing = true;
          live = a;
          place(a);
          fill(a, tagged);
          const secs = clamp(+a.forSec || 10, 3, 60);
          /* Photos pasted onto the ad win; otherwise the tagged dishes' own photography is
             already on file and there is no reason to make somebody paste it again. */
          const pics = (a.images && a.images.length)
            ? a.images
            : tagged.map(it => it.image).filter(Boolean).slice(0, 6);
          startImageCycle(pics, secs);
          node.classList.remove('is-out');
          node.classList.add('is-live', 'is-in');
          timerBar.style.animationDuration = secs + 's';
          timerBar.style.animationName = 'none';
          void timerBar.offsetWidth;
          timerBar.style.animationName = 'ad-timer';
          hideAt = Date.now() + secs * 1000;
        }

        /* Idempotent: the ticker keeps firing during the 540ms exit, and re-entering
           here would restart the animation every second. */
        function hide(chain) {
          if (!showing || hiding) return;
          hiding = true;
          stopImageCycle();
          node.classList.remove('is-in');
          node.classList.add('is-out');
          const done = () => {
            node.classList.remove('is-live', 'is-out');
            showing = false; hiding = false; live = null; hideT = null;
            /* Hand off only once the board is fully out — chaining at the start of
               the 540ms exit would overlap the two instead of sequencing them. */
            if (chain) DivAnim.play();
          };
          if (reduced) done(); else hideT = setTimeout(done, 540);
        }

        function tick() {
          const now = Date.now();
          if (showing) { if (now >= hideAt) hide(true); return; }
          if (document.hidden || DivAnim.busy) return;

          const due = eligible();
          for (let i = 0; i < due.length; i++) {
            const a = due[i];
            if (next[a.id] == null) { next[a.id] = now + clamp(+a.everyMin || 8, 1, 720) * 60000; continue; }
            if (now < next[a.id]) continue;
            next[a.id] = now + clamp(+a.everyMin || 8, 1, 720) * 60000;
            show(a);
            return;                                    // one at a time, always
          }
        }

        return {
          get busy() { return showing; },
          /* Stagger the first appearance so the board isn't noisy right after boot. */
          start() {
            clearInterval(ticker);
            seed(25000, 18000, true);
            ticker = setInterval(tick, 1000);
          },
          reschedule() { reseed(); },
          /* Used only by the editor. */
          sample(a) { sample(a); },
          preview(a) { preview(a); },
          stop() { stop(); },
        };
      })();


      /* ─────────────────────────────────────────────────────────────────────────
         22 · LIVE UPDATES — pushed over WebSocket, never polled

             The board holds open a Socket.IO connection to the backend's public
             /menu-board namespace (see backend/src/realtime/menuBoardSocket.ts).
             That namespace runs no auth middleware — a wall screen has no session
             to present — and carries exactly one event, MENU_BOARD_CHANGED,
             fired after any write that could move what a board renders (a price,
             an availability flag, a photo, a screen's own config). The event
             carries no payload beyond a log reason: it is a hint, never data, so
             the client always re-asks the server for the truth rather than
             trusting what a socket message claims.

             There is no interval timer anywhere in this section. The only three
             things that ever trigger a fetch are: the socket telling us something
             changed, the socket reconnecting after a drop (which might have
             swallowed an event), and the tab coming back into view after being
             hidden (a screen that slept through a network blip must not wake up
             stale). Server load from an idle hall of boards is therefore zero
             between real changes — not "small and periodic", actually zero.
         ───────────────────────────────────────────────────────────────────────── */
      async function checkForUpdates() {
        try {
          const res = await fetch(qs('/revision'), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const body = await res.json();
          const next = ((body && body.data) || body || {}).revision || '';
          if (!next || next === revision) return;

          const busy = Toast.sync('Menu updated', 'Reloading…');
          if (await loadData()) {
            /* The snapshot carries the Today/celebration/ad settings too, so a screen
               reconfigured in the Admin Portal must not need a page reload to obey it. */
            loadConfig();
            Panel.render();
            ribbonSig = '';
            render('fresh');
            Toast.close(busy);
            Toast.refresh(menuItems.length + ' items loaded');
          } else {
            Toast.close(busy);
            Toast.error('Refresh failed', (window.__loadErrors || []).join(' · '));
          }
        } catch (err) {
          /* A failed check is not "the socket is down" — connection state is reported by
             the socket's own open/close events below, which is what the live pill reflects. */
        }
      }

      /* The Socket.IO client bundle is served by the same backend this page depends on for
         its menu data (Socket.IO auto-serves it at /socket.io/socket.io.js), so there is no
         CDN to be unreachable independently of everything else on this page already failing. */
      function connectLiveUpdates() {
        if (typeof io !== 'function') {
          liveOk = false; updateLivePill();
          setTimeout(connectLiveUpdates, 15000);       // the bundle itself failed to load
          return;
        }
        const socket = io(location.origin + '/menu-board', {
          query: SCREEN ? { screen: SCREEN } : {},
        });
        socket.on('connect', () => {
          liveOk = true; updateLivePill();
          checkForUpdates();                            // catch up on anything missed offline
        });
        socket.on('disconnect', () => { liveOk = false; updateLivePill(); });
        socket.on('connect_error', () => { liveOk = false; updateLivePill(); });
        socket.on('menu-board:changed', () => { checkForUpdates(); });
      }

      /* A screen that has been asleep wakes up stale even with a live socket — the tab was
         throttled, not disconnected. Checking on the way back is what stops it showing
         yesterday's prices to the first guest, with no timer involved. */
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkForUpdates();
      });

      /* ═════════════════════════════════════════════════════════════════════════
         22b · LAYOUT EDITOR — the real board, editable, opened from the Admin Portal
         ═════════════════════════════════════════════════════════════════════════
         This is the whole settings surface, run against the live page rather than a
         drawing of it: what an operator drags is the actual Today panel over the actual
         menu at the actual size, so there is nothing left to be surprised by on the wall.

         It is deliberately not reachable by anyone standing at a board. `?edit=1` alone
         does nothing — the portal that opened the window has to post an access token in,
         and every write goes through the same MASTER_WRITE endpoint the portal uses, so
         the server decides, not this page. */
      const FX_CHOICES = [
        ['fireworks', 'Fireworks'], ['pushpa', 'Flower fall'], ['rose', 'Rose petals'],
        ['deep', 'Diyas'], ['aarti', 'Aarti flame'], ['morpankh', 'Peacock feather'],
        ['tulsi', 'Tulsi leaves'], ['om', 'Om'], ['shankh', 'Shankh'],
        ['rangoli', 'Rangoli'], ['gulal', 'Gulal'], ['kanak', 'Golden shower'],
      ];

      const FLAG = String.fromCodePoint(0x1F1EE) + String.fromCodePoint(0x1F1F3);

      const Editor = (function () {
        let token = '';
        let dirty = false;
        let tab = 'header';
        let selAd = null;
        let baseline = '';

        const dockBody = () => $('edBody');

        /* ── config plumbing ──────────────────────────────────────────────────── */

        function snapshotCfg() { return JSON.stringify({ cfg: cfg, layout: layoutOverride }); }

        function markDirty() {
          dirty = snapshotCfg() !== baseline;
          $('edDirty').hidden = !dirty;
        }

        /* Repaint the board from `cfg` after an edit. Same functions the live board
           already uses — the editor never draws anything of its own. */
        function repaint() {
          applySettingsTokens();
          Panel.render();
          render();
          drawAdBoxes();
          markDirty();
        }

        function setCfg(path, value) {
          const parts = path.split('.');
          let node = cfg;
          for (let i = 0; i < parts.length - 1; i++) {
            if (!node[parts[i]] || typeof node[parts[i]] !== 'object') node[parts[i]] = {};
            node = node[parts[i]];
          }
          node[parts[parts.length - 1]] = value;
          repaint();
        }

        function getCfg(path, dflt) {
          const parts = path.split('.');
          let node = cfg;
