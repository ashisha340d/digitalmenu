<!DOCTYPE html>
<html lang="en" data-theme="night">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Radha Govinda Upahar — live bilingual menu board">
  <title>Radha Govinda Upahar · Menu Board</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Cinzel:wght@400;600;700;900&family=Tiro+Devanagari+Hindi&family=Oswald:wght@300;400;500;600;700&display=swap">

  <!-- Optional enhancement, guarded: the board is fully functional if it fails to load
     (offline kiosk), see Lottie.mount(). -->
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie_svg.min.js"
    onerror="window.__lottieFailed=1"></script>

  <!-- Same-origin, not a CDN: this is the backend's own Socket.IO server auto-serving its
     client bundle at its default path. It is what carries live menu updates — see §22 —
     so if it were unreachable, /api/v1/menu-board/snapshot below already would be too. -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    @layer reset, tokens, base, layout, components, admin, motion, utility;

    /* ══════════════════════════════════════════════════════════════════════════
   RESET
   ══════════════════════════════════════════════════════════════════════════ */
    @layer reset {

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      img,
      svg {
        display: block;
        max-width: 100%;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        background: none;
        border: none;
        cursor: pointer;
      }

      ul,
      ol {
        list-style: none;
      }

      :where(h1, h2, h3) {
        font-size: inherit;
        font-weight: inherit;
      }

      [hidden] {
        display: none !important;
      }
    }

    /* ══════════════════════════════════════════════════════════════════════════
   TOKENS — one system, two skins.
   Every colour is derived from four hues so the palette stays in tune.
   ══════════════════════════════════════════════════════════════════════════ */
    @layer tokens {
      :root {
        /* — motion —————————————————————————————————— */
        --ease-out: cubic-bezier(.22, .68, .28, 1);
        --ease-spring: cubic-bezier(.28, 1.3, .42, 1);
        --t-fast: 140ms;
        --t-base: 220ms;
        --t-slow: 380ms;

        /* — geometry ———————————————————————————————— */
        --r-xs: 6px;
        --r-sm: 9px;
        --r-md: 13px;
        --r-lg: 18px;
        --r-pill: 999px;
        --hair: 1px;

        /* — z-index scale ——————————————————————————— */
        --z-bg: 0;
        --z-board: 10;
        --z-chrome: 20;
        --z-drag: 30;
        --z-modal: 40;
        --z-toast: 50;
        --z-boot: 60;

        /* — typography defaults (overridden live from the screen's config) ——— */
        --ff-brand: 'Cinzel', Georgia, serif;
        --ff-ui: 'Poppins', system-ui, sans-serif;
        --ff-en: 'Poppins', system-ui, sans-serif;
        --ff-hi: 'Noto Sans Devanagari', 'Nirmala UI', sans-serif;
        --ff-price: 'Poppins', system-ui, sans-serif;
        --ff-cat: 'Poppins', system-ui, sans-serif;

        --fw-brand: 900;
        --fw-cat: 800;
        --fw-en: 600;
        --fw-hi: 500;
        --fw-price: 800;

        --fs-brand: 26px;
        --fs-cat: 22px;
        --fs-en: 22px;
        --fs-hi: 19px;
        --fs-price: 20px;

        --pad-item: 8px;
        --pad-item-x: 14px;
        --pad-cat: 8px;
        --gap-cat: 10px;
        --gap-col: 12px;
        --pad-outer: 14px;

        /* Devanagari needs more leading than Latin at the same optical size. */
        --lh-en: 1.18;
        --lh-hi: 1.42;

        /* — live scale factors ——————————————————————— */
        --fit: 1;
        /* set per column by the fit engine  */
        --cat-scale: 1;
        /* set per category from layout.json */
      }

      /* ── NIGHT — mandir lamp-light on deep aubergine ─────────────────────── */
      :root[data-theme="night"] {
        color-scheme: dark;

        --bg-0: #12060f;
        --bg-1: #2a0b1c;
        --bg-2: #3d1024;
        --bloom-warm: rgba(255, 153, 51, .22);
        --bloom-deep: rgba(120, 20, 70, .30);
        --orn: rgba(240, 196, 106, .22);

        --gold: #f0c46a;
        --gold-2: #d9a03f;
        --gold-soft: rgba(242, 200, 110, .34);
        --gold-faint: rgba(242, 200, 110, .14);

        --ink: #fbf3e4;
        --ink-2: #f2dcb6;
        --ink-3: rgba(252, 245, 232, .60);

        --surface: color-mix(in srgb, #ffffff 7%, transparent);
        --surface-2: color-mix(in srgb, #ffffff 11%, transparent);
        --surface-line: rgba(242, 200, 110, .26);
        --row-line: rgba(242, 200, 110, .12);
        --row-alt: rgba(255, 255, 255, .035);

        --elev-1: 0 2px 8px rgba(0, 0, 0, .34);
        --elev-2: 0 14px 38px rgba(0, 0, 0, .50);
        --elev-3: 0 28px 76px rgba(0, 0, 0, .64);

        --ok: #74d69a;
        --bad: #ff9d9d;
        --warn: #ffc978;

        /* flat hex tokens — read by the Lottie factory (needs real hex, not color-mix) */
        --lot-accent: #f0c46a;
        --lot-dim: #6b4a2a;
        --lot-ok: #74d69a;
        --lot-bad: #ff8f8f;
        --lot-ink: #fcf5e8;
      }

      /* ── DAY — sandalwood paper, readable in direct sunlight ─────────────── */
      :root[data-theme="day"] {
        color-scheme: light;

        --bg-0: #fbf3df;
        --bg-1: #f1e2c0;
        --bg-2: #e5d0a4;
        --bloom-warm: rgba(255, 153, 51, .30);
        --bloom-deep: rgba(180, 90, 40, .16);
        --orn: rgba(138, 92, 14, .20);

        --gold: #7d4c06;
        --gold-2: #a4700f;
        --gold-soft: rgba(125, 76, 6, .34);
        --gold-faint: rgba(125, 76, 6, .10);

        --ink: #241202;
        --ink-2: #55300c;
        --ink-3: rgba(36, 18, 2, .66);

        --surface: color-mix(in srgb, #ffffff 88%, transparent);
        --surface-2: color-mix(in srgb, #ffffff 96%, transparent);
        --surface-line: rgba(125, 76, 6, .28);
        --row-line: rgba(85, 48, 12, .14);
        --row-alt: rgba(85, 48, 12, .045);

        --elev-1: 0 2px 6px rgba(85, 48, 12, .12);
        --elev-2: 0 10px 26px rgba(85, 48, 12, .18);
        --elev-3: 0 22px 56px rgba(85, 48, 12, .26);

        --ok: #16693a;
        --bad: #a01818;
        --warn: #8a4b00;

        --lot-accent: #7d4c06;
        --lot-dim: #d3b98b;
        --lot-ok: #16693a;
        --lot-bad: #a01818;
        --lot-ink: #241202;
      }

      /* Category rails — eight jewel hues, used as a 3px spine + tinted header.
     Hue-only tokens keep both themes in step. */
      .cat[data-hue="0"] {
        --rail: #c22a52;
        --rail-2: #8c1a39;
      }

      .cat[data-hue="1"] {
        --rail: #1f8a55;
        --rail-2: #0e4f31;
      }

      .cat[data-hue="2"] {
        --rail: #a5641f;
        --rail-2: #6b3d0f;
      }

      .cat[data-hue="3"] {
        --rail: #2461ad;
        --rail-2: #123060;
      }

      .cat[data-hue="4"] {
        --rail: #7a37a6;
        --rail-2: #431d61;
      }

      .cat[data-hue="5"] {
        --rail: #c87400;
        --rail-2: #7c3e00;
      }

      .cat[data-hue="6"] {
        --rail: #158a7c;
        --rail-2: #0a4a44;
      }

      .cat[data-hue="7"] {
        --rail: #ad2262;
        --rail-2: #6d1039;
      }
    }

    /* ══════════════════════════════════════════════════════════════════════════
   BASE
   ══════════════════════════════════════════════════════════════════════════ */
    @layer base {
      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: var(--ff-ui);
        background: var(--bg-1);
        color: var(--ink);
        overflow: hidden;
        /* kiosk: the board never scrolls */
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }

      /* Ambient ground. One fixed painted layer — no per-particle DOM. */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: var(--z-bg);
        background:
          radial-gradient(1200px 620px at 50% -12%, var(--bloom-warm), transparent 62%),
          radial-gradient(900px 520px at 8% 112%, var(--bloom-deep), transparent 60%),
          radial-gradient(900px 520px at 92% 112%, var(--bloom-deep), transparent 60%),
          linear-gradient(158deg, var(--bg-0), var(--bg-1) 48%, var(--bg-2));
      }

      /* Corner mandalas + peacock ornaments, as on the original board. */
      .orn {
        position: absolute;
        pointer-events: none;
        z-index: 0;
        color: var(--orn);
      }

      .orn-tl {
        top: -46px;
        left: -46px;
        width: 230px;
        height: 230px;
      }

      .orn-tr {
        top: -46px;
        right: -46px;
        width: 230px;
        height: 230px;
        transform: scaleX(-1);
      }

      .orn-bl {
        bottom: -60px;
        left: -56px;
        width: 210px;
        height: 210px;
        transform: scaleY(-1);
        opacity: .7;
      }

      .orn-br {
        bottom: -60px;
        right: -56px;
        width: 210px;
        height: 210px;
        transform: scale(-1, -1);
        opacity: .7;
      }

      .mandala-spin {
        animation: spin 120s linear infinite;
        transform-origin: 100px 100px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Drifting golden motes. */
      .motes {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .mote {
        position: absolute;
        bottom: -20px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--gold), transparent 70%);
        opacity: 0;
        animation: float-up linear infinite;
      }

      @keyframes float-up {
        0% {
          transform: translateY(0) translateX(0) scale(.6);
          opacity: 0;
        }

        12% {
          opacity: .75;
        }

        85% {
          opacity: .35;
        }

        100% {
          transform: translateY(-104vh) translateX(38px) scale(1.15);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mandala-spin {
          animation: none;
        }

        .motes {
          display: none;
        }
      }

      :lang(hi),
      .hi {
        font-family: var(--ff-hi);
        line-height: var(--lh-hi);
        font-feature-settings: 'kern' 1, 'liga' 1;
      }

      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
        border-radius: var(--r-xs);
      }

      ::selection {
        background: var(--gold-soft);
        color: var(--ink);
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* Pointer disappears when the board is left alone (kiosk polish). */
      body.is-idle,
      body.is-idle * {
        cursor: none !important;
      }

      body.is-idle.is-admin,
      body.is-idle.is-admin * {
        cursor: auto !important;
      }
    }

    /* ══════════════════════════════════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════════════════════════════════ */
    @layer layout {
      #app {
        position: relative;
        z-index: var(--z-board);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        height: 100dvh;
        opacity: 0;
        transition: opacity var(--t-slow) var(--ease-out);
      }

      #app.is-ready {
        opacity: 1;
      }

      /* ── masthead ─────────────────────────────────────────────────────────── */
      .head {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        padding: 8px max(14px, env(safe-area-inset-right)) 7px max(14px, env(safe-area-inset-left));
      }

      .head::after {
        content: '';
        position: absolute;
        inset: auto 5% 0 5%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-soft) 16%, var(--gold) 50%, var(--gold-soft) 84%, transparent);
      }

      .head__side {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .head__side--end {
        justify-content: flex-end;
      }

      /* ── board grid ───────────────────────────────────────────────────────── */
      .grid {
        display: grid;
        grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
        gap: var(--gap-col);
        padding: 10px var(--pad-outer) 6px;
        min-height: 0;
        overflow: hidden;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: var(--gap-cat);
        min-height: 0;
        overflow: hidden;
      }

      /* An empty column stays on screen so a category can be dragged into it. */
      .col:empty {
        align-items: center;
        justify-content: center;
        min-height: 80px;
        border: 2px dashed var(--gold-soft);
        border-radius: var(--r-md);
      }

      .col:empty::before {
        content: 'º6  Drop a category here  º6';
        font-size: .62rem;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* ── footer ribbon ────────────────────────────────────────────────────── */
      .foot {
        position: relative;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 6px max(14px, env(safe-area-inset-right)) max(7px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        border-top: 1px solid var(--gold-soft);
        background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--bg-0) 34%, transparent));
      }

      /* ── responsive: the same board is opened over LAN on phones ──────────── */
      @media (max-width: 1199px) {
        .grid {
          --cols: 2;
        }
      }

      @media (max-width: 767px) {
        body {
          overflow: auto;
        }

        #app {
          height: auto;
          min-height: 100dvh;
          grid-template-rows: auto 1fr auto;
        }

        .grid {
          --cols: 1;
          overflow: visible;
          padding-bottom: 18px;
        }

        .col {
          overflow: visible;
        }

        .head {
          grid-template-columns: minmax(0, 1fr) auto;
          row-gap: 6px;
        }

        .head__brand {
          grid-column: 1 / -1;
          order: -1;
        }

        .foot {
          position: sticky;
          bottom: 0;
          backdrop-filter: blur(12px);
        }
      }
    }

    /* ══════════════════════════════════════════════════════════════════════════
   COMPONENTS
   ══════════════════════════════════════════════════════════════════════════ */
    @layer components {

      /* ── icon ─────────────────────────────────────────────────────────────── */
      .ico {
        width: 1em;
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      .ico--solid {
        fill: currentColor;
        stroke: none;
      }

      /* ── control buttons — 44px touch targets ─────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--surface-line);
        border-radius: var(--r-pill);
        background: var(--surface);
        color: var(--gold);
        font-size: .74rem;
        font-weight: 600;
        letter-spacing: .1em;
        text-transform: uppercase;
        transition: background var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
      }

      .btn>.ico {
        font-size: 1.15rem;
      }

      .btn:hover {
        background: var(--surface-2);
        border-color: var(--gold);
      }

      .btn:active {
        background: var(--gold-faint);
      }

      .btn--icon {
        padding: 0;
        width: 44px;
      }

      .btn--ghost {
        border-color: transparent;
        background: transparent;
      }

      .btn--ghost:hover {
        border-color: var(--surface-line);
      }

      .btn[disabled] {
        opacity: .45;
        pointer-events: none;
      }

      /* ── pills ────────────────────────────────────────────────────────────── */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 13px;
        border: 1px solid var(--surface-line);
        border-radius: var(--r-pill);
        background: var(--surface);
        color: var(--ink-2);
        font-size: .68rem;
        font-weight: 700;
        letter-spacing: .11em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .pill>.ico {
        font-size: 1rem;
      }

      .pill--morning {
        border-color: color-mix(in srgb, var(--warn) 55%, transparent);
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 13%, transparent);
      }

      .pill--allday {
        border-color: color-mix(in srgb, var(--ok) 45%, transparent);
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 12%, transparent);
      }

      .pill--live {
        padding-left: 7px;
      }

      .pill--live[data-state="off"] {
        border-color: color-mix(in srgb, var(--bad) 50%, transparent);
        color: var(--bad);
      }

      .pill .hi {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 600;
        opacity: .9;
      }

      /* ── clock ────────────────────────────────────────────────────────────── */
      .clock {
        line-height: 1.1;
        text-align: left;
        border-radius: var(--r-sm);
        padding: 4px 6px;
      }

      .clock__time {
        font-family: var(--ff-brand);
        font-size: clamp(1.05rem, 1.5vw, 1.5rem);
        font-variant-numeric: tabular-nums;
        letter-spacing: .04em;
        color: var(--gold);
      }

      .clock__time .ampm {
        font-size: .52em;
        letter-spacing: .16em;
        opacity: .72;
        margin-left: 4px;
      }

      .clock__date {
        margin-top: 3px;
        font-size: .58rem;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* ── brand ────────────────────────────────────────────────────────────── */
      .brand {
        text-align: center;
        line-height: 1.05;
      }

      .brand__en {
        font-family: var(--ff-brand);
        font-weight: var(--fw-brand);
        font-size: var(--fs-brand);
        letter-spacing: .14em;
        text-transform: uppercase;
        white-space: nowrap;
        background: linear-gradient(180deg, #fff6df 4%, var(--gold) 46%, var(--gold-2) 78%, #fff6df 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35));
      }

      :root[data-theme="day"] .brand__en {
        filter: drop-shadow(0 1px 2px rgba(255, 255, 255, .7));
      }

      .brand__hi {
        margin-top: 4px;
        letter-spacing: .04em;
        font-family: 'Tiro Devanagari Hindi', var(--ff-hi);
        font-size: calc(var(--fs-brand) * .68);
        color: var(--ink-2);
        white-space: nowrap;
      }

      .brand__rule {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 5px;
        color: var(--gold);
      }

      .brand__rule::before,
      .brand__rule::after {
        content: '';
        height: 1px;
        width: clamp(34px, 6vw, 72px);
        background: linear-gradient(90deg, transparent, var(--gold));
      }

      .brand__rule::after {
        background: linear-gradient(270deg, transparent, var(--gold));
      }

      .brand__rule .ico {
        font-size: .62rem;
      }

      .tagline {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 4px;
        font-size: .58rem;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .tagline .hi {
        font-size: .7rem;
        letter-spacing: .02em;
        text-transform: none;
        color: var(--ink-2);
      }

      .tagline__sep {
        color: var(--gold);
      }

      .tagline:not(:has(*:not(:empty))) {
        display: none;
      }

      /* ── category card ────────────────────────────────────────────────────── */
      .cat {
        container-type: inline-size;
        container-name: cat;
        position: relative;
        display: flex;
        flex-direction: column;
        flex: none;
        border-radius: var(--r-md);
        border: 1px solid var(--surface-line);
        background: var(--surface);
        box-shadow: var(--elev-1);
        overflow: hidden;
        transition: box-shadow var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out);
      }

      .cat::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        background: linear-gradient(180deg, var(--rail), var(--rail-2));
        z-index: 1;
      }

      .cat:hover {
        box-shadow: var(--elev-2);
      }

      .cat__hd {
        position: relative;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: calc(var(--pad-cat) * var(--fit)) calc(var(--pad-item-x) * var(--fit));
        padding-left: calc(var(--pad-item-x) * var(--fit) + 4px);
        background: linear-gradient(104deg, var(--rail-2), var(--rail));
        color: #fff;
        overflow: hidden;
      }

      .cat__hd::after {
        /* one slow sheen, GPU-only */
        content: '';
        position: absolute;
        inset: 0 auto 0 -60%;
        width: 42%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .16), transparent);
        pointer-events: none;
        will-change: transform;
        animation: sheen 9s var(--ease-out) infinite;
      }

      .cat__icon {
        display: grid;
        place-items: center;
        flex: none;
        width: calc(var(--fs-cat) * var(--fit) * var(--cat-scale) * 1.5);
        height: calc(var(--fs-cat) * var(--fit) * var(--cat-scale) * 1.5);
        border-radius: 50%;
        background: rgba(255, 255, 255, .17);
        border: 1px solid rgba(255, 255, 255, .32);
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, .26);
      }

      .cat__icon .ico {
        font-size: calc(var(--fs-cat) * var(--fit) * var(--cat-scale) * .84);
        stroke-width: 1.6;
      }

      .cat__en {
        font-family: var(--ff-cat);
        font-weight: var(--fw-cat);
        font-size: calc(var(--fs-cat) * var(--fit) * var(--cat-scale));
        line-height: 1.1;
        letter-spacing: .1em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px rgba(0, 0, 0, .4);
      }

      .cat__hi {
        font-size: calc(var(--fs-cat) * var(--fit) * var(--cat-scale) * .8);
        line-height: 1.3;
        color: rgba(255, 255, 255, .84);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px rgba(0, 0, 0, .3);
      }

      .cat__meta {
        position: relative;
        margin-left: auto;
        display: flex;
        align-items: center;
        flex: none;
      }

      .cat__count {
        padding: 2px 9px;
        border-radius: var(--r-pill);
        border: 1px solid rgba(255, 255, 255, .22);
        background: rgba(0, 0, 0, .22);
        color: rgba(255, 255, 255, .92);
        font-size: calc(var(--fs-cat) * var(--fit) * var(--cat-scale) * .58);
        font-variant-numeric: tabular-nums;
        transition: opacity var(--t-fast) var(--ease-out);
      }

      /* Tools are overlaid on the count chip so they never steal width from the
     category name (that used to clip "COUNTER" to "COUNT…"). */
      .cat__tools {
        position: absolute;
        inset: 50% 0 auto auto;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        gap: 5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--t-fast) var(--ease-out);
      }

      .cat:hover .cat__tools,
      body.is-admin .cat__tools {
        opacity: 1;
        pointer-events: auto;
      }

      .cat:hover .cat__count,
      body.is-admin .cat__count {
        opacity: 0;
      }

      .tool {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, .34);
        border-radius: var(--r-xs);
        background: rgba(255, 255, 255, .18);
        color: #fff;
        font-size: .74rem;
        font-weight: 800;
        line-height: 1;
        transition: background var(--t-fast) var(--ease-out);
      }

      .tool:hover {
        background: rgba(255, 255, 255, .42);
      }

      .tool:active {
        background: rgba(255, 255, 255, .58);
      }

      .tool .ico {
        font-size: .95rem;
      }

      .tool--grip {
        cursor: grab;
        touch-action: none;
      }

      .tool--grip:active {
        cursor: grabbing;
      }

      @media (pointer: coarse) {
        .tool {
          width: 38px;
          height: 38px;
        }
      }

      /* ── item rows ────────────────────────────────────────────────────────── */
      .rows {
        display: flex;
        flex-direction: column;
      }

      .row {
        position: relative;
        display: grid;
        grid-template-columns: var(--row-cols, minmax(0, 1.35fr) minmax(0, 1.15fr) auto);
        align-items: center;
        gap: 10px;
        padding: calc(var(--pad-item) * var(--fit)) calc(var(--pad-item-x) * var(--fit));
        padding-left: calc(var(--pad-item-x) * var(--fit) + 4px);
        border-bottom: 1px solid var(--row-line);
      }

      .row:last-child {
        border-bottom: none;
      }

      .row:nth-child(even) {
        background: var(--row-alt);
      }

      .cat[data-thumbs="1"] .row {
        --row-cols: var(--thumb) minmax(0, 1.35fr) minmax(0, 1.15fr) auto;
      }

      .row__lead {
        display: grid;
        place-items: center;
        width: var(--thumb);
      }

      .thumb {
        width: var(--thumb);
        height: var(--thumb);
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--gold);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--bg-0) 40%, transparent), var(--elev-1);
        background: var(--surface-2);
      }

      .thumb[data-broken="1"] {
        visibility: hidden;
      }

      .row__en {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        font-family: var(--ff-en);
        font-weight: var(--fw-en);
        font-size: calc(var(--fs-en) * var(--fit) * var(--cat-scale));
        line-height: var(--lh-en);
        color: var(--ink);
      }

      .row__en .nm {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row__hi {
        min-width: 0;
        font-family: var(--ff-hi);
        font-weight: var(--fw-hi);
        font-size: calc(var(--fs-hi) * var(--fit) * var(--cat-scale));
        line-height: var(--lh-hi);
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row__price {
        justify-self: end;
        padding: 2px 12px;
        border: 1px solid var(--gold-soft);
        border-radius: var(--r-pill);
        background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 16%, transparent), color-mix(in srgb, var(--gold) 5%, transparent));
        font-family: var(--ff-price);
        font-weight: var(--fw-price);
        font-size: calc(var(--fs-price) * var(--fit) * var(--cat-scale));
        font-variant-numeric: tabular-nums lining-nums;
        line-height: 1.2;
        color: var(--gold);
        white-space: nowrap;
        transition: opacity var(--t-fast) var(--ease-out);
      }

      .row__price .cur {
        font-size: .8em;
        opacity: .78;
        margin-right: 1px;
      }

      .row__morning {
        color: var(--warn);
        font-size: .66em;
      }

      .row--featured .row__price {
        border-color: var(--gold);
        box-shadow: 0 0 0 1px var(--gold-faint);
      }

      /* Narrow card → stack the two languages instead of clipping both. */
      @container cat (max-width: 330px) {
        .row {
          grid-template-columns: var(--row-cols-narrow, minmax(0, 1fr) auto);
          row-gap: 1px;
        }

        .cat[data-thumbs="1"] .row {
          --row-cols-narrow: var(--thumb) minmax(0, 1fr) auto;
        }

        .row__en {
          grid-column: var(--c-name, 1);
        }

        .row__hi {
          grid-column: var(--c-name, 1);
          grid-row: 2;
        }

        .cat[data-thumbs="1"] .row {
          --c-name: 2;
        }

        .cat[data-thumbs="1"] .row__lead {
          grid-row: 1 / span 2;
        }

        .row__price {
          grid-row: 1 / span 2;
        }
      }

      /* ── empty state ──────────────────────────────────────────────────────── */
      .empty {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 40px 20px;
        color: var(--ink-3);
        text-align: center;
      }

      .empty__lot {
        width: 96px;
        height: 96px;
      }

      .empty__title {
        font-family: var(--ff-brand);
        font-size: 1.1rem;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .empty__sub {
        font-size: .78rem;
        letter-spacing: .05em;
      }

      /* ── specials ribbon ──────────────────────────────────────────────────── */
      .foot__label {
        text-align: right;
        line-height: 1.15;
        border-radius: var(--r-sm);
        padding: 4px 6px;
      }

      .foot__label .hi {
        display: block;
        font-size: .88rem;
        font-weight: 700;
        color: var(--gold);
      }

      .foot__label .en {
        font-size: .52rem;
        letter-spacing: .19em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .marquee {
        overflow: hidden;
        min-width: 0;
        mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
      }

      .marquee__track {
        display: flex;
        gap: 10px;
        width: max-content;
        will-change: transform;
        animation: marquee var(--mq-dur, 40s) linear infinite;
      }

      .marquee:hover .marquee__track {
        animation-play-state: paused;
      }

      .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        padding: 4px 14px 4px 4px;
        border: 1px solid var(--surface-line);
        border-radius: var(--r-pill);
        background: var(--surface);
      }

      .chip--noimg {
        padding-left: 14px;
      }

      .chip img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid var(--gold);
      }

      .chip__en {
        font-size: .74rem;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
      }

      .chip__hi {
        font-size: .72rem;
        color: var(--ink-2);
        white-space: nowrap;
      }

      .chip__pr {
        font-size: .74rem;
        font-weight: 800;
        color: var(--gold);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .chip__sep {
        color: var(--gold-soft);
        font-size: .6rem;
      }

      .stat {
        text-align: right;
        line-height: 1.55;
        font-size: .55rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }

      #btnReset {
        position: fixed;
        right: 4px;
        bottom: 2px;
        z-index: var(--z-chrome);
        min-width: 34px;
        min-height: 34px;
        width: 34px;
        color: var(--ink-3);
        opacity: .32;
        transition: opacity var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
      }

      #btnReset:hover {
        opacity: 1;
        color: var(--gold);
      }

      /* ── Lottie hosts ─────────────────────────────────────────────────────── */
      .lot {
        position: relative;
        display: grid;
        place-items: center;
        flex: none;
      }

      .lot>svg,
      .lot>div {
        width: 100%;
        height: 100%;
      }

      .lot[data-mode="lottie"]>.lot__fb {
        display: none;
      }

      /* ── boot screen ──────────────────────────────────────────────────────── */
      #boot {
        position: fixed;
        inset: 0;
        z-index: var(--z-boot);
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 15px;
        background: linear-gradient(162deg, var(--bg-0), var(--bg-1) 46%, var(--bg-2));
        transition: opacity var(--t-slow) var(--ease-out);
      }

      #boot.is-gone {
        opacity: 0;
        pointer-events: none;
      }

      .boot__lot {
        width: 74px;
        height: 74px;
      }

      .boot__title {
        font-family: var(--ff-brand);
        font-size: 1.15rem;
        letter-spacing: .24em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .boot__sub {
        font-size: .66rem;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .boot__err {
        max-width: 460px;
        margin-top: 8px;
        padding: 15px 22px;
        border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
        border-radius: var(--r-md);
        background: color-mix(in srgb, var(--bad) 12%, transparent);
        color: var(--bad);
        font-size: .76rem;
        line-height: 1.8;
        text-align: center;
      }

      .boot__err b {
        display: block;
        margin-bottom: 5px;
      }

      .boot__err code {
        font-size: .9em;
        opacity: .7;
      }

      /* ── toasts ───────────────────────────────────────────────────────────── */
      .toasts {
        position: fixed;
        z-index: var(--z-toast);
        right: 14px;
        bottom: 14px;
        display: flex;
        flex-direction: column-reverse;
        gap: 9px;
        max-width: min(380px, calc(100vw - 28px));
        pointer-events: none;
      }

      .toast {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        padding: 10px 13px;
        border: 1px solid var(--surface-line);
        border-radius: var(--r-md);
        background: color-mix(in srgb, var(--bg-1) 92%, transparent);
        backdrop-filter: blur(14px);
        box-shadow: var(--elev-3);
        pointer-events: auto;
        animation: toast-in var(--t-base) var(--ease-spring) both;
      }

      .toast.is-out {
        animation: toast-out var(--t-base) var(--ease-out) both;
      }

      .toast__lot {
        width: 30px;
        height: 30px;
      }

      .toast__txt {
        min-width: 0;
      }

      .toast__title {
        font-size: .78rem;
        font-weight: 700;
        color: var(--ink);
      }

      .toast__detail {
        font-size: .68rem;
        color: var(--ink-3);
        overflow-wrap: anywhere;
      }

      .toast__act {
        min-height: 34px;
        padding: 0 11px;
        border: 1px solid var(--gold-soft);
        border-radius: var(--r-pill);
        color: var(--gold);
        font-size: .66rem;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .toast__act:hover {
        background: var(--gold-faint);
      }

      .toast[data-kind="error"] {
        border-color: color-mix(in srgb, var(--bad) 45%, transparent);
      }

      .toast[data-kind="save"],
      .toast[data-kind="refresh"] {
        border-color: color-mix(in srgb, var(--ok) 40%, transparent);
      }

      /* ══════════════════════════════════════════════════════════════════════════
   TODAY PANEL · CELEBRATIONS · AD BOARD
   ══════════════════════════════════════════════════════════════════════════ */
      @layer components {

        /* ── condensed "today" strip ──────────────────────────────────────────────
     container-type:size means BOTH axes are queryable, so every measurement
     below is in cqmin — drag any edge and the type, icons and gaps rescale
     with the box instead of just reflowing inside it. */
        .tpanel {
          position: fixed;
          z-index: var(--z-chrome);
          left: var(--px, 1.5%);
          top: var(--py, 1.1%);
          width: var(--pw, 41%);
          height: var(--ph, 7.6%);
          min-width: 180px;
          min-height: 46px;
          container-type: size;
          container-name: tp;
          display: flex;
          align-items: center;
          gap: 2.2cqmin;
          padding: 0 2.6cqmin;
          overflow: hidden;
          border: 1px solid var(--surface-line);
          border-radius: clamp(10px, 11cqmin, 20px);
          background:
            radial-gradient(120% 180% at 6% -30%, color-mix(in srgb, var(--gold) 13%, transparent), transparent 62%),
            color-mix(in srgb, var(--bg-1) 86%, transparent);
          backdrop-filter: blur(22px) saturate(1.25);
          box-shadow: var(--elev-2);
          cursor: pointer;
          transition: box-shadow var(--t-base) var(--ease-out), border-color var(--t-base) var(--ease-out);
        }

        .tpanel::before {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: inherit;
          padding: 1px;
          background: linear-gradient(120deg, var(--gold-soft), transparent 40%, transparent 64%, var(--gold-faint));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
          pointer-events: none;
        }

        .tpanel:hover {
          box-shadow: var(--elev-3);
        }

        .tpanel[hidden] {
          display: none;
        }

        body.is-admin .tpanel {
          border-color: var(--gold);
          cursor: grab;
        }

        body.is-admin .tpanel:active {
          cursor: grabbing;
        }

        .tpanel.is-moving {
          box-shadow: var(--elev-3);
          opacity: .97;
          transition: none;
        }

        .tp__sec {
          display: flex;
          flex-direction: column;
          justify-content: center;
          min-width: 0;
        }

        .tp__sec--grow {
          flex: 1 1 auto;
        }

        .tp__div {
          flex: none;
          width: 1px;
          align-self: stretch;
          margin: 24% 0;
          background: var(--surface-line);
        }

        .tp__day {
          font-family: var(--ff-brand);
          font-size: calc(clamp(12px, 30cqmin, 44px) * var(--tp-fs, 1));
          font-weight: 700;
          line-height: 1;
          letter-spacing: -.01em;
          color: var(--gold);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .tp__date {
          margin-top: 2.2cqmin;
          font-size: calc(clamp(8px, 13cqmin, 18px) * var(--tp-fs, 1));
          line-height: 1.15;
          color: var(--ink-2);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .tp__wx {
          display: flex;
          align-items: center;
          gap: 1.6cqmin;
          min-width: 0;
        }

        .tp__wx[hidden] {
          display: none;
        }

        /* Lifted out of the Today panel and placed on its own. It borrows the panel's own
           surface so a board with the card detached still looks like one design rather than
           a widget dropped on top of it — and its own container query, because the sizes
           inside it are all `cqmin` against whatever box holds it. */
        .tp__wx.wxfloat {
          position: fixed;
          z-index: var(--z-chrome);
          left: var(--wx-x, 62%);
          top: var(--wx-y, 1.1%);
          width: var(--wx-w, 22%);
          height: var(--wx-h, 7.6%);
          min-width: 120px;
          min-height: 46px;
          container-type: size;
          container-name: tp;
          justify-content: center;
          gap: 2.2cqmin;
          padding: 0 2.6cqmin;
          overflow: hidden;
          border: 1px solid var(--surface-line);
          border-radius: clamp(10px, 11cqmin, 20px);
          background:
            radial-gradient(120% 180% at 6% -30%, color-mix(in srgb, var(--gold) 13%, transparent), transparent 62%),
            color-mix(in srgb, var(--bg-1) 86%, transparent);
          backdrop-filter: blur(22px) saturate(1.25);
          box-shadow: var(--elev-2);
        }

        /*
         * Held still while somebody is dragging a box over this page in the Admin Portal's
         * layout editor. A card mid-flourish or an ad sliding out from under the cursor makes
         * placing anything a guessing game, and the celebration canvas repainting every frame
         * competes with the drag for the same main thread. Driven by postMessage from the
         * editor (§22) — it is never set on a board on a wall.
         */
        html.is-placing *,
        html.is-placing *::before,
        html.is-placing *::after {
          animation-play-state: paused !important;
          transition: none !important;
        }

        html.is-placing #fxCanvas {
          display: none;
        }

        .tp__wxicon {
          flex: none;
          width: clamp(16px, 34cqmin, 46px);
          height: clamp(16px, 34cqmin, 46px);
          color: var(--gold);
        }

        .tp__temp {
          font-family: var(--ff-en);
          font-size: calc(clamp(13px, 30cqmin, 44px) * var(--wx-fs, 1));
          font-weight: 700;
          line-height: 1;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }

        .tp__cond {
          margin-top: 1cqmin;
          font-size: calc(clamp(8px, 12.5cqmin, 17px) * var(--wx-fs, 1));
          line-height: 1.15;
          color: var(--ink-2);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .tp__hum {
          margin-top: 0.4cqmin;
          font-size: clamp(7px, 10cqmin, 14px);
          color: var(--ink-2);
          font-variant-numeric: tabular-nums;
        }

        .tp__hum small {
          display: none;
        }

        .tp__hum b {
          font-weight: 600;
          color: var(--ink-2);
        }

        /* humidity reads along the bottom edge of the strip — information without a box */
        .tp__bar {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 2px;
          background: var(--row-alt);
        }

        .tp__bar i {
          display: block;
          height: 100%;
          width: var(--wxfill, 0%);
          background: linear-gradient(90deg, var(--gold-2), var(--gold));
          transition: width var(--t-slow) var(--ease-out);
        }

        .tp__fest {
          display: flex;
          align-items: center;
          gap: 2.6cqmin;
          min-width: 0;
        }

        .tp__fest[hidden] {
          display: none;
        }

        .tp__fest .ico {
          flex: none;
          width: clamp(13px, 24cqmin, 32px);
          height: clamp(13px, 24cqmin, 32px);
          color: var(--gold);
        }

        .tp__festname {
          font-size: clamp(10px, 16cqmin, 24px);
          font-weight: 600;
          line-height: 1.1;
          color: var(--gold);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .tp__festhi {
          font-size: clamp(8px, 11.5cqmin, 16px);
          line-height: 1.25;
          color: var(--ink-2);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* Dragged tall and narrow, the strip becomes a stack. */
        @container tp (max-width: 420px) {
          .tpanel {
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: 1.4cqmin;
            padding: 2cqmin 3cqmin;
          }

          .tp__div {
            display: none;
          }

          .tp__day {
            font-size: clamp(12px, 17cqmin, 40px);
          }

          .tp__temp {
            font-size: clamp(12px, 15cqmin, 34px);
          }

          .tp__date,
          .tp__cond,
          .tp__festhi {
            font-size: clamp(8px, 7cqmin, 15px);
          }

          .tp__festname {
            font-size: clamp(9px, 9cqmin, 20px);
          }

          .tp__wxicon {
            width: clamp(14px, 16cqmin, 34px);
            height: clamp(14px, 16cqmin, 34px);
          }
        }

        /* ── resize handles: every edge and every corner, admin only ───────────── */
        .tp__h {
          position: absolute;
          display: none;
          touch-action: none;
          z-index: 3;
        }

        body.is-admin .tp__h {
          display: block;
        }

        .tp__h::after {
          content: '';
          position: absolute;
          background: var(--gold);
          border-radius: 999px;
          opacity: .5;
          transition: opacity var(--t-fast) var(--ease-out);
        }

        .tp__h:hover::after {
          opacity: 1;
        }

        .tp__h[data-dir="n"] {
          left: 14px;
          right: 14px;
          top: -5px;
          height: 11px;
          cursor: ns-resize;
        }

        .tp__h[data-dir="s"] {
          left: 14px;
          right: 14px;
          bottom: -5px;
          height: 11px;
          cursor: ns-resize;
        }

        .tp__h[data-dir="w"] {
          top: 14px;
          bottom: 14px;
          left: -5px;
          width: 11px;
          cursor: ew-resize;
        }

        .tp__h[data-dir="e"] {
          top: 14px;
          bottom: 14px;
          right: -5px;
          width: 11px;
          cursor: ew-resize;
        }

        .tp__h[data-dir="n"]::after,
        .tp__h[data-dir="s"]::after {
          left: 50%;
          top: 50%;
          translate: -50% -50%;
          width: 30px;
          height: 3px;
        }

        .tp__h[data-dir="e"]::after,
        .tp__h[data-dir="w"]::after {
          left: 50%;
          top: 50%;
          translate: -50% -50%;
          width: 3px;
          height: 30px;
        }

        .tp__h[data-dir="nw"] {
          left: -6px;
          top: -6px;
          width: 16px;
          height: 16px;
          cursor: nwse-resize;
        }

        .tp__h[data-dir="ne"] {
          right: -6px;
          top: -6px;
          width: 16px;
          height: 16px;
          cursor: nesw-resize;
        }

        .tp__h[data-dir="sw"] {
          left: -6px;
          bottom: -6px;
          width: 16px;
          height: 16px;
          cursor: nesw-resize;
        }

        .tp__h[data-dir="se"] {
          right: -6px;
          bottom: -6px;
          width: 16px;
          height: 16px;
          cursor: nwse-resize;
        }

        .tp__h[data-dir$="w"]::after,
        .tp__h[data-dir$="e"]::after {
          border-radius: 4px;
        }

        .tp__h[data-dir="nw"]::after,
        .tp__h[data-dir="ne"]::after,
        .tp__h[data-dir="sw"]::after,
        .tp__h[data-dir="se"]::after {
          inset: 3px;
          border-radius: 4px;
        }

        @media (pointer: coarse) {

          .tp__h[data-dir="nw"],
          .tp__h[data-dir="ne"],
          .tp__h[data-dir="sw"],
          .tp__h[data-dir="se"] {
            width: 26px;
            height: 26px;
          }
        }

        .tp__hint {
          position: absolute;
          left: 50%;
          bottom: calc(100% + 9px);
          transform: translateX(-50%);
          display: none;
          white-space: nowrap;
          padding: 5px 11px;
          border-radius: var(--r-pill);
          background: var(--gold);
          color: var(--bg-0);
          font-size: .58rem;
          font-weight: 800;
          letter-spacing: .1em;
          text-transform: uppercase;
        }

        body.is-admin .tp__hint {
          display: block;
        }

        /* ── celebration canvas ─────────────────────────────────────────────────── */
        #fxCanvas {
          position: fixed;
          inset: 0;
          z-index: var(--z-drag);
          pointer-events: none;
          opacity: 0;
          transition: opacity 600ms var(--ease-out);
        }

        #fxCanvas.is-on {
          opacity: 1;
        }

        /* ── ad board flyout ────────────────────────────────────────────────────── */
        /* Position and size come from the ad's own record (viewport percentages,
           same model as the today panel), applied as custom properties when it shows. */
        .adboard {
          font-size: calc(1rem * var(--ad-fs, 1));
          position: fixed;
          left: var(--ad-x, 21%);
          top: var(--ad-y, 68%);
          z-index: var(--z-modal);
          width: var(--ad-w, 58%);
          height: var(--ad-h, 24%);
          translate: 0 0;
          display: none;
          grid-template-columns: auto minmax(0, 1fr) auto;
          align-items: center;
          gap: clamp(24px, 3.2vw, 46px);
          padding: clamp(14px, 2vw, 40px) clamp(30px, 3.6vw, 52px);
          border: 1px solid rgba(0, 0, 0, .10);
          border-radius: 30px;
          background: #ffffff;
          box-shadow: 0 30px 80px rgba(0, 0, 0, .30), 0 0 0 1px rgba(0, 0, 0, .05);
          pointer-events: none;
          overflow: hidden;
        }

        .adboard.is-live {
          display: grid;
        }

        .adboard.is-in {
          animation: var(--ad-in, ad-in) var(--ad-in-dur, 760ms) var(--ease-spring) both;
        }

        .adboard.is-out {
          animation: ad-out 520ms var(--ease-out) both;
        }

        /* A sample shown in the editor: the ad exactly as it will read, held still. An
           entrance that replays every time a field changes makes judging the wording and
           the type size impossible, which is the only reason to look at a sample. */
        .adboard.is-still,
        .adboard.is-still * {
          animation: none !important;
          transition: none !important;
        }

        /* The entrance vocabulary. Each is a whole-box move, so any of them works at any
           position and size on the board. */
        @keyframes ad-bounce {
          0% { opacity: 0; translate: 0 -120%; }
          55% { opacity: 1; translate: 0 6%; }
          72% { translate: 0 -4%; }
          86% { translate: 0 2%; }
          100% { opacity: 1; translate: 0 0; }
        }
        @keyframes ad-pop {
          0% { opacity: 0; scale: .3; }
          62% { opacity: 1; scale: 1.06; }
          100% { opacity: 1; scale: 1; }
        }
        @keyframes ad-slide-left {
          0% { opacity: 0; translate: -60% 0; }
          100% { opacity: 1; translate: 0 0; }
        }
        @keyframes ad-slide-right {
          0% { opacity: 0; translate: 60% 0; }
          100% { opacity: 1; translate: 0 0; }
        }
        @keyframes ad-slide-down {
          0% { opacity: 0; translate: 0 -60%; }
          100% { opacity: 1; translate: 0 0; }
        }
        @keyframes ad-rise {
          0% { opacity: 0; translate: 0 60%; }
          100% { opacity: 1; translate: 0 0; }
        }
        @keyframes ad-flip {
          0% { opacity: 0; transform: perspective(1400px) rotateX(-88deg); }
          64% { opacity: 1; transform: perspective(1400px) rotateX(10deg); }
          100% { opacity: 1; transform: perspective(1400px) rotateX(0); }
        }
        @keyframes ad-swing {
          0% { opacity: 0; transform: perspective(1400px) rotateY(38deg) translateX(28%); }
          60% { opacity: 1; transform: perspective(1400px) rotateY(-8deg) translateX(-2%); }
          100% { opacity: 1; transform: perspective(1400px) rotateY(0) translateX(0); }
        }
        @keyframes ad-zoom {
          0% { opacity: 0; scale: 1.5; filter: blur(10px); }
          100% { opacity: 1; scale: 1; filter: blur(0); }
        }
        @keyframes ad-fade {
          0% { opacity: 0; }
          100% { opacity: 1; }
        }
        @keyframes ad-unfold {
          0% { opacity: 0; scale: 1 .04; }
          58% { opacity: 1; scale: 1.02 1.04; }
          100% { opacity: 1; scale: 1 1; }
        }
        @keyframes ad-glow {
          0% { opacity: 0; scale: .96; box-shadow: 0 0 0 0 var(--gold); }
          55% { opacity: 1; scale: 1.01; box-shadow: 0 0 42px 6px color-mix(in srgb, var(--gold) 55%, transparent); }
          100% { opacity: 1; scale: 1; box-shadow: var(--elev-3); }
        }

        /* Placement mode — the real board, live and draggable, lifted above every
           other layer (including the settings modal, which is closed first) so the
           operator arranges it against the actual screen instead of a preview. */
        .adboard.is-placing {
          display: grid;
          z-index: calc(var(--z-boot) + 1);
          pointer-events: auto;
          animation: none;
          cursor: move;
          touch-action: none;
          outline: 3px dashed var(--gold);
          outline-offset: 5px;
        }

        .adboard.is-placing::after {
          display: none;                               /* park the sheen while placing */
        }

        .adplace {
          position: fixed;
          left: 50%;
          bottom: 26px;
          translate: -50% 0;
          z-index: calc(var(--z-boot) + 2);
          display: none;
          align-items: center;
          gap: 10px;
          padding: 10px 14px;
          border-radius: 999px;
          background: rgba(20, 16, 10, .93);
          box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
          backdrop-filter: blur(6px);
        }

        .adplace.is-on {
          display: flex;
        }

        /* ── ad master grid (settings) ───────────────────────────────────────── */
        .adgrid {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .adrow {
          display: grid;
          grid-template-columns: 30px 34px minmax(0, 1fr) 74px 74px auto;
          align-items: center;
          gap: 10px;
          padding: 7px 10px;
          border: 1px solid rgba(0, 0, 0, .09);
          border-radius: 12px;
          background: rgba(255, 255, 255, .55);
          cursor: pointer;
          user-select: none;
        }

        .adrow:hover {
          border-color: var(--gold);
          background: color-mix(in srgb, var(--gold) 8%, #fff);
        }

        .adrow.is-off {
          opacity: .5;
        }

        .adrow__th {
          width: 34px;
          height: 34px;
          border-radius: 8px;
          object-fit: cover;
          background: rgba(0, 0, 0, .06);
        }

        .adrow__t {
          min-width: 0;
          font-weight: 700;
          font-size: .78rem;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .adrow__t small {
          display: block;
          font-weight: 500;
          font-size: .64rem;
          color: #7a7a7a;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .adrow__n {
          font-size: .66rem;
          color: #6a6a6a;
          font-variant-numeric: tabular-nums;
        }

        .adgrid__empty {
          padding: 22px 12px;
          text-align: center;
          font-size: .7rem;
          color: #8a8a8a;
        }

        .adplace__rd {
          padding: 0 8px;
          color: #f3ead8;
          font-size: .68rem;
          letter-spacing: .05em;
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }

        .adboard::after {
          /* slow gold sheen sweep */
          content: '';
          position: absolute;
          inset: 0 auto 0 -50%;
          width: 38%;
          background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--gold) 26%, transparent), transparent);
          pointer-events: none;
          animation: sheen 4.5s var(--ease-out) infinite;
        }

        /* The board's height is operator-set, so the image tracks the box rather
           than a fixed clamp — otherwise a short board clips its own picture. */
        .ad__media {
          align-self: stretch;
          width: auto;
          height: auto;
          aspect-ratio: 1;
          max-width: clamp(150px, 17vw, 260px);
          border-radius: 24px;
          object-fit: cover;
          border: 3px solid var(--gold);
          box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
          background: #f4f4f4;
          /* An ad with more than one photo crossfades between them by toggling
             .is-swapping around the `src` change — see startImageCycle(). Static
             single-image ads never gain this class, so nothing about how they
             already look changes. */
          transition: opacity .4s var(--ease-out);
        }

        .ad__media.is-swapping {
          opacity: 0;
        }

        .ad__media[hidden] {
          display: none;
        }

        .ad__eyebrow {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font-size: clamp(11px, .92vw, 16px);
          font-weight: 800;
          letter-spacing: .22em;
          text-transform: uppercase;
          color: var(--gold);
        }

        .ad__eyebrow::before {
          content: '';
          width: 26px;
          height: 2px;
          background: var(--gold);
        }

        .adboard { position: fixed; }
        .ad__media {
          position: absolute;
          left: var(--ad-img-x, 0%);
          top: var(--ad-img-y, 0%);
          width: var(--ad-img-w, 34%);
          height: var(--ad-img-h, 100%);
          object-fit: var(--ad-img-fit, cover);
        }

        .ad__title {
          margin-top: 5px;
          font-family: var(--ff-en);
          font-size: calc(clamp(28px, 3.2vw, 52px) * var(--ad-fs-title, 1));
          font-weight: 700;
          line-height: 1.08;
          color: #17120b;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .ad__hi {
          font-size: calc(clamp(17px, 1.9vw, 29px) * var(--ad-fs-hi, 1));
          color: #4a4a4a;
          line-height: 1.4;
        }

        .ad__text {
          margin-top: 6px;
          font-size: calc(clamp(14px, 1.45vw, 22px) * var(--ad-fs-text, 1));
          color: #6a6a6a;
          line-height: 1.45;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }

        /* The dishes an ad is tagged to, drawn from the live menu rather than retyped into
           the ad's own text. One line each: a name, its Hindi, and the current price. */
        .ad__items {
          margin: 8px 0 0;
          padding: 0;
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 4px;
          min-width: 0;
        }

        .ad__items[hidden] {
          display: none;
        }

        .ad__item {
          display: flex;
          align-items: baseline;
          gap: 10px;
          min-width: 0;
          font-size: clamp(14px, 1.5vw, 24px);
          line-height: 1.3;
        }

        .ad__item-name {
          font-weight: 700;
          color: #2f2f2f;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .ad__item-hi {
          font-family: var(--ff-hi, inherit);
          color: #6a6a6a;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .ad__item-price {
          margin-left: auto;
          flex: none;
          font-family: var(--ff-price);
          font-weight: 800;
          color: var(--gold);
          font-variant-numeric: tabular-nums;
        }

        .ad__price {
          display: grid;
          place-items: center;
          padding: clamp(14px, 1.4vw, 24px) clamp(20px, 2vw, 34px);
          border-radius: 22px;
          border: 2px solid var(--gold);
          background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 16%, #fff), #fff);
          font-family: var(--ff-price);
          font-size: calc(clamp(26px, 2.8vw, 46px) * var(--ad-fs-price, 1));
          font-weight: 800;
          color: var(--gold);
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }

        .ad__price[hidden] {
          display: none;
        }

        .ad__timer {
          position: absolute;
          left: 0;
          bottom: 0;
          height: 2px;
          background: linear-gradient(90deg, var(--gold-2), var(--gold));
          width: 100%;
          transform-origin: left;
          animation: ad-timer linear both;
        }

        /* ── settings modal extras ──────────────────────────────────────────────── */
        .tabs {
          display: flex;
          gap: 6px;
          padding: 10px 14px 0;
          flex: none;
          flex-wrap: wrap;
        }

        .tab {
          min-height: 36px;
          padding: 0 14px;
          border: 1px solid var(--surface-line);
          border-radius: var(--r-pill);
          background: transparent;
          color: var(--ink-3);
          font-size: .68rem;
          font-weight: 700;
          letter-spacing: .1em;
          text-transform: uppercase;
        }

        .tab:hover {
          color: var(--ink);
        }

        .tab[aria-selected="true"] {
          background: var(--gold-faint);
          border-color: var(--gold);
          color: var(--gold);
        }

        .pane {
          display: none;
        }

        .pane.is-active {
          display: block;
        }

        .row2 {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
          gap: 9px;
        }

        .card {
          padding: 12px;
          margin-bottom: 12px;
          border: 1px solid var(--surface-line);
          border-radius: var(--r-md);
          background: var(--surface);
        }

        .card>h4 {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 10px;
          font-size: .64rem;
          font-weight: 800;
          letter-spacing: .14em;
          text-transform: uppercase;
          color: var(--gold);
        }

        .card>h4 .spacer {
          margin-left: auto;
        }

        .animgrid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
          gap: 8px;
        }

        .animopt {
          display: flex;
          flex-direction: column;
          gap: 3px;
          padding: 9px 10px;
          text-align: left;
          border: 1px solid var(--surface-line);
          border-radius: var(--r-sm);
          background: transparent;
          color: var(--ink-2);
          transition: border-color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
        }

        .animopt:hover {
          background: var(--row-alt);
        }

        .animopt[aria-pressed="true"] {
          border-color: var(--gold);
          background: var(--gold-faint);
          color: var(--gold);
        }

        .animopt b {
          font-size: .74rem;
          font-weight: 700;
        }

        .animopt span {
          font-size: .62rem;
          opacity: .8;
        }

        .hlist {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .hrow {
          display: grid;
          grid-template-columns: 108px minmax(0, 1fr) 128px auto;
          gap: 6px;
          align-items: center;
        }

        @media (max-width: 620px) {
          .hrow {
            grid-template-columns: 1fr 1fr;
          }
        }

        .sel {
          min-width: 0;
          width: 100%;
          padding: 8px 10px;
          border: 1px solid var(--surface-line);
          border-radius: var(--r-sm);
          background: color-mix(in srgb, var(--bg-0) 45%, transparent);
          color: var(--ink);
          font-size: .8rem;
        }

        :root[data-theme="day"] .sel {
          background: rgba(255, 255, 255, .92);
        }

        .sel:focus {
          outline: none;
          border-color: var(--gold);
        }
      }

      @layer motion {
        /* The -50% that used to live here was the centering; the board is now placed
           by left/top, so these translate purely for the motion. */
        @keyframes ad-in {
          0% {
            opacity: 0;
            translate: 0 42px;
            scale: .94;
            filter: blur(6px);
          }

          60% {
            opacity: 1;
            filter: blur(0);
          }

          100% {
            opacity: 1;
            translate: 0 0;
            scale: 1;
          }
        }

        @keyframes ad-out {
          0% {
            opacity: 1;
            translate: 0 0;
            scale: 1;
          }

          100% {
            opacity: 0;
            translate: 0 26px;
            scale: .97;
            filter: blur(4px);
          }
        }

        @keyframes ad-timer {
          from {
            transform: scaleX(1);
          }

          to {
            transform: scaleX(0);
          }
        }

        @media (prefers-reduced-motion: reduce) {

          .adboard::after,
          .ad__timer {
            display: none;
          }

          .adboard.is-in {
            animation: fade-in 1ms both;
          }

          .adboard.is-out {
            animation: none;
            opacity: 0;
          }

          #fxCanvas {
            display: none;
          }
        }
      }

      /* ── modals ───────────────────────────────────────────────────────────── */
      .modal {
        position: fixed;
        z-index: var(--z-modal);
        left: 0;
        top: 0;
        display: none;
        flex-direction: column;
        width: min(620px, 94vw);
        height: min(640px, 78vh);
        min-width: 320px;
        min-height: 240px;
        resize: both;
        overflow: hidden;
        border: 1px solid var(--gold-soft);
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
        box-shadow: var(--elev-3);
      }

      :root[data-theme="day"] .modal {
        background: linear-gradient(180deg, #fffaf0, #f3e7cc);
      }

      .modal.is-open {
        display: flex;
        animation: modal-in var(--t-base) var(--ease-spring) both;
      }

      .modal--sm {
        width: min(430px, 92vw);
        height: auto;
        min-height: 0;
        resize: none;
      }

      .modal--danger .modal__hd {
        background: color-mix(in srgb, var(--bad) 18%, var(--bg-0));
        border-bottom-color: color-mix(in srgb, var(--bad) 40%, transparent);
      }

      .modal--danger .modal__ttl {
        color: var(--bad);
      }

      .modal--danger .modal__bd {
        border-left: 3px solid var(--bad);
        margin: 8px 14px;
        padding: 8px 12px;
        background: color-mix(in srgb, var(--bad) 6%, transparent);
