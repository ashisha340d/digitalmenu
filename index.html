          for (const p of parts) {
            if (node == null || typeof node !== 'object') return dflt;
            node = node[p];
          }
          return node === undefined || node === null || node === '' ? dflt : node;
        }

        /* ── dragging ─────────────────────────────────────────────────────────── */

        const LIM = {
          panel: { w: [8, 96], h: [3.5, 70] },
          wx: { w: [10, 60], h: [5, 40] },
          ad: { w: [14, 100], h: [8, 100] },
        };

        /* One pointer gesture, moving or resizing one box.
           Writes straight to the element's own style and commits to `cfg` only on
           release: a re-render per pointermove is what makes a drag feel heavy, and
           this page has a full menu, a weather card and an ad rotation to lay out
           again each time. rAF keeps it to one write per frame however fast the
           pointer reports, and pointer capture keeps the gesture attached to the box
           even when the cursor outruns it. */
        function drag(event, node, kind, dir, read, write) {
          event.preventDefault();
          event.stopPropagation();

          const lim = LIM[kind];
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const start = { x: event.clientX, y: event.clientY };
          const origin = read();
          let next = origin;
          let frame = 0;

          document.body.classList.add('is-dragbox');
          try { node.setPointerCapture(event.pointerId); } catch (e) { }

          const paint = () => {
            frame = 0;
            node.style.setProperty(kind === 'ad' ? '--ad-x' : kind === 'wx' ? '--wx-x' : '--px', next.x + '%');
            node.style.setProperty(kind === 'ad' ? '--ad-y' : kind === 'wx' ? '--wx-y' : '--py', next.y + '%');
            node.style.setProperty(kind === 'ad' ? '--ad-w' : kind === 'wx' ? '--wx-w' : '--pw', next.w + '%');
            node.style.setProperty(kind === 'ad' ? '--ad-h' : kind === 'wx' ? '--wx-h' : '--ph', next.h + '%');
            const d = node.querySelector('.edad__d');
            if (d) d.textContent = Math.round(next.w) + '% × ' + Math.round(next.h) + '%';
          };

          const onMove = (e) => {
            const dx = ((e.clientX - start.x) / vw) * 100;
            const dy = ((e.clientY - start.y) / vh) * 100;
            next = resolveBox(origin, dir, dx, dy, lim);
            if (!frame) frame = requestAnimationFrame(paint);
          };

          const onUp = () => {
            node.removeEventListener('pointermove', onMove);
            node.removeEventListener('pointerup', onUp);
            node.removeEventListener('pointercancel', onUp);
            if (frame) cancelAnimationFrame(frame);
            paint();
            document.body.classList.remove('is-dragbox');
            write(next);
          };

          node.addEventListener('pointermove', onMove);
          node.addEventListener('pointerup', onUp);
          node.addEventListener('pointercancel', onUp);
        }

        function resolveBox(o, dir, dx, dy, lim) {
          const r1 = (v) => Math.round(v * 10) / 10;
          if (dir === 'move') {
            return {
              x: r1(clamp(o.x + dx, 0, Math.max(0, 100 - o.w))),
              y: r1(clamp(o.y + dy, 0, Math.max(0, 100 - o.h))),
              w: o.w, h: o.h,
            };
          }
          const n = { x: o.x, y: o.y, w: o.w, h: o.h };
          const right = o.x + o.w;
          const bottom = o.y + o.h;
          if (dir.indexOf('e') >= 0) n.w = clamp(o.w + dx, lim.w[0], Math.min(lim.w[1], 100 - o.x));
          if (dir.indexOf('s') >= 0) n.h = clamp(o.h + dy, lim.h[0], Math.min(lim.h[1], 100 - o.y));
          if (dir.indexOf('w') >= 0) { n.w = clamp(o.w - dx, lim.w[0], Math.min(lim.w[1], right)); n.x = right - n.w; }
          if (dir.indexOf('n') >= 0) { n.h = clamp(o.h - dy, lim.h[0], Math.min(lim.h[1], bottom)); n.y = bottom - n.h; }
          return { x: r1(n.x), y: r1(n.y), w: r1(n.w), h: r1(n.h) };
        }

        function addHandles(node, kind, read, write) {
          ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach((dir) => {
            const h = document.createElement('span');
            h.className = 'edh';
            h.dataset.dir = dir;
            h.addEventListener('pointerdown', (e) => drag(e, node, kind, dir, read, write));
            node.appendChild(h);
          });
        }

        /* ── the placeable things on the board ────────────────────────────────── */

        function wirePanel() {
          const node = $('tpanel');
          node.dataset.edMove = '1';
          node.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.edh')) return;
            select('panel');
            drag(e, node, 'panel', 'move',
              () => ({ x: +cfg.panel.x, y: +cfg.panel.y, w: +cfg.panel.w, h: +cfg.panel.h }),
              (b) => { Object.assign(cfg.panel, b); repaint(); });
          });
          addHandles(node, 'panel',
            () => ({ x: +cfg.panel.x, y: +cfg.panel.y, w: +cfg.panel.w, h: +cfg.panel.h }),
            (b) => { Object.assign(cfg.panel, b); repaint(); });
        }

        function wireWeather() {
          const card = $('wxCard');
          if (card.dataset.edWired) return;
          card.dataset.edWired = '1';
          card.addEventListener('pointerdown', (e) => {
            if (!cfg.wx.float) return;
            if (e.target.closest('.edh')) return;
            e.stopPropagation();
            select('today');
            drag(e, card, 'wx', 'move',
              () => ({ x: +getCfg('wx.x', 62), y: +getCfg('wx.y', 1.1), w: +getCfg('wx.w', 22), h: +getCfg('wx.h', 7.6) }),
              (b) => { Object.assign(cfg.wx, b); repaint(); });
          });
          addHandles(card, 'wx',
            () => ({ x: +getCfg('wx.x', 62), y: +getCfg('wx.y', 1.1), w: +getCfg('wx.w', 22), h: +getCfg('wx.h', 7.6) }),
            (b) => { Object.assign(cfg.wx, b); repaint(); });
        }

        /* Every ad at once, so a whole rotation can be arranged in one sitting instead
           of waiting for each to come round. */
        function drawAdBoxes() {
          document.querySelectorAll('.edad').forEach(n => n.remove());
          if (!EDIT) return;
          (cfg.ads || []).forEach((ad, i) => {
            const box = document.createElement('div');
            box.className = 'edad' + (ad.on === false ? ' is-off' : '') + (selAd === ad.id ? ' is-ed-sel' : '');
            box.style.setProperty('--ad-x', ad.x + '%');
            box.style.setProperty('--ad-y', ad.y + '%');
            box.style.setProperty('--ad-w', ad.w + '%');
            box.style.setProperty('--ad-h', ad.h + '%');

            const t = document.createElement('span');
            t.className = 'edad__t';
            t.textContent = ad.title || ('Ad ' + (i + 1));
            box.appendChild(t);

            const d = document.createElement('span');
            d.className = 'edad__d';
            d.textContent = Math.round(ad.w) + '% × ' + Math.round(ad.h) + '%';
            box.appendChild(d);

            const read = () => ({ x: +ad.x, y: +ad.y, w: +ad.w, h: +ad.h });
            const write = (b) => { Object.assign(ad, b); repaint(); };

            box.addEventListener('pointerdown', (e) => {
              if (e.target.closest('.edh')) return;
              selAd = ad.id;
              select('ads');
              drag(e, box, 'ad', 'move', read, write);
            });
            addHandles(box, 'ad', read, write);
            document.body.appendChild(box);
          });
        }

        /* The board's own grid element. Spelled out rather than relying on the outer
           `grid` binding, because this closure also defines a `grid()` helper for laying
           out pairs of fields in the dock, and that name wins inside here. */
        const board = () => $('grid');

        function setCatScale(cat, v) {
          if (!layoutOverride) layoutOverride = {};
          if (!layoutOverride.fonts) layoutOverride.fonts = {};
          layoutOverride.fonts[cat] = clamp(v, 0.7, 1.8);
          const node = board().querySelector('.cat[data-cat="' + cssEsc(cat) + '"]');
          if (node) node.style.setProperty('--cat-scale', String(layoutOverride.fonts[cat]));
          markDirty();
        }

        function cssEsc(v) {
          return (window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/"/g, '\\"');
        }

        /* A row can be dragged onto another category card. Native HTML drag and drop
           rather than pointer maths: the rows scroll inside their card, and the browser's
           own implementation already handles auto-scroll and the drop target. */
        function wireRowDrag() {
          const g = board();
          if (!g) return;
          g.addEventListener('dragstart', (e) => {
            const row = e.target.closest && e.target.closest('.row');
            if (!row) return;
            const id = row.dataset.itemId;
            if (!id) return;
            e.dataTransfer.setData('text/plain', id);
            e.dataTransfer.effectAllowed = 'move';
            row.classList.add('is-ed-drag');
          });
          g.addEventListener('dragend', () => {
            g.querySelectorAll('.is-ed-drag').forEach(n => n.classList.remove('is-ed-drag'));
            g.querySelectorAll('.is-ed-drop').forEach(n => n.classList.remove('is-ed-drop'));
          });
          g.addEventListener('dragover', (e) => {
            const cat = e.target.closest && e.target.closest('.cat');
            if (!cat) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            g.querySelectorAll('.is-ed-drop').forEach(n => { if (n !== cat) n.classList.remove('is-ed-drop'); });
            cat.classList.add('is-ed-drop');
          });
          g.addEventListener('drop', (e) => {
            const cat = e.target.closest && e.target.closest('.cat');
            if (!cat) return;
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const target = cat.dataset.cat;
            g.querySelectorAll('.is-ed-drop').forEach(n => n.classList.remove('is-ed-drop'));
            if (!id || !target) return;
            const item = menuItems.find(m => m.id === id);
            if (!item) return;
            if (!cfg.moves) cfg.moves = {};
            /* Dropped back where the menu already had it: that is a removal, not a move. */
            if (item.category === target) delete cfg.moves[id];
            else cfg.moves[id] = target;
            repaint();
            if (tab === 'layout') renderDock();
          });
        }

        function wirePicks() {
          const head = document.querySelector('header.head');
          if (head) {
            head.dataset.edPick = '1';
            head.addEventListener('click', (e) => { e.preventDefault(); select('header'); });
          }
        }

        function select(which) {
          tab = which;
          Array.from($('edTabs').children).forEach(b => b.classList.toggle('is-on', b.dataset.tab === which));
          document.querySelectorAll('.is-ed-sel').forEach(n => { if (!n.classList.contains('edad')) n.classList.remove('is-ed-sel'); });
          if (which === 'header') {
            const head = document.querySelector('header.head');
            if (head) head.classList.add('is-ed-sel');
          }
          if (which === 'today' || which === 'panel') {
            tab = 'today';
            $('tpanel').classList.add('is-ed-sel');
            Array.from($('edTabs').children).forEach(b => b.classList.toggle('is-on', b.dataset.tab === 'today'));
          }
          drawAdBoxes();
          renderDock();
        }

        /* ── the dock ─────────────────────────────────────────────────────────── */

        function el(html) {
          const t = document.createElement('template');
          t.innerHTML = html.trim();
          return t.content.firstElementChild;
        }

        function field(label, value, onInput, opts) {
          const o = opts || {};
          const wrap = el('<label class="ed__f"><span></span></label>');
          wrap.firstElementChild.textContent = label;
          const input = document.createElement(o.tag || 'input');
          if (!o.tag) input.type = o.type || 'text';
          if (o.min !== undefined) input.min = o.min;
          if (o.max !== undefined) input.max = o.max;
          if (o.lang) input.lang = o.lang;
          if (o.placeholder) input.placeholder = o.placeholder;
          input.value = value == null ? '' : value;
          input.addEventListener('input', () => onInput(input.value));
          wrap.appendChild(input);
          return wrap;
        }

        function selectField(label, value, options, onChange) {
          const wrap = el('<label class="ed__f"><span></span></label>');
          wrap.firstElementChild.textContent = label;
          const sel = document.createElement('select');
          options.forEach(([v, l]) => {
            const opt = document.createElement('option');
            opt.value = v; opt.textContent = l;
            sel.appendChild(opt);
          });
          sel.value = value;
          sel.addEventListener('change', () => onChange(sel.value));
          wrap.appendChild(sel);
          return wrap;
        }

        function slider(label, value, min, max, onInput) {
          const row = document.createElement('div');
          row.className = 'ed__row';
          const lab = document.createElement('label');
          lab.textContent = label;
          const val = document.createElement('span');
          val.style.cssText = 'width:34px;text-align:right;color:#8e93a8;font-variant-numeric:tabular-nums';
          const rng = document.createElement('input');
          rng.type = 'range'; rng.min = String(min); rng.max = String(max); rng.step = '0.05';
          rng.style.flex = '1';
          rng.value = String(value);
          val.textContent = Number(value).toFixed(2);
          rng.addEventListener('input', () => {
            val.textContent = Number(rng.value).toFixed(2);
            onInput(parseFloat(rng.value));
          });
          row.append(lab, rng, val);
          return row;
        }

        function hindiFor(text) {
          const q = String(text || '').trim().toLowerCase();
          if (!q) return '';
          let hit = menuItems.find(m => String(m.name || '').trim().toLowerCase() === q);
          if (!hit) hit = menuItems.find(m => String(m.name || '').trim().toLowerCase().indexOf(q) === 0);
          if (!hit) hit = menuItems.find(m => q.indexOf(String(m.name || '').trim().toLowerCase()) === 0);
          if (!hit) {
            const cat = menuItems.find(m => String(m.category || '').trim().toLowerCase() === q);
            if (cat) return cat.cat_hi || '';
          }
          return (hit && hit.name_hi) || '';
        }

        function withFlag(fieldEl, readEnglish, write) {
          const input = fieldEl.querySelector('input, textarea');
          const bar = document.createElement('div');
          bar.style.cssText = 'display:flex;gap:6px;align-items:center';
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ed__btn ed__btn--icon';
          btn.title = 'Load Hindi from Menu Master';
          btn.textContent = FLAG;
          btn.addEventListener('click', () => {
            const hi = hindiFor(readEnglish());
            if (!hi) { Toast.error('No Hindi on file', 'Menu Master has no Hindi for that text.'); return; }
            input.value = hi;
            write(hi);
          });
          input.parentNode.insertBefore(bar, input);
          input.style.flex = '1';
          bar.append(input, btn);
          return fieldEl;
        }

        function toggle(label, checked, onChange) {
          const row = el('<div class="ed__row"><label></label></div>');
          row.firstElementChild.textContent = label;
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = !!checked;
          box.addEventListener('change', () => onChange(box.checked));
          row.appendChild(box);
          return row;
        }

        function grid() {
          const g = document.createElement('div');
          g.className = 'ed__grid';
          for (const child of arguments) g.appendChild(child);
          return g;
        }

        function section(title, note) {
          const s = document.createElement('div');
          s.className = 'ed__sec';
          const h = document.createElement('p');
          h.className = 'ed__h';
          h.textContent = title;
          s.appendChild(h);
          if (note) {
            const n = document.createElement('p');
            n.className = 'ed__note';
            n.textContent = note;
            s.appendChild(n);
          }
          return s;
        }

        function renderDock() {
          const body = dockBody();
          body.textContent = '';
          if (tab === 'header') renderHeader(body);
          else if (tab === 'today') renderToday(body);
          else if (tab === 'fx') renderFx(body);
          else if (tab === 'anim') renderAnim(body);
          else if (tab === 'layout') renderLayout(body);
          else if (tab === 'ads') renderAds(body);
        }

        function renderHeader(body) {
          const s = section('Header', 'The name across the top of the board, and the hours that decide when the morning menu shows.');
          s.appendChild(field('Name on the board', getCfg('identity.restaurantName', ''), v => setCfg('identity.restaurantName', v)));
          s.appendChild(withFlag(
            field('Name in Hindi', getCfg('identity.restaurantNameHi', ''), v => setCfg('identity.restaurantNameHi', v), { lang: 'hi' }),
            () => getCfg('identity.restaurantName', ''),
            v => setCfg('identity.restaurantNameHi', v)));
          s.appendChild(grid(
            field('Morning from', getCfg('identity.morningFrom', '07:00'), v => setCfg('identity.morningFrom', v), { placeholder: '07:00' }),
            field('…until', getCfg('identity.morningTo', '11:00'), v => setCfg('identity.morningTo', v), { placeholder: '11:00' }),
          ));
          s.appendChild(grid(
            field('Evening from', getCfg('identity.eveningFrom', '17:00'), v => setCfg('identity.eveningFrom', v), { placeholder: '17:00' }),
            field('…until', getCfg('identity.eveningTo', '23:00'), v => setCfg('identity.eveningTo', v), { placeholder: '23:00' }),
          ));
          s.appendChild(field('Language swap (seconds)', getCfg('identity.langSwitchSeconds', 10), v => setCfg('identity.langSwitchSeconds', +v || 10), { type: 'number', min: 4, max: 30 }));
          body.appendChild(s);
        }

        function renderToday(body) {
          const s = section('Today panel', 'The clock, the weather card and the festival line. Drag the panel on the board to place it.');
          s.appendChild(toggle('Show the Today panel', cfg.panel.on !== false, v => setCfg('panel.on', v)));
          s.appendChild(toggle('Show the weather card', cfg.panel.wx !== false, v => setCfg('panel.wx', v)));
          s.appendChild(toggle('Show today’s festival', cfg.panel.fest !== false, v => setCfg('panel.fest', v)));
          s.appendChild(toggle('Place the weather card separately', !!cfg.wx.float, v => {
            setCfg('wx.float', v);
            wireWeather();
          }));
          body.appendChild(s);

          const w = section('Weather', 'Open-Meteo — no API key, just where this screen physically is.');
          w.appendChild(grid(
            field('Latitude', getCfg('wx.lat', ''), v => setCfg('wx.lat', v === '' ? '' : +v), { type: 'number' }),
            field('Longitude', getCfg('wx.lon', ''), v => setCfg('wx.lon', v === '' ? '' : +v), { type: 'number' }),
          ));
          w.appendChild(grid(
            field('Place label', getCfg('wx.place', ''), v => setCfg('wx.place', v)),
            selectField('Unit', getCfg('wx.unit', 'C'), [['C', '°C'], ['F', '°F']], v => setCfg('wx.unit', v)),
          ));
          const refresh = el('<button class="ed__add" type="button">Refresh the reading</button>');
          refresh.addEventListener('click', () => { void refreshWeather(false); });
          w.appendChild(refresh);
          body.appendChild(w);
        }

        function renderFx(body) {
          const s = section('Celebrations', 'The canvas animation that plays on a festival day.');
          s.appendChild(toggle('Celebrations on', cfg.fx.on !== false, v => setCfg('fx.on', v)));
          s.appendChild(selectField('Default animation', getCfg('fx.anim', 'pushpa'), FX_CHOICES, v => setCfg('fx.anim', v)));
          s.appendChild(grid(
            field('Every (minutes)', getCfg('fx.everyMin', 15), v => setCfg('fx.everyMin', +v || 15), { type: 'number', min: 1, max: 720 }),
            field('Show for (seconds)', getCfg('fx.forSec', 9), v => setCfg('fx.forSec', +v || 9), { type: 'number', min: 2, max: 60 }),
          ));
          const play = el('<button class="ed__add" type="button">Play it now</button>');
          play.addEventListener('click', () => { FX.play(getCfg('fx.anim', 'pushpa'), getCfg('fx.forSec', 9)); });
          s.appendChild(play);
          body.appendChild(s);
        }

        function renderAnim(body) {
          const s = section('Card animations', 'A periodic flourish across the category cards — a gentle “still alive” motion, not a celebration.');
          s.appendChild(toggle('Card animation on', !!cfg.divAnim.on, v => setCfg('divAnim.on', v)));
          s.appendChild(selectField('Style', getCfg('divAnim.style', 'slide'), [
            ['slide', 'Slide'],
            ['drawer', 'Drawer'],
            ['flip', 'Flip'],
            ['zoom', 'Zoom'],
            ['fade', 'Fade up'],
            ['swing', 'Swing'],
          ], v => setCfg('divAnim.style', v)));
          s.appendChild(field('Every (minutes)', getCfg('divAnim.everyMin', 5), v => setCfg('divAnim.everyMin', +v || 5), { type: 'number', min: 1, max: 720 }));
          const play = el('<button class="ed__add" type="button">Play it now</button>');
          play.addEventListener('click', () => { try { DivAnim.play(true); } catch (e) { } });
          s.appendChild(play);
          body.appendChild(s);
        }

        /* Festival days are not here on purpose: they are a calendar, not a layout, and a
           calendar is easier to keep in a table in the Admin Portal than in a floating panel
           over a menu. This page still *plays* them — see the Celebrations tab. */

        function renderLayout(body) {
          const s1 = section('Order', 'How the rows inside every category are listed.');
          s1.appendChild(selectField('Sort items by', getCfg('sort', 'menu'), [
            ['menu', 'Menu Master order'],
            ['name', 'Item name (A–Z)'],
            ['price', 'Price (low to high)'],
          ], v => { cfg.sort = v; repaint(); }));
          body.appendChild(s1);

          const s2 = section('Categories', 'Rename a heading for this screen only, and scale its type. The menu itself is untouched.');
          const cats = [...new Set(menuItems.map(effCategory))].filter(Boolean);
          cats.forEach((cat) => {
            const card = document.createElement('div');
            card.className = 'ed__card';
            const hd = el('<div class="ed__cardhd"><strong></strong></div>');
            hd.firstElementChild.textContent = cat;
            card.appendChild(hd);
            if (!cfg.cats) cfg.cats = {};
            if (!cfg.cats[cat]) cfg.cats[cat] = {};
            const ov = cfg.cats[cat];
            card.appendChild(field('Heading', ov.label || '', v => { ov.label = v; repaint(); }, { placeholder: cat }));
            const src = menuItems.find(m => effCategory(m) === cat);
            card.appendChild(withFlag(
              field('Heading (Hindi)', ov.labelHi || '', v => { ov.labelHi = v; repaint(); }, { lang: 'hi', placeholder: (src && src.cat_hi) || '' }),
              () => ov.label || cat,
              v => { ov.labelHi = v; repaint(); }));
            card.appendChild(slider('Type size', getCatFontScale(cat), 0.7, 1.8, v => { ov.fs = v; setCatScale(cat, v); }));
            s2.appendChild(card);
          });
          if (!cats.length) s2.appendChild(el('<p class="ed__note">This board has no categories yet.</p>'));
          body.appendChild(s2);

          const s3 = section('Moved items', 'Drag a row from one category card to another to show it there — on this screen only. Menu Master, the till and every other screen keep it where it was.');
          const moved = Object.keys(cfg.moves || {});
          if (!moved.length) {
            s3.appendChild(el('<p class="ed__note">Nothing moved.</p>'));
          } else {
            moved.forEach((id) => {
              const it = menuItems.find(m => m.id === id);
              const row = document.createElement('div');
              row.className = 'ed__row';
              const lab = document.createElement('label');
              lab.textContent = (it ? it.name : id) + ' → ' + cfg.moves[id];
              const undo = el('<button class="ed__x" type="button" aria-label="Put back">✕</button>');
              undo.addEventListener('click', () => { delete cfg.moves[id]; repaint(); renderDock(); });
              row.append(lab, undo);
              s3.appendChild(row);
            });
          }
          body.appendChild(s3);
        }

        function renderAds(body) {
          const s = section('Ads', 'Drag each box on the board to place it. Tag a dish and the board draws its live name and price.');
          (cfg.ads || []).forEach((ad, i) => {
            const card = document.createElement('div');
            card.className = 'ed__card' + (selAd === ad.id ? ' is-on' : '');
            card.addEventListener('click', (e) => {
              if (e.target.closest('input,select,button')) return;
              selAd = ad.id; drawAdBoxes(); renderDock();
            });

            const hd = el('<div class="ed__cardhd"><strong></strong></div>');
            hd.firstElementChild.textContent = ad.title || ('Ad ' + (i + 1));
            const on = document.createElement('input');
            on.type = 'checkbox'; on.checked = ad.on !== false;
            on.title = 'On';
            on.addEventListener('change', () => { ad.on = on.checked; repaint(); });
            hd.appendChild(on);
            const x = el('<button class="ed__x" type="button" aria-label="Remove">✕</button>');
            x.addEventListener('click', () => { cfg.ads.splice(i, 1); if (selAd === ad.id) selAd = null; repaint(); renderDock(); });
            hd.appendChild(x);
            card.appendChild(hd);

            card.appendChild(field('Title', ad.title || '', v => { ad.title = v; hd.firstElementChild.textContent = v || ('Ad ' + (i + 1)); repaint(); }));
            card.appendChild(withFlag(
              field('Title (Hindi)', ad.hi || '', v => { ad.hi = v; repaint(); }, { lang: 'hi' }),
              () => ad.title || '',
              v => { ad.hi = v; repaint(); }));
            card.appendChild(field('Text', ad.text || '', v => { ad.text = v; markDirty(); }));
            card.appendChild(grid(
              field('Price', ad.price || '', v => { ad.price = v; markDirty(); }),
              field('Every (min)', ad.everyMin, v => { ad.everyMin = +v || 8; markDirty(); }, { type: 'number', min: 1, max: 720 }),
            ));
            card.appendChild(grid(
              field('For (sec)', ad.forSec, v => { ad.forSec = +v || 10; markDirty(); }, { type: 'number', min: 3, max: 60 }),
              field('Photo URL', '', v => { if (v.trim()) { ad.images = (ad.images || []).concat(v.trim()).slice(0, 6); markDirty(); } }, { placeholder: 'Paste and it is added' }),
            ));

            card.appendChild(selectField('Entrance', ad.anim || 'ad-in', AD_ANIM_LABELS, v => { ad.anim = v; repaint(); }));

            const play = document.createElement('div');
            play.className = 'ed__row';
            const bSample = el('<button class="ed__btn" type="button">Show still</button>');
            bSample.addEventListener('click', () => { selAd = ad.id; Ads.sample(ad); });
            const bPlay = el('<button class="ed__btn" type="button">Play</button>');
            bPlay.addEventListener('click', () => { selAd = ad.id; Ads.preview(ad); });
            const bStop = el('<button class="ed__btn" type="button">Hide</button>');
            bStop.addEventListener('click', () => Ads.stop());
            play.append(bSample, bPlay, bStop);
            card.appendChild(play);

            card.appendChild(slider('Title size', ad.fsTitle || 1, 0.6, 2, v => { ad.fsTitle = v; repaint(); }));
            card.appendChild(slider('Hindi size', ad.fsHi || 1, 0.6, 2, v => { ad.fsHi = v; repaint(); }));
            card.appendChild(slider('Text size', ad.fsText || 1, 0.6, 2, v => { ad.fsText = v; repaint(); }));
            card.appendChild(slider('Price size', ad.fsPrice || 1, 0.6, 2, v => { ad.fsPrice = v; repaint(); }));

            if (!ad.img) ad.img = { x: 0, y: 0, w: 34, h: 100, fit: 'cover' };
            card.appendChild(grid(
              field('Photo x %', ad.img.x, v => { ad.img.x = +v || 0; repaint(); }, { type: 'number' }),
              field('Photo y %', ad.img.y, v => { ad.img.y = +v || 0; repaint(); }, { type: 'number' }),
            ));
            card.appendChild(grid(
              field('Photo w %', ad.img.w, v => { ad.img.w = +v || 34; repaint(); }, { type: 'number' }),
              field('Photo h %', ad.img.h, v => { ad.img.h = +v || 100; repaint(); }, { type: 'number' }),
            ));
            card.appendChild(selectField('Photo fit', ad.img.fit || 'cover', [['cover', 'Fill the box'], ['contain', 'Fit inside']], v => { ad.img.fit = v; repaint(); }));

            /* Tagged dishes, picked out of the menu this board is already showing. */
            const tagWrap = document.createElement('div');
            (ad.items || []).forEach((id) => {
              const it = menuItems.find(m => m.id === id);
              if (!it) return;
              const chip = el('<span class="ed__chip"></span>');
              if (it.image) {
                const img = document.createElement('img');
                img.className = 'ed__chipimg'; img.src = it.image; img.alt = '';
                chip.appendChild(img);
              }
              chip.appendChild(document.createTextNode(it.name + ' ₹' + it.price));
              const rm = el('<button class="ed__x" type="button" aria-label="Untag">✕</button>');
              rm.addEventListener('click', () => {
                ad.items = ad.items.filter(t => t !== id);
                repaint(); renderDock();
              });
              chip.appendChild(rm);
              tagWrap.appendChild(chip);
            });
            card.appendChild(tagWrap);

            const find = el('<div class="ed__find"></div>');
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Search the menu to tag a dish…';
            const hits = document.createElement('ul');
            hits.className = 'ed__hits';
            hits.hidden = true;
            input.addEventListener('input', () => {
              const q = input.value.trim().toLowerCase();
              hits.textContent = '';
              if (!q) { hits.hidden = true; return; }
              const found = menuItems.filter(m =>
                (ad.items || []).indexOf(m.id) < 0 &&
                (m.name.toLowerCase().indexOf(q) >= 0 || (m.category || '').toLowerCase().indexOf(q) >= 0)
              ).slice(0, 8);
              found.forEach((m) => {
                const li = document.createElement('li');
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'ed__hit';
                if (m.image) { const im = document.createElement('img'); im.src = m.image; im.alt = ''; b.appendChild(im); }
                const nm = document.createElement('b'); nm.textContent = m.name; b.appendChild(nm);
                const pr = document.createElement('span'); pr.textContent = '₹' + m.price; b.appendChild(pr);
                b.addEventListener('click', () => {
                  ad.items = (ad.items || []).concat(m.id).slice(0, 8);
                  input.value = ''; hits.hidden = true;
                  repaint(); renderDock();
                });
                li.appendChild(b);
                hits.appendChild(li);
              });
              hits.hidden = found.length === 0;
            });
            find.appendChild(input);
            find.appendChild(hits);
            card.appendChild(find);
            s.appendChild(card);
          });

          const add = el('<button class="ed__add" type="button">Add an ad</button>');
          add.addEventListener('click', () => {
            if (!Array.isArray(cfg.ads)) cfg.ads = [];
            const ad = normalizeAd({ id: 'ad-' + Date.now().toString(36), title: 'New ad', on: true }, cfg.ads.length);
            cfg.ads.push(ad);
            selAd = ad.id;
            repaint(); renderDock();
          });
          s.appendChild(add);
          body.appendChild(s);
        }

        /* ── saving ───────────────────────────────────────────────────────────── */

        async function save() {
          if (!token || !SCREEN_ID) {
            Toast.error('Cannot save', 'This window was not opened from the Admin Portal.');
            return;
          }
          const btn = $('edSave');
          btn.disabled = true;
          try {
            const res = await fetch('/api/v1/menu-board/screens/' + encodeURIComponent(SCREEN_ID), {
              method: 'PATCH',
              headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
              body: JSON.stringify({ config: buildConfigPayload() }),
            });
            const body = await res.json().catch(() => null);
            if (!res.ok) throw new Error((body && body.error && body.error.message) || ('HTTP ' + res.status));
            baseline = snapshotCfg();
            markDirty();
            Toast.refresh('Published — every screen on this board has it now.');
          } catch (err) {
            Toast.error('Could not save', (err && err.message) || String(err));
          } finally {
            btn.disabled = false;
          }
        }

        /* Only the fields the board actually owns are sent. `identity` and `layout` ride
           along because the header and the column arrangement are edited here too. */
        function buildConfigPayload() {
          const num = (v) => { const f = parseFloat(v); return isNaN(f) ? undefined : f; };
          const clean = (o) => {
            const out = {};
            Object.keys(o).forEach((k) => { if (o[k] !== undefined && o[k] !== null && o[k] !== '') out[k] = o[k]; });
            return out;
          };
          return {
            identity: clean({
              restaurantName: cfg.identity && cfg.identity.restaurantName,
              restaurantNameHi: cfg.identity && cfg.identity.restaurantNameHi,
              langSwitchSeconds: num(cfg.identity && cfg.identity.langSwitchSeconds),
              morningFrom: cfg.identity && cfg.identity.morningFrom,
              morningTo: cfg.identity && cfg.identity.morningTo,
              eveningFrom: cfg.identity && cfg.identity.eveningFrom,
              eveningTo: cfg.identity && cfg.identity.eveningTo,
            }),
            layout: layoutOverride && layoutOverride.columns
              ? clean({ columns: layoutOverride.columns, fonts: layoutOverride.fonts })
              : undefined,
            board: clean({
              panel: clean({ on: cfg.panel.on, x: num(cfg.panel.x), y: num(cfg.panel.y), w: num(cfg.panel.w), h: num(cfg.panel.h), wx: cfg.panel.wx, fest: cfg.panel.fest }),
              wx: clean({ lat: num(cfg.wx.lat), lon: num(cfg.wx.lon), place: cfg.wx.place, unit: cfg.wx.unit, float: cfg.wx.float, x: num(cfg.wx.x), y: num(cfg.wx.y), w: num(cfg.wx.w), h: num(cfg.wx.h) }),
              fx: clean({ on: cfg.fx.on, anim: cfg.fx.anim, everyMin: num(cfg.fx.everyMin), forSec: num(cfg.fx.forSec) }),
              hol: clean({ key: cfg.hol && cfg.hol.key, country: cfg.hol && cfg.hol.country }),
              divAnim: clean({ on: cfg.divAnim.on, style: cfg.divAnim.style, everyMin: num(cfg.divAnim.everyMin) }),
              sort: cfg.sort,
              moves: cfg.moves && Object.keys(cfg.moves).length ? cfg.moves : undefined,
              cats: cfg.cats && Object.keys(cfg.cats).length ? cfg.cats : undefined,
              days: (cfg.days || []).map(d => clean({ d: d.d, n: d.n, h: d.h, a: d.a })),
              ads: (cfg.ads || []).map(a => clean({
                id: a.id, on: a.on, title: a.title, hi: a.hi, text: a.text, price: a.price,
                fs: num(a.fs), fsTitle: num(a.fsTitle), fsHi: num(a.fsHi), fsText: num(a.fsText), fsPrice: num(a.fsPrice),
                anim: a.anim,
                img: a.img ? clean({ x: num(a.img.x), y: num(a.img.y), w: num(a.img.w), h: num(a.img.h), fit: a.img.fit }) : undefined,
                images: (a.images || []).filter(Boolean),
                items: (a.items || []).filter(Boolean),
                everyMin: num(a.everyMin), forSec: num(a.forSec),
                x: num(a.x), y: num(a.y), w: num(a.w), h: num(a.h),
              })),
            }),
          };
        }

        /* ── start ────────────────────────────────────────────────────────────── */

        /* The settings panel itself: dragged by its header, resized from its corner, and
           remembered between sessions so it does not land back on top of the thing somebody
           spent the last five minutes positioning. Pixels here, not percentages — this one
           box is chrome, not part of the layout being published. */
        function wirePanelChrome() {
          const panel = $('edPanel');
          const KEY = 'menuBoardEditorPanel';

          let box = { x: 24, y: 24, w: 360, h: Math.min(560, window.innerHeight - 80) };
          try {
            const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
            if (saved && typeof saved === 'object') box = Object.assign(box, saved);
          } catch (e) { }

          function apply() {
            const maxX = Math.max(0, window.innerWidth - 120);
            const maxY = Math.max(0, window.innerHeight - 60);
            box.x = clamp(box.x, 0, maxX);
            box.y = clamp(box.y, 0, maxY);
            box.w = clamp(box.w, 300, Math.max(300, window.innerWidth - 20));
            box.h = clamp(box.h, 140, Math.max(140, window.innerHeight - 20));
            panel.style.setProperty('--ex', box.x + 'px');
            panel.style.setProperty('--ey', box.y + 'px');
            panel.style.setProperty('--ew', box.w + 'px');
            panel.style.setProperty('--eh', box.h + 'px');
          }

          function remember() {
            try { localStorage.setItem(KEY, JSON.stringify(box)); } catch (e) { }
          }

          function gesture(handle, onMove) {
            handle.addEventListener('pointerdown', (e) => {
              if (e.target.closest('button')) return;
              e.preventDefault();
              const start = { x: e.clientX, y: e.clientY };
              const origin = { x: box.x, y: box.y, w: box.w, h: box.h };
              let frame = 0;
              try { handle.setPointerCapture(e.pointerId); } catch (err) { }

              const paint = () => { frame = 0; apply(); };
              const move = (ev) => {
                onMove(origin, ev.clientX - start.x, ev.clientY - start.y);
                if (!frame) frame = requestAnimationFrame(paint);
              };
              const up = () => {
                handle.removeEventListener('pointermove', move);
                handle.removeEventListener('pointerup', up);
                handle.removeEventListener('pointercancel', up);
                if (frame) cancelAnimationFrame(frame);
                apply();
                remember();
              };
              handle.addEventListener('pointermove', move);
              handle.addEventListener('pointerup', up);
              handle.addEventListener('pointercancel', up);
            });
          }

          gesture($('edGrab'), (o, dx, dy) => { box.x = o.x + dx; box.y = o.y + dy; });
          gesture($('edGrip'), (o, dx, dy) => { box.w = o.w + dx; box.h = o.h + dy; });

          $('edMin').addEventListener('click', () => {
            const min = panel.classList.toggle('is-min');
            $('edMin').textContent = min ? '+' : '–';
            $('edMin').title = min ? 'Expand' : 'Collapse';
          });

          window.addEventListener('resize', apply);
          apply();
        }

        function start(accessToken) {
          token = accessToken;
          document.body.classList.add('is-editing');
          $('editor').hidden = false;
          document.title = 'Board editor · ' + (SCREEN || 'default');
          wirePanelChrome();
          /* The rows on screen were drawn before the editor existed, and a row only becomes
             draggable while it is being edited — so they are drawn again now that it does. */
          render();
          $('edScreen').textContent = SCREEN ? SCREEN + (screenName ? ' · ' + screenName : '') : 'default screen';
          baseline = snapshotCfg();

          wirePanel();
          wireWeather();
          wirePicks();
          wireRowDrag();
          drawAdBoxes();

          Array.from($('edTabs').children).forEach((b) => {
            b.addEventListener('click', () => { selAd = null; select(b.dataset.tab); });
          });
          $('edSave').addEventListener('click', () => { void save(); });
          $('edClose').addEventListener('click', () => {
            if (dirty && !confirm('Close without saving? The changes since the last save are lost.')) return;
            window.close();
          });
          $('edRevert').addEventListener('click', () => {
            if (!confirm('Discard every change since this window opened?')) return;
            loadData().then(() => { render(); Panel.render(); baseline = snapshotCfg(); drawAdBoxes(); renderDock(); markDirty(); });
          });

          window.addEventListener('beforeunload', (e) => {
            if (!dirty) return;
            e.preventDefault();
            e.returnValue = '';
          });

          select('header');
        }

        return { start: start, active: () => !!token };
      })();

      /* The handshake. The portal opens this window and posts a token in; nothing else
         turns the editor on, which is what keeps it off a wall screen. */
      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || msg.source !== 'menu-board-editor') return;

        if (msg.type === 'placing' && PREVIEW) {
          document.documentElement.classList.toggle('is-placing', !!msg.active);
          return;
        }
        if (msg.type === 'token' && EDIT && !Editor.active() && typeof msg.token === 'string' && msg.token) {
          Editor.start(msg.token);
        }
      });
      /* Every line here names something a person standing at the screen can actually
         check. The board is unattended, so whoever reads this is the person who came
         to find out why the wall is blank. */
      function showBootError(errors) {
        const box = $('bootErr');
        box.textContent = '';
        box.appendChild(el('b', null, 'Could not load the menu'));
        box.appendChild(document.createTextNode('1. The CanteenOS server must be running and reachable'));
        box.appendChild(document.createElement('br'));
        box.appendChild(document.createTextNode(SCREEN
          ? '2. A menu board screen with code “' + SCREEN + '” must exist in the Admin Portal'
          : '2. At least one menu board screen must exist in the Admin Portal'));
        box.appendChild(document.createElement('br'));
        box.appendChild(document.createTextNode('3. That screen must point at a published menu'));
        box.appendChild(document.createElement('br'));
        box.appendChild(el('code', null, (errors || []).join(' · ')));
        box.hidden = false;
        $('bootSub').textContent = 'Failed to load';
        $('bootRetry').hidden = false;
        Lottie.mount($('bootLot'), 'error');
      }

      let booted = false;
      let wired = false;

      /* Ambient golden motes, as on the original board. */
      (function motes() {
        const box = $('motes');
        if (!box || reduced) return;
        for (let i = 0; i < 14; i++) {
          const m = el('div', 'mote');
          m.style.left = (Math.random() * 100) + '%';
          m.style.animationDuration = (16 + Math.random() * 20) + 's';
          m.style.animationDelay = (-Math.random() * 30) + 's';
          const s = 3 + Math.random() * 4;
          m.style.width = s + 'px';
          m.style.height = s + 'px';
          box.appendChild(m);
        }
      })();

      async function init() {
        Lottie.scan(document);
        if (!booted) {
          booted = true;
          updateClock();
          setInterval(updateClock, 10000);
        }
        updateLivePill();

        const ok = await loadData();
        updateLivePill();                 // the first fetch is what "Live" now means
        if (!ok) { showBootError(window.__loadErrors); return; }

        loadConfig();
        Panel.render();

        $('boot').classList.add('is-gone');
        setTimeout(() => { $('boot').hidden = true; Lottie.unmount($('bootLot')); }, 420);
        $('app').setAttribute('aria-hidden', 'false');
        $('app').classList.add('is-ready');

        render('fresh');

        /* The fit pass measures real text, so re-run it once the web fonts land. */
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Fit.schedule());

        if (!wired) {
          wired = true;
          /* Local re-render only — catches the morning/all-day boundary. No network. */
          setInterval(() => render(), 60000);
          connectLiveUpdates();

          /* Today panel, celebrations, ad board. */
          refreshWeather(true);
          setInterval(() => refreshWeather(true), 20 * 60000);
          scheduleFX();
          DivAnim.schedule();
          Ads.start();
        }

        /* The menu is on screen; if this window was opened to edit it, ask the portal that
           opened it for a token. Without an opener — a wall screen, or the URL pasted into a
           fresh tab — nothing answers, and the board simply stays read-only. */
        if (EDIT && !Editor.active() && window.opener) {
          try {
            window.opener.postMessage({ source: 'menu-board', type: 'ready', screen: SCREEN }, '*');
          } catch (e) { }
        }
      }

      $('bootRetry').addEventListener('click', () => {
        $('bootErr').hidden = true;
        $('bootRetry').hidden = true;
        $('bootSub').textContent = 'Preparing today\'s menu…';
        Lottie.mount($('bootLot'), 'loading');
        init();
      });

      window.addEventListener('error', (e) => {
        console.error('[board]', e.error || e.message);
        if ($('app').classList.contains('is-ready')) Toast.error('Unexpected error', String((e.error && e.error.message) || e.message));
      });
      window.addEventListener('unhandledrejection', (e) => {
        console.error('[board] unhandled promise rejection', e.reason);
      });

      init();

    })();
  </script>
</body>

</html>
